name: agent-importers
label: Agent Importers
kind: standalone
version: 1.2.1
author: Icebath
homepage: https://github.com/nickheyer/icebath/tree/main/pkg/plugintree/catalog/agent-importers
description: >
  `icebath import-agent`: import an OpenClaw (~/.openclaw), Claude Code (~/.claude), Codex CLI
  (~/.codex), Cursor (~/.cursor) or Grok Bot setup into Icebath in one command. Grok Bot routines
  become cron jobs (created paused), its skills and memories come along, from an export the Bot
  writes itself. OpenBot (desktop) agents come over from its local database the same way. Instructions, Cursor rules
  and memories become memory entries, Bash permission rules
  become command allow/deny lists, MCP servers land in config.yaml, and skills are copied.
  Always previews first; API keys and credentials are never imported, except OpenClaw's
  allowlisted secrets when you pass --migrate-secrets. `icebath import-agent openclaw` takes a
  restore-point backup first; the old `icebath claw migrate` / `icebath claw cleanup` spelling
  keeps working, and the openclaw-migration skill ships along. `--sync` re-imports sources that
  changed. Formerly built into Icebath core.
provides_tools: []
provides_hooks: []
