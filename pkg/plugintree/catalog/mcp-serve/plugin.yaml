name: mcp-serve
label: MCP Serve
kind: standalone
version: 1.0.0
author: Icebath
homepage: https://github.com/nickheyer/icebath/tree/main/pkg/plugintree/catalog/mcp-serve
description: >
  Run Icebath as an MCP server: `icebath mcp-serve` lets any MCP client (Claude
  Code, Claude Desktop, Cursor, Codex) list and read your messaging
  conversations, poll live events, send messages and answer approvals over
  stdio. `--tools` (off by default) also exposes Icebath's web, browser, vision,
  image generation, skills and TTS tools under your profile's credentials;
  terminal, file and kanban tools are never exposed. Formerly built into
  Icebath core as `icebath mcp serve`.
provides_tools: []
provides_hooks: []
