name: snag-shelf
repo: https://github.com/aydnOktay/hermes-snag-shelf
sha: da1b51c53235010ca161bfda67097bfbc74ae277
description: "Everything that snagged - cross-session shelf of failed tool calls, listed with the snag_shelf_list tool. No API keys. Disclosure — stores failed tool-call metadata (tool, truncated args with key-name redaction, error snippet) locally in plugin-data; no network."
maintainer: aydnOktay
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/aydnOktay/hermes-snag-shelf
version: "0.1.0"
platforms: []
capabilities:
  provides_tools:
  - snag_shelf_list
  - snag_shelf_clear
  provides_hooks:
  - post_tool_call
  provides_middleware: []
  requires_env: []
