description: '`icebath import-agent`: import an OpenClaw (~/.openclaw, or legacy ~/.clawdbot / ~/.moltbot), Claude
  Code (~/.claude), Codex CLI (~/.codex), Cursor (~/.cursor), Grok Bot (a self-export the Bot writes
  from a prompt the importer prints) or OpenBot desktop (its openbot.db) setup into icebath in one
  command; always previews first and asks before applying. Claude Code / Codex / Cursor: instructions,
  Cursor rules and memories become memory entries, Bash permission rules become command allow/deny
  lists, MCP servers land in config.yaml, skills are copied, and `--sync` re-imports sources that
  changed. OpenClaw (`icebath import-agent openclaw`, also spelled `icebath claw migrate`, with
  `icebath claw cleanup` and the openclaw-migration skill): persona, memories, skills, model and
  messaging settings, MCP servers and agent behaviour. Formerly built into icebath core; profiles with
  a registered sync source are migrated automatically. Disclosure: compiled into icebath, no network
  calls and no model calls. Claude Code / Codex / Cursor: reads those agents'' local config trees
  (never their credential files; secret-looking MCP env vars and headers are stripped and listed) and
  writes only into the active profile (memories/MEMORY.md with a backup, config.yaml, skills/ and
  import-sync.json). OpenClaw: reads the OpenClaw dir (openclaw.json, its .env, workspace files such
  as SOUL.md / MEMORY.md / USER.md, skills); API keys and bot tokens come over only with
  --migrate-secrets (allowlisted names, shown in the preview). It writes into the active profile
  (config.yaml, .env, SOUL.md, memories/, skills/openclaw-imports/, a migration/openclaw/<time>/
  report with item backups, and a backups/pre-migration-*.zip restore point), plus a workspace dir
  only when --workspace-target names one. It runs local pgrep / systemctl / tasklist checks to warn
  when OpenClaw or an icebath gateway is still running, and `icebath claw cleanup` renames the
  OpenClaw dir to *.pre-migration after a confirmation. Grok Bot / OpenBot: instructions become
  SOUL.md, memories and user facts become memory entries, skills land in skills/<source>-imports/,
  scheduled routines become paused cron jobs (--activate-routines to start them) and event routines a
  notes file; credential-looking export keys refuse the file, and secret MCP env vars and headers are
  stripped and listed. OpenBot''s database is opened read-only (or read from a scratch copy that is
  deleted after the read).'
