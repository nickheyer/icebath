name: langfuse
repo: https://github.com/nickheyer/icebath
sha: c4086924ceea40d1dc5526d66f90156e80f5cdd9
subdir: pkg/plugintree/catalog/langfuse
description: 'Langfuse observability for icebath: one trace per turn, one generation per LLM call (usage and cost
  from icebath''s own pricing, cache and reasoning tokens included), one observation per tool call and
  subagent. Content capture is sanitized by default (metadata-only and full are opt-in); sends traces
  only to the Langfuse project whose keys you set. Formerly built into icebath core as
  observability/langfuse; existing users are migrated automatically.'
maintainer: icebath
tier: official
category: general
version: "2.0.0"
docs_url: https://github.com/nickheyer/icebath/tree/main/pkg/plugintree/catalog/langfuse
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_finalize
    - on_session_end
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env:
    - ICEBATH_LANGFUSE_PUBLIC_KEY
    - ICEBATH_LANGFUSE_SECRET_KEY
