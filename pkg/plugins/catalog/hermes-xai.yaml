name: hermes-xai
repo: https://github.com/Julientalbot/hermes-xai
sha: 8fd9bf8ecef1f8e9cb2cb7921fc86527acd9ede3
version: "0.1.0"
description: "The xAI API surfaces core does not cover, nothing it already ships (provider, x_search, web search, TTS, STT and Imagine stay in core). Collections module: one read-only tool, xai_collections_search, over documents the user already indexed in xAI Collections (GET /v1/collections, POST /v1/documents/search). Disclosure — each xai_collections_search call sends the query to api.x.ai with XAI_API_KEY (read through agent.secret_scope) and returns passages into the conversation. Nothing is uploaded, stored or deleted and no telemetry is emitted; xAI bills on the user's key."
maintainer: Julientalbot
tier: community
category: voice
docs_url: https://github.com/Julientalbot/hermes-xai/blob/8fd9bf8ecef1f8e9cb2cb7921fc86527acd9ede3/README.md
requires_hermes: ">=0.21.5"
platforms: []
capabilities:
  provides_tools: [xai_collections_search]
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - XAI_API_KEY
