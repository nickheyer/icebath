title: Czech (Čeština) Language Pack
description: >-
  Czech (Čeština) language pack for Hermes Agent covering core
  CLI/gateway/platforms (3,515/3,515 keys) and the Ink TUI (1,390/1,390). Core and TUI keys match the English source of `main` at 40b566502a (2026-11-02) exactly: no
  key upstream has since removed and no placeholder divergence, checked by flattening both sides.
  Ships the same text as upstream
  PR #105503, so if that PR lands the bundled locale and this pack agree. Manifest-only
  plugin: flat dotted YAML catalogs under locales/, no network, no dependencies. Disclosure — registering the pack never changes display.language, the user opts in
  via `hermes config set display.language cs`. Česká lokalizace rozhraní Hermes Agent.
