sha: 51343fdbccf63974c2db56244ed34ca3a15c5421
description: "Situational awareness for any chat: five agent tools (osint_situation, osint_events, osint_country, osint_recon, osint_news) answer from earthquakes (USGS), disaster alerts (GDACS), natural events (NASA EONET), US severe weather (NWS), military and nearby aircraft (adsb.lol), satellites from CelesTrak elements, GDELT news incidents, country dossiers (World Bank facts, events, headlines), NOAA space weather, markets, and a passive recon toolkit (DNS, RDAP, TLS, security headers, CT subdomains, CVE with CISA KEV, IP, GitHub, MAC). No keys needed; an optional TWELVEDATA_API_KEY (plugin setting, read through Hermes's secret scope) adds equities and commodities. Unofficial; not affiliated with any data provider. Disclosure — the gateway fetches public data from fixed hosts (earthquake.usgs.gov, eonet.gsfc.nasa.gov, gdacs.org, api.weather.gov, data.gdeltproject.org, api.adsb.lol, celestrak.org, services.swpc.noaa.gov, api.tfl.gov.uk and api.data.gov.sg (camera lists), api.worldbank.org, the BBC, Al Jazeera, DW, Guardian and France 24 RSS feeds, api.coingecko.com, and api.twelvedata.com with the key in a header when set), cached and only while a tool is called, with a hermes-osint-map User-Agent; recon sends the domain, IP, CVE id, GitHub name or MAC prefix the user or agent enters to dns.google, rdap.org, crt.sh, cve.circl.lu, cisa.gov, ipwho.is, api.github.com and api.macvendors.com, and the TLS and headers lookups connect directly to the host named, refusing private, loopback, link-local, CGNAT and other internal addresses on every redirect, on ports 443/8443 (TLS) and 80/443/8080/8443 (headers) only; GDELT incidents are machine-coded from news coverage and labelled as such; no files written, no shell commands, no background processes, no telemetry."
