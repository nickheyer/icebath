description: "Thai (ภาษาไทย) language pack covering core CLI/gateway/platforms (3,437/3,437) and the Ink TUI (1,259/1,259). Both catalogs checked against the English reference with `hermes plugins validate`. Manifest-only plugin: flat nested YAML overlays under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language th`. Disclosure — text-only catalogs (no code, network or dependencies); untranslated keys fall back to English: strings Hermes added after the pack was built."
