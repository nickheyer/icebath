description: 'Run icebath as an MCP server: `icebath mcp-serve` lets any MCP client (Claude Code, Claude Desktop,
  Cursor, Codex) list and read your messaging conversations, poll live events, send messages and
  answer approvals over stdio. `--tools` (off by default) also exposes icebath''s web, browser,
  vision, image generation, skills and TTS tools; terminal, file and kanban tools are never exposed.
  Formerly built into icebath core as `icebath mcp serve` (MCP clients change their args to
  ["mcp-serve"]). Disclosure: the connecting MCP client reads the active profile''s conversation
  history (state.db) and can send messages as your connected platform accounts; with `--tools` it also
  runs icebath tools under your configured provider credentials, which can spend provider credits. The
  plugin itself makes no network or model calls beyond those tool calls and sends.'
