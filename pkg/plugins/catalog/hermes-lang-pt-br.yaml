title: Brazilian Portuguese (Português do Brasil) Language Pack
description: "Brazilian Portuguese (pt-BR) language pack for Hermes Agent covering core CLI/gateway/platforms (3,515/3,515 keys) and the Ink TUI (1,390/1,390). Every translatable key exists and every value is translated against the English source of `main` at the revision this release was cut from: zero unknown keys and zero placeholder divergence on both surfaces. Checked with `hermes plugins validate` and with the pack's own `tools/verify_pack.py`, which also runs as public CI on every push. Core and TUI mirror the bundled `pt` locale, registered as a real `pt-br` variant so it wins over the `pt`/`pt-BR` alias. Manifest-only plugin: flat dotted YAML catalogs under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language pt-br`. A weekly drift workflow reports when `main` adds or drops keys; nothing self-updates. Tradução pt-BR da interface do Hermes Agent."
