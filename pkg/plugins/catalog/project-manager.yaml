sha: 2de4269baafc7399b7d4f92ad71b1d39205caf7b
version: "1.0.0"
title: Project Manager
description: "Git tools for the repositories under the folders you watch: five read-only agent tools list projects, project details, branches, recent commits and watch paths. Disclosure — reads the watch paths from its own SQLite table (under HERMES_HOME/plugin-data/project-manager) and git metadata (branch, remote, ahead/behind, commit subjects and status) from the repositories under them. The optional standalone server (project_manager_server.py, 127.0.0.1:9120) requires a per-run token printed to its log. No outbound network, no model call, no API keys."
maintainer: AiSolve-me
tier: community
category: tools
docs_url: https://github.com/AiSolve-me/hermes-project-manager#readme
image: https://raw.githubusercontent.com/AiSolve-me/hermes-project-manager/2de4269baafc7399b7d4f92ad71b1d39205caf7b/docs/assets/catalog-card.png
platforms: []
capabilities:
  provides_tools:
    - list_projects
    - get_project
    - list_branches
    - get_recent_commits
    - list_watch_paths
  provides_hooks: []
  provides_middleware: []
  requires_env: []
requires_hermes: ">=0.21.4"
