subdir: plugins/token-rate
title: Token Rate Monitor
description: "A get_token_rate agent tool that reads the output and input tokens per second of a local llama.cpp server from its log ($HERMES_HOME/logs/llama-server.log, last 200 lines: `tg = X t/s` for output and `prompt eval time ... X tokens per second` for input), so the model can read its own speed. Disclosure — it reads one local file (the llama.cpp log) and nothing else: no network calls, no external process, no extra port, no API key, no credentials, no telemetry."
maintainer: Lazzdaycod
tier: community
category: models
requires_hermes: ">=0.21.6"
docs_url: https://github.com/Lazzdaycod/hermes-lang-it/tree/main/plugins/token-rate
