name: fish-audio
title: Fish Audio
repo: https://github.com/100yenadmin/fish-audio-hermes
sha: 606afb54aa1a354cc8eac0b17f3da3a105ac55a7
description: "Lifelike voices for your agent: Fish Audio's expressive text-to-speech in 80+ languages, plus transcription, voice cloning and a voice library. The official Fish Audio plugin: Fish's Drama 3 model with word-level direction, speech-to-text, Fish Audio's community voice library, voice cloning and voice design. Fish Audio becomes a Hermes speech and transcription provider for voice replies, read-aloud and voice notes, with sentence-by-sentence streaming in CLI voice mode, and word-by-word live dictation captions on Hermes 0.21.6+ (stt.streaming: true). Adds the fish_speak, fish_voices and fish_transcribe tools, /fish and hermes fish commands, and four skills. Disclosure — sends your Fish API key and the text, audio (with file names) and voice titles, tags, descriptions, cover images and design instructions you ask it to process to api.fish.audio, or to the base_url you configure, and reads your Fish wallet for balances and model choice; with live dictation on, microphone audio streams to Fish's native realtime speech-to-text at api.fish.audio (transcribe-stream-1, Preview) while you speak, billed $0.36 per hour of open session, per second, including silence; a session opens with the first audio and closes once Fish confirms the last words (the plugin stops waiting after 15 seconds), or 30 seconds after the last audio of a cancelled recording; the live_transcription: compat setting uses Fish's older realtime endpoint instead, billed per committed phrase rounded up to a second; synthesis, transcription, cloning and voice design are paid requests billed to your Fish account, except the free s2.1-pro-free model (free through 30 November 2026), whose requests Fish may use to improve its models. The key comes from the profile's secret scope (Hermes stores it in the profile .env; a single-profile install may also read FISH_API_KEY from the environment). Generated audio and subtitles are written to Hermes's audio cache; clone samples and recordings it uploads must be regular audio files, and Hermes config, secret and credential paths are refused. Cloning and deleting voices from chat or the model tools go through Hermes's approval gate and follow your approval settings. The /fish alias can set or reset the profile's Fish model and voice and save up to 50 voice names in the profile's config. Includes a report-a-problem skill: the agent drafts a bug report and files it to this plugin's repository as a public GitHub issue or comment with your gh login only after you approve the exact text; reports leave out keys, credit amounts and your own voice ids, and security problems go to the repository's private advisory form instead. No telemetry."
maintainer: 100yenadmin
tier: community
category: voice
requires_hermes: ">=0.21.6"
docs_url: https://github.com/100yenadmin/fish-audio-hermes#readme
version: "1.9.0"
image: https://raw.githubusercontent.com/100yenadmin/fish-audio-hermes/606afb54aa1a354cc8eac0b17f3da3a105ac55a7/docs/media/banner.png
screenshots:
  - https://raw.githubusercontent.com/100yenadmin/fish-audio-hermes/606afb54aa1a354cc8eac0b17f3da3a105ac55a7/docs/media/screenshot-setup.png
readme: true
platforms: [linux, macos]
known_issues:
  - "Hermes's text normaliser alters <|speaker:N|> markup and Drama 3 closing tags such as </whisper> on the plain text_to_speech path; use fish_speak for multi-speaker speech and Drama 3 word tags (NousResearch/hermes-agent#133131)."
  - "In the dark theme an empty API key field in Settings is very hard to see; a fix is proposed (NousResearch/hermes-agent#138994)."
  - "Under plugins.isolation: host the hermes fish terminal command is unavailable and voice replies use whole-file speech instead of streaming; /fish, the tools and both providers still work."
capabilities:
  provides_tools:
    - fish_speak
    - fish_voices
    - fish_transcribe
  provides_hooks:
    - transform_llm_output
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - FISH_API_KEY
