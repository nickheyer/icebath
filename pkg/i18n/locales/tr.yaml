  t021: "/tools disable browser tarayıcı araçlarını mevcut oturum için geçici olarak kaldırır."
  t022: "/browser connect tarayıcı araçlarını CDP üzerinden çalışan Chromium tabanlı tarayıcınıza bağlar."
  t023: "/plugins kurulu eklentileri ve durumlarını listeler."
  t024: "/cron zamanlanmış görevleri yönetir — herhangi bir platforma teslim edilen yinelenen istemler kurun."
  t025: "/reload-mcp MCP sunucu yapılandırmasını yeniden başlatmadan anında yeniden yükler."
  t026: "/usage token kullanımını, maliyet dağılımını ve oturum süresini gösterir."
  t027: "/insights son 30 günün kullanım analizlerini gösterir."
  t028: "/paste panonuzda görsel olup olmadığını kontrol eder ve sonraki mesajınıza ekler."
  t029: "/profile hangi profilin etkin olduğunu ve ana dizinini gösterir."
  t030: "/config mevcut yapılandırmanızı tek bakışta gösterir."
  t031: "/stop ajanın başlattığı tüm çalışan arka plan süreçlerini sonlandırır."
  t032: "@file:path/to/file.py dosya içeriğini doğrudan mesajınıza ekler."
  t033: "@file:main.py:10-50 bir dosyanın yalnızca 10-50. satırlarını ekler."
  t034: "@folder:src/ bir dizin ağacı listesi ekler."
  t035: "@diff hazırlanmamış (unstaged) git değişikliklerinizi mesaja ekler."
  t036: "@staged hazırlanmış (staged) git değişikliklerinizi ekler (git diff --staged)."
  t037: "@git:5 son 5 commit'i tam yamalarıyla ekler."
  t038: "@url:https://example.com bir web sayfasının içeriğini indirip ekler."
  t039: "@ yazmak dosya sistemi yol tamamlamayı tetikler — herhangi bir dosyaya etkileşimli olarak gidin."
  t040: "Birden fazla referansı birleştirin: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter çok satırlı giriş için yeni satır ekler. (Windows Terminal Alt+Enter'ı yakalar — yerine Ctrl+Enter kullanın.)"
  t042: "Ctrl+C ajanı durdurur. Zorla çıkmak için 2 saniye içinde iki kez basın."
  t043: "Ctrl+Z Icebath'i arka plana alır — devam etmek için kabuğunuzda fg çalıştırın."
  t044: "Tab otomatik öneri hayalet metnini kabul eder veya slash komutlarını tamamlar."
  t045: "Ajan çalışırken yeni bir mesaj yazarak onu durdurup yönlendirebilirsiniz."
  t046: "Alt+V panonuzdaki bir görseli konuşmaya yapıştırır."
  t047: "5+ satır yapıştırıldığında içerik otomatik olarak bir dosyaya kaydedilir ve yerine kısa bir referans eklenir."
  t048: "icebath -c en son CLI oturumunuza devam eder. icebath -c \"project name\" başlığa göre devam eder."
  t049: "icebath -w yalıtılmış bir git worktree oluşturur — paralel ajan iş akışları için idealdir."
  t050: "icebath -w -q \"Fix issue #42\" worktree yalıtımını tek seferlik bir sorguyla birleştirir."
  t051: "icebath chat -t web,terminal odaklı bir oturum için yalnızca belirli araç setlerini etkinleştirir."
  t052: "icebath chat -s github-pr-workflow başlangıçta bir skill'i önceden yükler."
  t053: "icebath chat -q \"query\" tek bir etkileşimsiz sorgu çalıştırır ve çıkar."
  t054: "icebath chat --max-turns 1000 tur başına varsayılan 500 yineleme sınırını geçersiz kılar."
  t055: "icebath chat --checkpoints her yıkıcı dosya değişikliğinden önce dosya sistemi anlık görüntüsü alır."
  t056: "icebath --yolo tüm oturum boyunca tehlikeli komut onay istemlerini atlar."
  t057: "icebath chat --source telegram oturumu icebath sessions list içinde filtrelemek için etiketler."
  t058: "icebath -p work chat varsayılanınızı değiştirmeden belirli bir profil altında çalışır."
  t059: "icebath doctor --fix yapılandırma ve bağımlılık sorunlarını tanılar ve otomatik olarak onarır."
  t060: "icebath dump kısa bir kurulum özeti verir — hata raporları için çok kullanışlıdır."
  t061: "icebath config set KEY VALUE gizli anahtarları otomatik olarak .env dosyasına, diğer her şeyi config.yaml dosyasına yönlendirir."
  t062: "icebath config edit config.yaml dosyasını varsayılan düzenleyicinizde açar."
  t063: "icebath config check eksik veya eskimiş yapılandırma seçeneklerini tarar."
  t064: "icebath sessions browse arama özellikli etkileşimli bir oturum seçici açar."
  t065: "icebath sessions stats platforma göre oturum sayılarını ve veritabanı boyutunu gösterir."
  t066: "icebath sessions prune --older-than 30 eski oturumları temizler."
  t067: "icebath skills search react --source skills-sh skills.sh genel dizininde arama yapar."
  t068: "icebath skills check kurulu hub skill'lerini yukarı akış güncellemeleri için tarar."
  t069: "icebath skills tap add myorg/skills-repo özel bir GitHub skill kaynağı ekler."
  t070: "icebath skills snapshot export setup.json skill yapılandırmanızı yedekleme veya paylaşım için dışa aktarır."
  t071: "icebath mcp add github --command npx komut satırından MCP sunucuları ekler."
  t072: "icebath mcp-serve Icebath'in kendisini diğer ajanlar için bir MCP sunucusu olarak çalıştırır."
  t073: "icebath auth add kimlik bilgisi havuzu rotasyonu için birden fazla API anahtarı eklemenizi sağlar."
  t074: "icebath completion bash >> ~/.bashrc tüm komutlar ve profiller için tab tamamlamayı etkinleştirir."
  t075: "icebath logs -f agent.log dosyasını gerçek zamanlı izler. --level WARNING --since 1h çıktıyı filtreler."
  t076: "icebath backup tüm Icebath ana dizininizin zip yedeğini oluşturur."
  t077: "icebath profile create coder kendi komutu haline gelen yalıtılmış bir profil oluşturur."
  t078: "icebath profile create work --clone mevcut yapılandırmanızı ve anahtarlarınızı yeni bir profile kopyalar."
  t079: "icebath update yeni paketlenmiş skill'leri TÜM profillere otomatik olarak eşitler."
  t080: "icebath gateway install Icebath'i sistem hizmeti olarak kurar (systemd/launchd)."
  t081: "icebath memory setup harici bir bellek sağlayıcısı (RetainDB, ByteRover vb.) yapılandırmanızı sağlar."
  t082: "icebath webhook subscribe HMAC doğrulamalı, olay güdümlü webhook rotaları oluşturur."
  t083: "Tasarruf edin: icebath tools kullanılmayan araçları devre dışı bırakır, icebath skills config skill'leri azaltır."
  t084: "/reasoning low veya /reasoning minimal düşünme derinliğini varsayılanın (medium) altına çeker — daha hızlı, daha ucuz yanıtlar."
  t085: "icebath models görüntü, sıkıştırma ve yardımcı görevleri daha ucuz modellere yönlendirir — ana sohbet modelinizi düşürmeden arka plan token maliyetini %85+ azaltır."
  t086: "Uzun görevler bittiğinde zil sesi duymak için config.yaml içinde display.bell_on_complete: true ayarlayın."
  t087: "Model üretirken token'ların gerçek zamanlı akmasını görmek için display.streaming: true ayarlayın."
  t088: "Modelin düşünce zincirini izlemek için display.show_reasoning: true ayarlayın."
  t089: "Daha yoğun bilgi için çıktıdaki boşlukları azaltmak üzere display.compact: true ayarlayın."
  t090: "Mesajları ajanı bölmek yerine sıraya almak için display.busy_input_mode: queue, /steer ile çalışma sırasında iletmek için steer ayarlayın."
  t091: "Oturuma devam ederken tam konuşma özetini atlamak için display.resume_display: minimal ayarlayın."
  t092: "Otomatik sıkıştırmanın ne zaman tetikleneceğini denetlemek için compression.threshold: 0.50 ayarlayın (varsayılan: bağlamın %50'si)."
  t093: "Ajanın tur başına daha fazla araç çağrısı adımı atmasına izin vermek için agent.max_turns: 1000 ayarlayın."
  t094: "read_file çağrısı başına en fazla içeriği artırmak için file_read_max_chars: 200000 ayarlayın."
  t095: "Bir LLM'in güvenli komutları otomatik onaylaması ve tehlikelileri otomatik reddetmesi için approvals.mode: smart ayarlayın."
  t096: "Yedek bir sağlayıcıya otomatik geçiş için config.yaml içinde fallback_model ayarlayın."
  t097: "Kullanıcı kimliklerini ve telefon numaralarını LLM'e göndermeden önce hash'lemek için privacy.redact_pii: true ayarlayın."
  t098: "Ajan gezinirken yerel Chromium penceresini görmek için browser.headed: true ayarlayın."
  t099: "Her zaman bir git worktree oluşturmak için config.yaml içinde worktree: true ayarlayın (icebath -w ile aynı)."
  t100: "Belirli alan adlarını web araçlarından engellemek için security.website_blocklist.enabled: true ayarlayın."
  t101: "Ham ajan çıktısını cron üst bilgisi/alt bilgisi olmadan teslim etmek için cron.wrap_response: false ayarlayın."
  t102: "ICEBATH_TIMEZONE sunucu saat dilimini herhangi bir IANA saat dilimi dizesiyle geçersiz kılar."
  t103: "config.yaml içinde ortam değişkeni değiştirme çalışır: ${VAR_NAME} sözdizimini kullanın."
  t104: "config.yaml içindeki hızlı komutlar kabuk komutlarını sıfır token kullanımıyla anında çalıştırır."
  t105: "Özel kişilikler config.yaml içinde agent.personalities altında tanımlanabilir."
  t106: "provider_routing OpenRouter sağlayıcı sıralamasını, beyaz listesini ve kara listesini denetler."
  t107: "execute_code Icebath araçlarını programatik olarak çağıran Python betikleri çalıştırır — sonuçlar bağlamın dışında kalır."
  t108: "delegate_task paralel çalışma için yalıtılmış bağlamlara sahip, varsayılan olarak en fazla 10 eşzamanlı alt ajan (delegation.max_concurrent_children) başlatır."
  t109: "web_extract PDF URL'leriyle çalışır — herhangi bir PDF bağlantısı verin, markdown'a dönüştürür."
  t110: "search_files ripgrep tabanlıdır ve grep'ten hızlıdır — terminalde grep yerine bunu kullanın."
  t111: "patch 9 bulanık eşleştirme stratejisi kullanır; küçük boşluk farkları düzenlemeleri bozmaz."
  t112: "patch tek çağrıda toplu çok dosyalı düzenlemeler için V4A biçimini destekler."
  t113: "read_file bir dosya bulunamadığında benzer dosya adları önerir."
  t114: "read_file otomatik olarak tekilleştirir — değişmemiş bir dosyayı yeniden okumak hafif bir yer tutucu döndürür."
  t115: "Kalıcı bir Chromium profili tutmak için browser.user_data_dir'i bir klasöre ayarlayın; böylece site oturum açmaları oturumlar arasında korunur."
  t116: "browser.chromium_args, yerel tarayıcı oturumlarına ek Chromium bayrakları ekler; örneğin --lang=de."
  t117: "image_generate FLUX 2 Pro ile ve otomatik 2x yükseltmeyle görseller oluşturur."
  t118: "text_to_speech metni sese dönüştürür — Telegram'da sesli mesaj olarak oynatılır."
  t119: "send_message oturum içinden bağlı herhangi bir mesajlaşma platformuna ulaşabilir."
  t120: "todo aracı ajanın oturum sırasında karmaşık, çok adımlı görevleri takip etmesine yardımcı olur."
  t121: "session_search TÜM geçmiş konuşmalarda tam metin arama yapar."
  t122: "Ajan tercihleri, düzeltmeleri ve ortam bilgilerini otomatik olarak belleğe kaydeder."
  t123: "/moa zor bir istemi yapılandırdığınız Mixture of Agents model kümesi üzerinden yönlendirir."
  t124: "Terminal komutları uzun süren görevler için notify_on_complete ile arka plan modunu destekler."
  t125: "Terminal arka plan süreçleri belirli çıktı satırlarında uyarı vermek için watch_patterns destekler."
  t126: "terminal aracı 6 arka uç destekler: local, Docker, SSH, Modal, Daytona ve Singularity."
  t127: "Her profilin kendi yapılandırması, API anahtarları, belleği, oturumları, skill'leri ve cron işleri vardır."
  t128: "Profil adları kabuk komutuna dönüşür — 'icebath profile create coder' komutu 'coder' komutunu oluşturur."
  t129: "icebath profile export coder -o backup.tar.gz taşınabilir bir profil arşivi oluşturur."
  t130: "İki profil yanlışlıkla aynı bot token'ını paylaşırsa ikinci gateway açık bir hatayla engellenir."
  t131: "Oturumlar ilk alışverişten sonra otomatik olarak açıklayıcı başlıklar üretir — elle adlandırma gerekmez."
  t132: "Oturum başlıkları soy zincirini destekler: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "Çıkarken Icebath oturum kimliği ve istatistiklerle birlikte bir devam etme komutu yazdırır."
  t134: "icebath sessions export backup.jsonl tüm oturumları yedekleme veya analiz için dışa aktarır."
  t135: "icebath -r SESSION_ID kimliğine göre belirli bir geçmiş oturuma devam eder."
  t136: "Bellek dondurulmuş bir anlık görüntüdür — değişiklikler sistem isteminde yalnızca sonraki oturum başlangıcında görünür."
  t137: "Bellek girdileri istem enjeksiyonu ve veri sızdırma desenlerine karşı otomatik olarak taranır."
  t138: "Ajanın iki bellek deposu vardır: kişisel notlar (~2200 karakter) ve kullanıcı profili (~1375 karakter)."
  t139: "Ajana verdiğiniz düzeltmeler (\"hayır, şöyle yap\") çoğu zaman otomatik olarak belleğe kaydedilir."
  t140: "github, creative, mlops, productivity, research ve daha fazlasını kapsayan 80'den fazla paketlenmiş skill."
  t141: "Kurulu her skill otomatik olarak bir slash komutuna dönüşür — hepsini görmek için / yazın."
  t142: "icebath skills install official/security/1password depodan isteğe bağlı skill'ler kurar."
  t143: "Skill'ler belirli işletim sistemleriyle sınırlanabilir — bazıları yalnızca macOS veya Linux'ta yüklenir."
  t144: "config.yaml içindeki skills.external_dirs özel dizinlerden skill yüklemenizi sağlar."
  t145: "Ajan skill_manage kullanarak prosedürel bellek olarak kendi skill'lerini oluşturabilir."
  t146: "/plan hiçbir şey çalıştırmadan .icebath/plans/ dizinine markdown bir uygulama planı yazar."
  t147: "Cron işlerine skill eklenebilir: icebath cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Cron teslim hedefleri arasında telegram, discord, slack, email, sms ve 12'den fazla platform bulunur."
  t149: "Bir cron yanıtı [SILENT] ile başlarsa teslimat bastırılır — yalnızca izleme amaçlı işler için kullanışlıdır."
  t150: "Cron göreli gecikmeleri (30m), aralıkları (every 2h), cron ifadelerini ve ISO zaman damgalarını destekler."
  t151: "Cron işleri tamamen yeni ajan oturumlarında çalışır — istemler kendi başına yeterli olmalıdır."
  t152: "faster-whisper kuruluysa ses modu hiç API anahtarı olmadan çalışır (ücretsiz yerel konuşmadan yazıya dönüştürme)."
  t153: "Beş TTS sağlayıcısı mevcut: Edge TTS (ücretsiz), ElevenLabs, OpenAI, NeuTTS (ücretsiz yerel), MiniMax."
  t154: "/voice on, CLI'da ses modunu etkinleştirir. Ctrl+B bas-konuş kaydını açar/kapatır."
  t155: "Akışlı TTS cümleleri üretildikçe seslendirir — yanıtın tamamını beklemeniz gerekmez."
  t156: "Telegram, Discord, WhatsApp ve Slack'teki sesli mesajlar otomatik olarak yazıya dökülür."
  t157: "Icebath 21 mesajlaşma platformunda çalışır: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-posta ve daha fazlası."
  t158: "icebath gateway install, gateway'i açılışta başlayan bir sistem hizmeti olarak kurar."
  t159: "DingTalk, Stream Mode kullanır — webhook veya herkese açık URL gerekmez."
  t160: "BlueBubbles, yerel bir macOS sunucusu üzerinden iMessage'ı Icebath'e getirir."
  t161: "Webhook rotaları HMAC doğrulaması, hız sınırlama ve olay filtrelemeyi destekler."
  t162: "API sunucusu, Open WebUI ve LibreChat ile uyumlu, OpenAI uyumlu bir uç nokta sunar."
  t163: "Discord ses kanalı modu: bot sesli kanala katılır, konuşmayı yazıya döker ve sesli yanıt verir."
  t164: "group_sessions_per_user: true, grup sohbetlerinde her kişiye kendi oturumunu verir."
  t165: "/sethome, bir sohbeti cron işi teslimatları için ana kanal olarak işaretler."
  t166: "Gateway, etkinliksizliğe dayalı zaman aşımlarını destekler — aktif ajanlar süresiz çalışabilir."
  t167: "Tehlikeli komut onayının 4 kademesi vardır: bir kez, oturum, her zaman (kalıcı izin listesi), reddet."
  t168: "Akıllı onay modu, güvenli komutları otomatik onaylamak ve tehlikeli olanları işaretlemek için bir LLM kullanır."
  t169: "SSRF koruması özel ağları, loopback, link-local ve bulut meta veri adreslerini engeller."
  t170: "Oturum kimlikleri zaman damgasıyla başlar (20250305_091523_abcd); böylece ls ve jq içinde sıralama doğal olarak çalışır."
  t171: "MCP alt süreçleri filtrelenmiş bir ortam alır — yalnızca güvenli sistem değişkenleri aktarılır."
  t172: "Bağlam dosyaları (.icebath.md, AGENTS.md) yüklenmeden önce istem enjeksiyonuna karşı güvenlik taramasından geçer."
  t173: "config.yaml içindeki command_allowlist, belirli kabuk komutu desenlerini kalıcı olarak onaylar."
  t174: "Bağlam eşiğe ulaştığında otomatik sıkıştırılır — bellekler yazılır ve geçmiş özetlenir."
  t175: "Bağlam dolarken durum çubuğu önce sarıya, sonra turuncuya, sonra kırmızıya döner."
  t176: "SOUL.md ajanın birincil kimlik dosyasıdır — davranışı şekillendirmek için özelleştirin."
  t177: "Icebath proje bağlamını .icebath.md, AGENTS.md, CLAUDE.md veya .cursorrules dosyasından yükler (ilk eşleşen)."
  t178: "Alt dizinlerdeki AGENTS.md dosyaları, ajan klasörlere girdikçe aşamalı olarak keşfedilir."
  t179: "Bağlam dosyaları 20.000 karakterle sınırlıdır; akıllı baş/son kırpma uygulanır."
  t180: "Tarayıcı arka uçları: yerel Chromium, Lightpanda, Browserbase, Browser Use ve Firecrawl — ayrıca yerleşik Camofox."
  t181: "Camofox (tespit önleyici Firefox) yerleşiktir: icebath camofox setup ile kurun."
  t182: "browser_exec birden çok tarayıcı adımını tek bir Python çağrısında çalıştırır — gezinme, çıkarma ve tıklama birlikte."
  t183: "browser.dialog_policy, sayfanın yerel iletişim kutularının nasıl ele alınacağını belirler: must_respond (ajan browser_dialog ile yanıtlar), auto_dismiss veya auto_accept."
  t184: "icebath mcp, icebath'in yerleşik kataloğundaki MCP'leri tek tuşla kurabileceğiniz etkileşimli bir seçici açar."
  t185: "icebath mcp catalog, icebath'e yerleşik MCP sunucularını listeler."
  t186: "icebath mcp install <name>, bir katalog girdisini kurar, kimlik bilgilerini sorar ve hangi araçlarını etkinleştireceğinizi seçmenizi sağlar."
  t187: "MCP sunucuları config.yaml içinde yapılandırılır — hem stdio hem HTTP aktarımları desteklenir."
  t188: "Sunucu başına araç filtreleme: tools.include belirli araçları beyaz listeye, tools.exclude kara listeye alır."
  t189: "MCP sunucuları çalışma zamanında araç setlerini otomatik oluşturur — icebath tools bunları platform bazında açıp kapatabilir."
  t190: "MCP OAuth desteği: auth: oauth, PKCE ile tarayıcı tabanlı yetkilendirmeyi etkinleştirir."
  t191: "Hiçbir dosya değiştirilmediğinde kontrol noktalarının ek yükü sıfırdır — varsayılan olarak etkindir."
  t192: "Geri almayı geri alabilmeniz için geri alma öncesi bir anlık görüntü otomatik kaydedilir."
  t193: "/rollback konuşma turunu da geri alır, böylece ajan geri alınan değişiklikleri hatırlamaz."
  t194: "Kontrol noktaları ~/.icebath/checkpoints/ altında gölge depolar kullanır — projenizin .git dizinine hiç dokunulmaz."
  t195: "icebath batch, eğitim verisi üretimi için yüzlerce istemi paralel olarak işler."
  t196: "icebath chat -Q, programatik kullanım için sessiz modu etkinleştirir — banner ve dönen simgeyi gizler."
  t197: "Yörünge kaydı (--save-trajectories), model eğitimi için tam araç kullanım izlerini yakalar."
  t198: "Üç eklenti türü: genel (araçlar/kancalar), bellek sağlayıcıları ve bağlam motorları."
  t199: "icebath plugins install owner/repo, eklentileri doğrudan GitHub'dan kurar."
  t200: "Harici bellek sağlayıcıları: RetainDB ve ByteRover yerleşiktir, diğerleri icebath plugins install <source> ile kurulur."
  t201: "Eklenti kancaları arasında pre/post_tool_call, pre/post_llm_call ve çıktı normalleştirme için transform_terminal_output bulunur."
  t202: "İstem önbelleği (Anthropic), önbelleğe alınmış sistem istemi öneklerini yeniden kullanarak maliyetleri düşürür."
  t203: "Ajan oturum başlıklarını arka plan iş parçacığında otomatik oluşturur — gecikmeye sıfır etki."
  t204: "Akıllı model yönlendirme, basit sorguları otomatik olarak daha ucuz bir modele yönlendirebilir."
  t205: "Slash komutları önek eşleşmesini destekler: /h, /help'e; /mod, /model'e çözümlenir."
  t206: "Terminale bir dosya yolu sürüklemek görüntüleri otomatik ekler veya dosyayı bağlam olarak gönderir."
  t207: "Depo kökünüzdeki .worktreeinclude, worktree'lere kopyalanacak gitignore'lu dosyaları listeler."
  t208: "icebath acp, VS Code, Zed ve JetBrains entegrasyonu için Icebath'i bir ACP sunucusu olarak çalıştırır."
  t209: "Özel sağlayıcılar: adlandırılmış uç noktaları config.yaml içinde custom_providers altına kaydedin."
  t210: "ICEBATH_EPHEMERAL_SYSTEM_PROMPT, geçmişe hiç kaydedilmeyen bir sistem istemi enjekte eder."
  t211: "credential_pool_strategies; fill_first, round_robin, least_used ve random rotasyonunu destekler."
  t212: "icebath auth add xai-oauth veya icebath auth add openai-codex, OAuth tabanlı sağlayıcıları kurar."
  t213: "API sunucusu, sunucu tarafı durumla hem Chat Completions hem Responses API'sini destekler."
  t214: "Yapılandırmada tool_preview_length: 0, dönen simgenin etkinlik akışında tam dosya yollarını gösterir."
  t215: "icebath status --deep, tüm bileşenlerde daha derin tanılama denetimleri çalıştırır."
  t216: "Cron işlerine, stdout çıktısı isteme bağlam olarak enjekte edilen bir Python betiği (--script) eklenebilir."
  t217: "Cron betikleri ~/.icebath/scripts/ altında bulunur ve ajandan önce çalışır — veri toplama hatları için idealdir."
  t218: "config.yaml içindeki prefill_messages_file, her API çağrısına few-shot örnekler enjekte eder; geçmişe hiç kaydedilmez."
  t219: "SOUL.md ajanın varsayılan kimliğini tamamen değiştirir — Icebath'i kendinize ait kılmak için yeniden yazın."
  t220: "SOUL.md ilk çalıştırmada varsayılan bir kişilikle otomatik doldurulur. Özelleştirmek için düzenleyin."
  t221: "/compress <focus topic>, özet bütçesinin %60-70'ini konunuza ayırır ve geri kalanını agresif biçimde kısaltır."
  t222: "İkinci ve sonraki sıkıştırmalarda sıkıştırıcı sıfırdan başlamak yerine önceki özeti günceller."
  t223: "Gateway oturumu sıfırlanmadan önce Icebath önemli bilgileri arka planda otomatik olarak belleğe yazar."
  t224: "config.yaml içinde network.force_ipv4: true, IPv6'sı bozuk sunuculardaki takılmaları giderir — socket'i monkey-patch eder."
  t225: "terminal aracı yaygın çıkış kodlarını açıklar: grep'in 1 döndürmesi = 'Eşleşme bulunamadı (hata değil)'."
  t226: "Başarısız ön plan terminal komutları üstel geri çekilmeyle (2 sn, 4 sn, 8 sn) en fazla 3 kez otomatik yeniden denenir."
  t227: "Yalın sudo komutları, .env'deki SUDO_PASSWORD'ü borulayacak şekilde otomatik yeniden yazılır — etkileşimli istem gerekmez."
  t228: "execute_code yardımcıları açık içe aktarma gerektirir: from icebath_tools import json_parse, shell_quote, retry."
  t229: "execute_code'un 7 sandbox aracı (web_search, terminal, read/write/search/patch) RPC kullanır — asla bağlama girmez."
  t230: "Aynı dosya bölgesini 3+ kez okumak uyarı tetikler. 4+ kez okumada döngüleri önlemek için kesin olarak engellenir."
  t231: "write_file ve patch, dosyanın son okumadan sonra dışarıdan değiştirildiğini algılar ve bayatlık konusunda uyarır."
  t232: "V4A yama biçimi yalnızca Update değil, Add File, Delete File ve Move File yönergelerini de destekler."
  t233: "MCP sunucuları sampling üzerinden LLM tamamlamaları isteyebilir — ajan, sunucu için bir araca dönüşür."
  t234: "MCP sunucuları, yeniden başlatma gerektirmeden otomatik araç yeniden kaydını tetiklemek için notifications/tools/list_changed gönderir."
  t235: "acp_command: 'claude' ile delegate_task, herhangi bir platformdan Claude Code'u alt ajan olarak başlatır."
  t236: "Delegasyonun bir heartbeat iş parçacığı vardır — alt ajan etkinliği üst ajana aktarılır ve gateway zaman aşımları önlenir."
  t237: "Bir sağlayıcı HTTP 402 (ödeme gerekli) döndürdüğünde yardımcı istemci otomatik olarak bir sonrakine geçer."
  t238: "agent.tool_use_enforcement, araç çağırmak yerine eylemleri betimleyen modelleri yönlendirir — GPT/Codex için otomatik."
  t239: "agent.restart_after_turn_timeout, /restart stop() aşamasına girmeden önce süren turların bitmesine izin verir; restart_drain_timeout ise yalnızca stop() başladıktan sonraki zorla kesme bütçesidir."
  t240: "agent.api_max_retries (varsayılan 3), ajanın hatayı göstermeden önce başarısız bir API çağrısını kaç kez yeniden deneyeceğini belirler — hızlı yedeğe geçiş için düşürün."
  t241: "Gateway, AIAgent örneklerini oturum başına önbelleğe alır — bu önbelleği yok etmek Anthropic istem önbelleğini bozar."
  t242: "Herhangi bir web sitesi /.well-known/skills/index.json üzerinden skill yayımlayabilir — skill hub'ı bunları otomatik keşfeder."
  t243: "~/.icebath/skills/.hub/audit.log konumundaki skill denetim günlüğü her kurma ve kaldırma işlemini kaydeder."
  t244: "Bayat git worktree'leri otomatik temizlenir: temiz ve birleştirilmiş ağaçlar kaldırılır; commit edilmemiş veya push edilmemiş çalışma içeren boştaki ağaçlar önce arşivlenir ve icebath worktree restore ile geri yüklenebilir."
  t245: "Profiller Icebath durumunu ICEBATH_HOME ile ayırır; terminal.home_mode profile olarak ayarlanmadıkça ana makine araç alt süreçleri gerçek HOME'unuzu korur."
  t246: "ICEBATH_HOME_MODE ortam değişkeni (sekizlik, örn. 0701), web sunucusu erişimi için özel dizin izinleri belirler."
  t247: "Container modu: ICEBATH_HOME içine .container-mode koyun; ana makine CLI'sı otomatik olarak container içine geçer."
  t248: "Ctrl+C'nin 5 öncelik kademesi vardır: kaydı iptal et → istemleri iptal et → seçiciyi iptal et → ajanı kes → çık."
  t249: "Ajan çalışması sırasındaki her kesme, zaman damgasıyla ~/.icebath/interrupt_debug.log dosyasına kaydedilir."
  t250: "BROWSER_CDP_URL, tarayıcı araçlarını çalışan herhangi bir Chromium ailesi tarayıcıya bağlar — WebSocket, HTTP veya host:port kabul eder."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true, özel Chromium ile gelişmiş tespit önlemeyi etkinleştirir (Scale Plan)."
  t252: "CLI, 80 sütundan dar terminallerde otomatik olarak kompakt moda geçer."
  t253: "Hızlı komutlar iki türü destekler: exec (kabuk komutunu doğrudan çalıştır) ve alias (başka bir komuta yönlendir)."
  t254: "Görev başına delegasyon modeli: yapılandırmadaki delegation.model ve delegation.provider, alt ajanları daha ucuz modellere yönlendirir."
  t255: "delegation.reasoning_effort, alt ajanların düşünme derinliğini bağımsız olarak denetler."
  t256: "config.yaml içindeki display.platforms, platform bazında görüntü geçersiz kılmalarına izin verir: {telegram: {tool_progress: all}}."
  t257: "Yapılandırmadaki human_delay.mode insan yazma hızını taklit eder — min_ms/max_ms aralığı ayarlanabilir."
  t258: "Yapılandırma sürüm geçişleri yüklemede otomatik çalışır — yeni yapılandırma anahtarları elle müdahale gerektirmeden görünür."
  t259: "GPT ve Codex modelleri, araç disiplini ve zorunlu araç kullanımı için özel sistem istemi yönlendirmesi alır."
  t260: "Gemini modelleri mutlak yollar, paralel araç çağrıları ve etkileşimsiz komutlar için özel yönergeler alır."
  t261: "config.yaml içindeki context.engine, alternatif bağlam yönetimi stratejileri için bir eklenti adına ayarlanabilir."
  t262: "Bulut tarayıcıyla localhost ve yerel ağ URL'leri bunun yerine yerel bir Chromium'da açılır (browser.auto_local_for_private_urls, varsayılan olarak açık)."
  t263: "Sıkıştırıcı ucuz bir ön geçiş yapar: LLM çalışmadan önce 200 karakteri aşan araç çıktıları yer tutucularla değiştirilir."
  t264: "Sıkıştırma başarısız olduğunda API'yi yormamak için sonraki denemeler 10 dakika duraklatılır."
  t265: "Uzun tehlikeli komutlar (>70 karakter) için onay isteminde tam metni önce görmenizi sağlayan bir 'görüntüle' seçeneği bulunur."
  t266: "Ses düzeyi görselleştirmesi, sesli kayıt sırasında mikrofon RMS düzeylerine göre ▁▂▃▄▅▆▇ çubukları gösterir."
  t267: "Profil adları PATH'teki mevcut ikili dosyalarla çakışamaz — 'icebath profile create ls' reddedilir."
  t268: "icebath profile create backup --clone-all her şeyi kopyalar (yapılandırma, anahtarlar, SOUL.md, bellekler, skill'ler, oturumlar)."
  t269: "Ses kayıt tuşu config.yaml içindeki voice.record_key ile ayarlanabilir — Ctrl+B ile sınırlı değildir."
  t270: ".cursorrules ve .cursor/rules/*.mdc dosyaları otomatik algılanır ve proje bağlamı olarak yüklenir."
  t271: "Bağlam dosyaları 10+ istem enjeksiyonu desenine karşı denetlenir — görünmez Unicode, 'talimatları yoksay', sızdırma girişimleri."
  t272: "GPT-5 ve Codex, mesaj biçiminde 'system' yerine 'developer' rolünü kullanır."
  t273: "Görev başına yardımcı geçersiz kılmalar: config.yaml içinde auxiliary.vision.provider, auxiliary.compression.model vb."
  t274: "Yardımcı istemci 'main' değerini bir sağlayıcı takma adı olarak ele alır — gerçek birincil sağlayıcınız + modelinize çözümlenir."
  t275: "icebath import-agent openclaw --dry-run, OpenClaw geçişini hiçbir şey yazmadan önizler."
  t276: "Tırnaklı veya kaçış boşluklu yapıştırılan dosya yolları otomatik işlenir — elle temizlik gerekmez."
  t277: "Slash komutları büyük yapıştırma daraltmasını asla tetiklemez — büyük argümanlı /command doğru çalışır."
  t278: "Kesme modunda, ajan çalışırken yazılan slash komutları kesme mantığını atlar ve hemen çalışır."
  t279: "ICEBATH_DEV=1, yerel geliştirme için container modu algılamasını atlar."
  t280: "Her MCP sunucusu, icebath tools ile bağımsız olarak açılıp kapatılabilen kendi araç setini (mcp-servername) alır."
  t281: "Yapılandırmadaki MCP ${ENV_VAR} yer tutucuları sunucu başlatılırken çözümlenir — ~/.icebath/.env içindeki değişkenler dahil."
  t282: "Güvenilir depolardan (openai, anthropics, huggingface, NVIDIA, wandb, qdrant, pinecone-io) gelen skill'ler 'trusted' güvenlik düzeyi alır; topluluk skill'leri ek taramadan geçer."
  t283: "~/.icebath/skills/.hub/quarantine/ konumundaki skill karantinası, güvenlik incelemesi bekleyen skill'leri tutar."
  t284: "/steer <prompt>, bir sonraki araç çağrısından sonra bir not enjekte eder — görev ortasında kesmeden yön verin."
  t285: "/goal <text>, kalıcı bir Ralph döngüsü hedefi belirler — bir hakem tamamlandı deyinceye dek Icebath tur tur otomatik devam eder."
  t286: "/snapshot create [label], Icebath yapılandırmasının tam durum anlık görüntüsünü kaydeder; /snapshot restore <id> daha sonra geri döndürür."
  t287: "/copy [N], son asistan yanıtını panonuza kopyalar; sayı verilirse sondan N'inci yanıtı kopyalar."
  t288: "/redraw tam bir arayüz yenilemesi zorlar; tmux yeniden boyutlandırması veya fare seçimi kalıntılarından sonraki terminal kaymalarını düzeltir."
  t289: "/agents (takma adı /tasks), geçerli oturumdaki aktif ajanları ve çalışan arka plan görevlerini gösterir."
  t290: "/footer, son yanıtlarda model, bağlam yüzdesi ve cwd gösteren gateway alt bilgisini açar/kapatır."
  t291: "/busy queue|steer|interrupt, Icebath çalışırken Enter'a basmanın ne yapacağını belirler."
  t292: "Telegram DM'lerinde /topic, kullanıcı yönetimli çoklu oturum konu modunu etkinleştirir — /topic <id> geçmiş oturumları yerinde geri yükler."
  t293: "/approve session|always, bekleyen tehlikeli komutu seçtiğiniz güven kapsamıyla çalıştırır; /deny reddeder."
  t294: "/restart, aktif çalışmaları tamamlayıp gateway'i düzgün biçimde yeniden başlatır, ardından geri geldiğinde isteyeni bilgilendirir."
  t295: "/kanban boards switch <slug>, aktif çok projeli Kanban panosunu sohbet içinden değiştirir."
  t296: "/reload, ~/.icebath/.env dosyasını çalışan oturuma yeniden yükler — yeniden başlatmadan yeni API anahtarlarını alın."
  t297: "no_agent=True ile cronjob, bir betiği zamanlanmış olarak çalıştırır ve stdout çıktısını doğrudan gönderir — sıfır token, sıfır LLM."
  t298: "Boş cron betiği stdout çıktısı sessiz tik demektir — hiçbir şey teslim edilmez; eşik bekçileri için idealdir."
  t299: "ICEBATH_CRON_MAX_PARALLEL (varsayılan 4), anahtarlarınızın ani yüklerle dolmaması için tik başına çalışan cron işi sayısını sınırlar."
  t300: "Gateway kancaları ~/.icebath/hooks/<name>/ altında, olayları ve bir `command:` satırını belirten HOOK.yaml ile bulunur — komut her olayı standart girdiden JSON olarak alır."
  t301: "Hook olayları arasında gateway:startup, session:start, agent:step ve command:* joker abonelikleri bulunur."
  t302: "~/.icebath/BOOT.md dosyasına bir kontrol listesi koyun; gateway:startup hook'u her açılışta onu tek seferlik bir ajan olarak çalıştırır."
  t303: "icebath curator run --dry-run, curator'ın neleri arşivleyeceğini veya birleştireceğini hiçbir şeyi değiştirmeden önizler."
  t304: "icebath curator pin <skill>, bir skill'i hem otomatik arşivlemeye hem de ajanın skill_manage aracına karşı sıkı biçimde korur."
  t305: "icebath curator rollback, skill'leri çalıştırma öncesi anlık görüntüden geri yükler — yedekler skills/.curator_backups/ altında durur."
  t306: "icebath auth reset <provider> [target], bekleme sürelerini ve tükenme işaretlerini tüm kimlik bilgisi havuzunda ya da dizin, id veya etikete göre tek bir kimlik bilgisinde temizler."
  t307: "credential_pool_strategies.<provider>: round_robin, varsayılan fill_first yerine anahtarları eşit biçimde sırayla kullanır."
  t308: "provider_routing.data_collection: deny, OpenRouter'da veri saklayan sağlayıcıları dışarıda bırakır."
  t309: "provider_routing.require_parameters: true, yalnızca isteğinizdeki her parametreyi destekleyen sağlayıcılara yönlendirir."
  t310: "ICEBATH_TUI_RESUME=1, başlatıldığında en son TUI oturumuna otomatik olarak yeniden bağlanır — SSH kopmalarından sonra işe yarar."
  t311: "ICEBATH_TUI_THEME=light|dark|<hex>, COLORFGBG ayarlamayan terminallerde TUI temasını zorla belirler."
  t312: "TUI'de Ctrl+G veya Ctrl+X Ctrl+E, uzun çok satırlı istemler için giriş arabelleğini $EDITOR içinde açar."
  t313: "TUI, LaTeX'i satır içinde işler — $E=mc^2$ ham TeX yerine Unicode matematik olarak görünür."
  t314: "display.tool_progress_command: true, /verbose komutunu mesajlaşma platformlarında da kullanılabilir yapar; varsayılan olarak yalnızca CLI'dadır."
  t315: "ICEBATH_BACKGROUND_NOTIFICATIONS=result, yalnızca arka plan görevleri bitince bildirim gönderir (diğer seçenekler: concise/all/error/off)."
  t316: "ICEBATH_WRITE_SAFE_ROOT, write_file/patch araçlarını belirli dizin öneklerine kısıtlar; birden çok yol os.pathsep (: veya ;) ile ayrılır."
  t317: "ICEBATH_IGNORE_RULES, AGENTS.md, SOUL.md, .cursorrules, bellek ve önceden yüklenen skill'lerin otomatik eklenmesini atlar."
  t318: "ICEBATH_ACCEPT_HOOKS, config.yaml içinde tanımlı ancak daha önce görülmemiş kabuk hook'larını TTY sorusu olmadan otomatik onaylar."
  t319: "auxiliary.goal_judge.model, /goal değerlendiricisini ucuz ve hızlı bir modele yönlendirerek döngü maliyetini sıfıra yakın tutar."
  t320: "Kontrol noktaları, devasa monorepo'larda yavaş git işlemlerini önlemek için 50.000'den fazla dosya içeren dizinleri atlar."
  t321: "tts.provider: piper, CPU üzerinde 44 dilli yerel TTS çalıştırır — sesler ~/.icebath/cache/fetch/ dizinine otomatik indirilir."
  t322: "tts.providers.<name>.type: command, {input_path} ve {output_path} yer tutucularıyla herhangi bir CLI TTS motorunu bağlar."
  t323: "API_SERVER_ENABLED=true, Open WebUI ve LibreChat için gateway'in yanında OpenAI uyumlu bir uç nokta çalıştırır."
  t324: "GATEWAY_PROXY_URL bölünmüş bir kurulum sağlar: platform G/Ç'si yerelde, ajan işi uzak bir API sunucusuna devredilir."
  t325: "MATRIX_DEVICE_ID, E2EE için sabit bir cihaz kimliği belirler — yoksa anahtarlar her başlatmada değişir ve geçmiş mesajların şifresi çözülemez."
  t326: "TELEGRAM_WEBHOOK_URL ayarlandığında TELEGRAM_WEBHOOK_SECRET zorunludur — openssl rand -hex 32 ile üretin."
  t327: "icebath batch --resume, tamamlanan istemleri metne göre eşleştirir; böylece veri kümesi yeniden sıralansa bile biten işler tekrar çalışmaz."
  t328: "/new, yerinde yeni bir oturum başlatır (takma adı /reset) — yeni oturum kimliği, temiz geçmiş, CLI açık kalır."
  t329: "/clear, terminal ekranını siler VE yeni bir oturum başlatır — görsel sıfırlama için tek kısayol."
  t330: "/history, CLI'dan çıkmadan geçerli konuşmayı satır içinde yazdırır — hızlı bir yeniden okuma için kullanışlıdır."
  t331: "/save, oturumu sonlandırmadan geçerli konuşmayı diske yazar."
  t332: "/status, oturum bilgilerini tek bakışta gösterir: kimlik, başlık, model, token kullanımı ve geçen süre."
  t333: "/image <path>, yapıştırma veya sürükle-bırak olmadan sonraki isteminize yerel bir görüntü dosyası ekler."
  t334: "/platforms, gateway ve mesajlaşma platformu bağlantı durumunu doğrudan sohbet içinden gösterir."
  t335: "/commands, tüm slash komutu + kurulu skill listesini sayfalar halinde gösterir — tab tamamlaması olmayan platformlarda işe yarar."
  t336: "/toolsets, -t/--toolsets seçeneğinin neleri kabul ettiğini bilmeniz için mevcut tüm araç setlerini listeler."
  t337: "/voice tts, yalnızca TTS modunu açıp kapatır — ajan yanıtlarını sesli okur ama istemlerinizi yine siz yazarsınız."
  t338: "/reload-skills, ~/.icebath/skills/ dizinini yeniden tarar; böylece eklenen skill'ler oturumu yeniden başlatmadan görünür."
  t339: "/indicator unicode|emoji|ascii, ajan çalışırken TUI'de gösterilen meşgul göstergesi stilini seçer."
  t340: "/debug, bir destek paketi (sistem bilgisi + günlükler) yükler ve paylaşılabilir bağlantılar döndürür — sohbette de çalışır."
  t341: "icebath -z \"<prompt>\" en saf tek seferlik kullanımdır: stdout'a yalnızca nihai yanıt, başka hiçbir şey yok — betiklerde borulamak için idealdir."
  t342: "icebath chat --pass-session-id, oturum kimliğini sistem istemine ekler; böylece ajan kendi oturumuna atıfta bulunabilir."
  t343: "icebath chat --image path/to/pic.png, ayrı bir yükleme adımı olmadan tek bir -q sorgusuna yerel bir görüntü ekler."
  t344: "icebath chat --ignore-user-config, etkin kullanıcı yapılandırmasını atlar — tekrarlanabilir hata raporları ve CI çalıştırmaları için."
  t345: "icebath chat --source tool, programatik sohbetleri etiketler; böylece icebath sessions list çıktısını kalabalıklaştırmazlar."
  t346: "icebath dump --show-keys, daha derin destek hata ayıklaması için maskelenmiş API anahtarı parmak izlerini de içerir."
  t347: "icebath sessions rename <ID> \"new title\" geçmiş herhangi bir oturumu yeniden adlandırır; icebath sessions delete <ID> bir oturumu siler."
  t348: "icebath import, tam bir Icebath yedek zip'ini geri yükler."
  t349: "icebath fallback, fallback_model zincirini etkileşimli olarak yönetir — config.yaml'ı elle düzenlemek gerekmez."
  t350: "icebath pairing, DM eşleştirme belirtecini yeniler — yenilemeden sonra ilk mesaj gönderen kişi bota erişimi alır."
  t351: "/setup, ilk kez kullananları sağlayıcı, anahtarlar ve platform bağlantısı adımlarından tek bir etkileşimli akışta geçirir."
  t352: "icebath status --deep, tüm bileşenlerde eksiksiz bir sağlık taraması yapar; sade icebath status hızlı görünümdür."
  t353: "ICEBATH_AGENT_TIMEOUT=0, çalışan bir ajan için gateway'in hareketsizlik nedeniyle sonlandırmasını kapatır — uzun araştırma çalıştırmalarında kullanın."
  t354: "ICEBATH_ENABLE_PROJECT_PLUGINS=1, ./.icebath/plugins/ içindeki depoya özel eklentileri otomatik yükler — tasarım gereği güven onayına bağlıdır."
  t355: "ICEBATH_DISABLE_FILE_STATE_GUARD=1, patch ve write_file üzerindeki 'dosya okuduğunuzdan beri değişti' korumasını kapatır."
  t356: "ICEBATH_ALLOW_PRIVATE_URLS=true, web araçlarının localhost'a ve özel ağlara erişmesine izin verir — gateway modunda varsayılan olarak kapalıdır."
  t357: "ICEBATH_OPTIONAL_SKILLS=name1,name2, profil başına ilk çalıştırmada isteğe bağlı katalogdan ek skill'leri otomatik kurar."
  t358: "ICEBATH_BUNDLED_SKILLS, özel bir paketlenmiş skill ağacını gösterir — Homebrew ve Nix paketlemesinde kullanılır."
  t359: "ICEBATH_DUMP_REQUEST_STDOUT=1, her API isteğinin yükünü günlük dosyaları yerine stdout'a döker."
  t360: "ICEBATH_OAUTH_TRACE=1, sağlayıcı kimlik doğrulamasında hata ayıklamak için maskelenmiş OAuth belirteç değişimi ve yenileme denemelerini günlüğe yazar."
  t361: "ICEBATH_STREAM_RETRIES (varsayılan 3), geçici ağ hatalarında akış ortasında yeniden bağlanma denemelerinin sayısını belirler."
  t362: "ICEBATH_GATEWAY_BUSY_ACK_ENABLED=false, bir kullanıcı meşgul bir ajana mesaj yazdığında gönderilen ⚡/⏳/⏩ onay mesajlarını susturur."
  t363: "ICEBATH_AGENT_NOTIFY_INTERVAL (varsayılan 180s), uzun turlarda gateway'in ne sıklıkla ilerleme bildirimi göndereceğini ayarlar."
  t364: "ICEBATH_RESTART_DRAIN_TIMEOUT (varsayılan 900s), /restart komutunun zorlamadan önce devam eden çalıştırmaları ne kadar bekleyeceğini sınırlar."
  t365: "ICEBATH_CHECKPOINT_TIMEOUT (varsayılan 30s), dosya sistemi kontrol noktası oluşturma süresini sınırlar — devasa monorepo'larda yükseltin."
  t366: "config.yaml içindeki image_gen.model, FAL modelini seçer: flux-2/klein, gpt-image-2, nano-banana-pro ve daha fazlası."
  t367: "image_gen.provider, görüntü üretimini varsayılan yerine bir eklenti (OpenAI Images, Codex, FAL) üzerinden yönlendirir."
  t368: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY, görüntü analizini OpenAI uyumlu herhangi bir uç noktaya yönlendirir."
  t369: "API_SERVER_MODEL_NAME, /v1/models üzerindeki model adını özelleştirir — çok profilli Open WebUI kurulumları için şarttır."
  t370: "--source tool sohbetleri varsayılan olarak icebath sessions list çıktısında yer almaz — görmek için --source değerini açıkça belirtin."
