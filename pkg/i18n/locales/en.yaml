explainer:

  # Turn-completion explanations and file-mutation footers (agent/turn_explainers.py). Appended to
  # the human-facing reply after the transcript row is written; the model never sees them.
  no_reply_prefix: "⚠️ No reply: "
  empty_response: "{model} didn't produce a reply this time, even after retries. Send `continue` to try again, or switch models with /model."
  exit:

    all_retries_exhausted_no_response: "the model provider didn't answer after all retries. Send /retry, or switch models with /model."
    partial_stream_recovery: "streaming stopped early and only a partial response was recovered. Send `continue` to resume from where it stopped."
    fallback_prior_turn_content: "no new content was produced this turn; showing recovered prior context. Send `continue` to retry."
    redirect_restart_limit_exceeded: "the request was cancelled by a new correction on every attempt, so the turn stopped instead of retrying forever. Your last correction is queued as the next message."
    rebuilt_restart_limit_exceeded: "every provider in the fallback chain kept failing over, so the turn stopped instead of retrying forever. Send `continue` or switch provider."
    budget_exhausted: "the per-turn iteration/cost budget was exhausted before a final answer. Send `continue` to keep going."
    ollama_runtime_context_too_small: "the local model's context window was too small to finish. Increase the context size or use a larger model."
    pending_tool_result: "the turn stopped while a tool result was still pending and the model produced no follow-up text. Send `continue` to let it summarize."
    interrupted_during_api_call: "the request was interrupted mid-call before a reply was received. Send `continue` to retry."
    max_iterations_reached: "the maximum tool-iteration limit was reached before a final answer. Send `continue` to keep going, or raise `max_iterations`."
    error_near_max_iterations: "an error occurred near the iteration limit before a final answer. Check the tool output above, then send `continue`."
    repeated_outer_errors: "the turn kept failing with repeated errors and was stopped early instead of retrying forever. Check the errors above, then send `continue` to retry."
  persistence:

    compression: "the turn was stopped because another process was compressing this session. Your message should already be saved — please send it again after compression completes."
    compression_closed: "the turn was stopped because this session was rotated by context compression and its live continuation could not be adopted. The storage itself is healthy — refresh the client (or start a new turn) so it picks up the new session id, then send your message again."
    turn_lease: "the turn was stopped because another Icebath process took over this session. Your reply was not saved — wait for the other process to finish, then send your message again."
    session_row_missing: "this session was deleted from storage while the chat was still open, and Icebath could not recreate it, so this message was not saved. Send your message again; if it keeps failing, run `icebath {profile_arg}doctor`."
    locked: "the turn was stopped because session storage was busy (another Icebath process was writing to the state database). Your message should already be saved — please send it again in a moment."
    replaced: "the session database file was replaced while Icebath was running, so this message was not saved (a copy is kept in {home}/sessions/). Stop Icebath (`icebath {profile_arg}gateway stop`), run `icebath {profile_arg}doctor` — not `icebath {profile_arg}doctor --fix`, which would repair the wrong file in place — then start it again and send your message once more. Advanced recovery steps are in the log."
    deleted_wal: "another Icebath process still holds an old copy of the session database's write-ahead log, so Icebath stopped writing to keep the file safe and this message was not saved (a copy is kept in {home}/sessions/). Nothing is lost. Quit every Icebath process on this profile (`icebath {profile_arg}gateway stop`, cron), run `icebath {profile_arg}doctor` — it names any process still holding the log — then start Icebath again and send your message once more. Do not run `doctor --fix` or delete any state.db files while they run. Guide: {recovery_docs}"
    corrupt: "the turn was stopped because the state database reported structural corruption (the transcript would have been lost on restart). Freeing disk space will not help. Recovery options:\n1. Run `icebath {profile_arg}doctor --fix`\n2. Stop the gateway, then recover with:\n   icebath {profile_arg}sessions recover --source {db_path} --inspect-only\n   (if it reports recoverable) icebath {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — recovery snapshots the damaged file first; do NOT run `sqlite3 ... \".recover\"` against the live state.db, a vulnerable sqlite3 CLI can corrupt it further\n3. Restore from a backup in {backups_dir}/\nThen send your message again."
    fts_index: "the turn was stopped because the session search index (FTS5) is corrupt and could not be detached, so this message was not saved. The message store itself is not damaged: do not run recovery tools or restore a backup. Run `icebath {profile_arg}doctor --fix` (or restart Icebath, which repairs the index on open), then send your message again."
    disk: "Icebath couldn't save this conversation to disk, so it stopped rather than lose your messages. The disk is probably full: free some space (or fix the permissions on {home}/state.db), then send your message again."
    default: "Icebath couldn't save this conversation, so it stopped rather than lose your messages. Possible causes: the drive is out of room, or another Icebath process is holding the database. Close other Icebath windows, run `icebath {profile_arg}doctor` to check storage, then send your message again."
  file_mutation:

    header: "⚠️ File-mutation verifier: {count} file edit(s) FAILED this turn despite any wording above that may suggest otherwise. Run `git status` or `read_file` to confirm what actually landed."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "failed"
  shared:

    and_more: "  • … and {count} more"
    the_model: "The model"

tips:

  # CLI startup / /new discovery tips (icebath_cli/tips.py). Zero-padded index keeps YAML
  # order stable; pickers read tips.tNNN for the active language.
  t001: "/bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it."
  t002: "/branch forks the current session so you can explore a different direction without losing progress."
  t003: "/compress manually compresses conversation context when things get long."
  t004: "/rollback lists filesystem checkpoints — restore files the agent modified to any prior state."
  t005: "/rollback diff 2 previews what changed since checkpoint 2 without restoring anything."
  t006: "/rollback 2 src/file.py restores a single file from a specific checkpoint."
  t007: "/title \"my project\" names your session — resume it later with /resume or icebath -c."
  t008: "/resume picks up where you left off in a previously named session."
  t009: "/queue <prompt> queues a message for the next turn without interrupting the current one."
  t010: "/undo removes the last user/assistant exchange from the conversation."
  t011: "/retry resends your last message — useful when the agent's response wasn't quite right."
  t012: "/verbose cycles tool progress display: off → new → all → verbose."
  t013: "/reasoning high increases the model's thinking depth. /reasoning show displays the reasoning."
  t014: "/fast toggles priority processing for faster API responses (provider-dependent)."
  t015: "/yolo skips all dangerous command approval prompts for the rest of the session."
  t016: "/model lets you switch models mid-session — try /model sonnet or /model gpt-5."
  t017: "/model --global changes your default model permanently."
  t018: "/personality pirate sets a fun personality — 14 built-in options from kawaii to shakespeare."
  t019: "/skin changes the CLI theme — try taro, light, contrast, cyberpunk, or dracula."
  t020: "/statusbar toggles a persistent bar showing model, tokens, context fill %, cost, and duration."
  t021: "/tools disable browser temporarily removes browser tools for the current session."
  t022: "/browser connect attaches browser tools to your running Chromium-family browser via CDP."
  t023: "/plugins lists installed plugins and their status."
  t024: "/cron manages scheduled tasks — set up recurring prompts with delivery to any platform."
  t025: "/reload-mcp hot-reloads MCP server configuration without restarting."
  t026: "/usage shows token usage, cost breakdown, and session duration."
  t027: "/insights shows usage analytics for the last 30 days."
  t028: "/paste checks your clipboard for an image and attaches it to your next message."
  t029: "/profile shows which profile is active and its home directory."
  t030: "/config shows your current configuration at a glance."
  t031: "/stop kills all running background processes spawned by the agent."
  t032: "@file:path/to/file.py injects file contents directly into your message."
  t033: "@file:main.py:10-50 injects only lines 10-50 of a file."
  t034: "@folder:src/ injects a directory tree listing."
  t035: "@diff injects your unstaged git changes into the message."
  t036: "@staged injects your staged git changes (git diff --staged)."
  t037: "@git:5 injects the last 5 commits with full patches."
  t038: "@url:https://example.com fetches and injects a web page's content."
  t039: "Typing @ triggers filesystem path completion — navigate to any file interactively."
  t040: "Combine multiple references: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter inserts a newline for multi-line input. (Windows Terminal intercepts Alt+Enter — use Ctrl+Enter instead.)"
  t042: "Ctrl+C interrupts the agent. Double-press within 2 seconds to force exit."
  t043: "Ctrl+Z suspends Icebath to the background — run fg in your shell to resume."
  t044: "Type / to open the command list — Tab or the arrow keys move through the suggestions and Enter inserts the selected one."
  t045: "Type a new message while the agent is working to interrupt and redirect it."
  t046: "Alt+V pastes an image from your clipboard into the conversation."
  t047: "Pasting 5 or more lines folds the text into a compact chip in the prompt — Ctrl+P on the chip opens it to read or edit."
  t048: "icebath -c resumes your most recent CLI session. icebath -c \"project name\" resumes by title."
  t049: "icebath -w creates an isolated git worktree — perfect for parallel agent workflows."
  t050: "icebath -w -q \"Fix issue #42\" combines worktree isolation with a one-shot query."
  t051: "icebath chat -t web,terminal enables only specific toolsets for a focused session."
  t052: "icebath chat -s github-pr-workflow preloads a skill at launch."
  t053: "icebath chat -q \"query\" runs a single non-interactive query and exits."
  t054: "icebath chat --max-turns 1000 overrides the default 500-iteration limit per turn."
  t055: "icebath chat --checkpoints enables filesystem snapshots before every destructive file change."
  t056: "icebath --yolo bypasses all dangerous command approval prompts for the entire session."
  t057: "icebath chat --source telegram tags the session for filtering in icebath sessions list."
  t058: "icebath -p work chat runs under a specific profile without changing your default."
  t059: "icebath doctor --fix diagnoses and auto-repairs config and dependency issues."
  t060: "icebath dump outputs a compact setup summary — great for bug reports."
  t061: "icebath config set KEY VALUE auto-routes secrets to .env and everything else to config.yaml."
  t062: "icebath config edit opens config.yaml in your default editor."
  t063: "icebath config check scans for missing or stale configuration options."
  t064: "icebath sessions browse opens an interactive session picker with search."
  t065: "icebath sessions stats shows session counts by platform and database size."
  t066: "icebath sessions prune --older-than 30 cleans up old sessions."
  t067: "icebath skills search react --source skills-sh searches the skills.sh public directory."
  t068: "icebath skills check scans installed hub skills for upstream updates."
  t069: "icebath skills tap add myorg/skills-repo adds a custom GitHub skill source."
  t070: "icebath skills snapshot export setup.json exports your skill configuration for backup or sharing."
  t071: "icebath mcp add github --command npx adds MCP servers from the command line."
  t072: "icebath mcp-serve runs Icebath itself as an MCP server for other agents."
  t073: "icebath auth add lets you add multiple API keys for credential pool rotation."
  t074: "icebath completion bash >> ~/.bashrc enables tab completion for all commands and profiles."
  t075: "icebath logs -f follows agent.log in real time. --level WARNING --since 1h filters output."
  t076: "icebath backup creates a zip backup of your entire Icebath home directory."
  t077: "icebath profile create coder creates an isolated profile that becomes its own command."
  t078: "icebath profile create work --clone copies your current config and keys to a new profile."
  t079: "icebath update syncs new bundled skills to ALL profiles automatically."
  t080: "icebath gateway install sets up Icebath as a system service (systemd/launchd)."
  t081: "icebath memory setup lets you configure an external memory provider (RetainDB, ByteRover, etc.)."
  t082: "icebath webhook subscribe creates event-driven webhook routes with HMAC validation."
  t083: "Save money: icebath tools disables unused tools, icebath skills config trims skills down."
  t084: "/reasoning low or /reasoning minimal cuts thinking depth below the default (medium) — faster, cheaper responses."
  t085: "icebath kanban reopen <task-id> takes a done or archived task back to ready; the tasks that built on it return to todo."
  t086: "Set display.bell_on_complete: true in config.yaml to hear a bell when long tasks finish."
  t087: "Set display.streaming: true to see tokens appear in real time as the model generates."
  t088: "Set display.show_reasoning: false to hide the model's reasoning — it is shown by default."
  t089: "/language (alias /lang) picks the language of the UI — /language de switches straight to German."
  t090: "Set display.busy_input_mode: queue to queue messages instead of interrupting the agent, or steer to inject them mid-run via /steer."
  t091: "/rewind goes back to an earlier prompt so you can edit and resend it; /rewind fork N opens it in a new session instead."
  t092: "Set compression.threshold: 0.50 to control when auto-compression fires (default: 50% of context)."
  t093: "Set agent.max_turns: 1000 to let the agent take more tool-calling steps per turn."
  t094: "Set file_read_max_chars: 200000 to increase the max content per read_file call."
  t095: "Set approvals.mode: smart to let an LLM auto-approve safe commands and auto-deny dangerous ones."
  t096: "Set fallback_model in config.yaml to automatically fail over to a backup provider."
  t097: "Set privacy.redact_pii: true to hash user IDs and phone numbers before sending to the LLM."
  t098: "Set browser.headed: true to watch the local Chromium window while the agent browses."
  t099: "Set worktree: true in config.yaml to always create a git worktree (same as icebath -w)."
  t100: "Set security.website_blocklist.enabled: true to block specific domains from web tools."
  t101: "Set cron.wrap_response: false to deliver raw agent output without the cron header/footer."
  t102: "ICEBATH_TIMEZONE overrides the server timezone with any IANA timezone string."
  t103: "Environment variable substitution works in config.yaml: use ${VAR_NAME} syntax."
  t104: "Quick commands in config.yaml run shell commands instantly with zero token usage."
  t105: "Custom personalities can be defined in config.yaml under agent.personalities."
  t106: "provider_routing controls OpenRouter provider sorting, whitelisting, and blacklisting."
  t107: "execute_code runs Python scripts that call Icebath tools programmatically — results stay out of context."
  t108: "delegate_task spawns up to 10 concurrent sub-agents by default (delegation.max_concurrent_children) with isolated contexts for parallel work."
  t109: "web_extract works on PDF URLs — pass any PDF link and it converts to markdown."
  t110: "search_files is ripgrep-backed and faster than grep — use it instead of terminal grep."
  t111: "patch uses 9 fuzzy matching strategies so minor whitespace differences won't break edits."
  t112: "patch supports V4A format for bulk multi-file edits in a single call."
  t113: "read_file suggests similar filenames when a file isn't found."
  t114: "read_file auto-deduplicates — re-reading an unchanged file returns a lightweight stub."
  t115: "Set browser.user_data_dir to a folder to keep one persistent Chromium profile, so site logins survive between sessions."
  t116: "browser.chromium_args adds extra Chromium flags to local browser sessions, for example --lang=de."
  t117: "image_generate creates images with FLUX 2 Pro and automatic 2x upscaling."
  t118: "text_to_speech converts text to audio — plays as voice bubbles on Telegram."
  t119: "send_message can reach any connected messaging platform from within a session."
  t120: "The todo tool helps the agent track complex multi-step tasks during a session."
  t121: "session_search performs full-text search across ALL past conversations."
  t122: "The agent automatically saves preferences, corrections, and environment facts to memory."
  t123: "/moa routes one hard prompt through your configured Mixture of Agents model set."
  t124: "Terminal commands support background mode with notify_on_complete for long-running tasks."
  t125: "Terminal background processes support watch_patterns to alert on specific output lines."
  t126: "The terminal tool supports 6 backends: local, Docker, SSH, Modal, Daytona, and Singularity."
  t127: "Each profile gets its own config, API keys, memory, sessions, skills, and cron jobs."
  t128: "Profile names become shell commands — 'icebath profile create coder' creates the 'coder' command."
  t129: "icebath profile export coder -o backup.tar.gz creates a portable profile archive."
  t130: "If two profiles accidentally share a bot token, the second gateway is blocked with a clear error."
  t131: "Sessions auto-generate descriptive titles after the first exchange — no manual naming needed."
  t132: "Session titles support lineage: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "When exiting, Icebath prints a resume command with session ID and stats."
  t134: "icebath sessions export backup.jsonl exports all sessions for backup or analysis."
  t135: "icebath -r SESSION_ID resumes any specific past session by its ID."
  t136: "Memory is a frozen snapshot — changes appear in the system prompt only at next session start."
  t137: "Memory entries are automatically scanned for prompt injection and exfiltration patterns."
  t138: "The agent has two memory stores: personal notes (~2200 chars) and user profile (~1375 chars)."
  t139: "Corrections you give the agent (\"no, do it this way\") are often auto-saved to memory."
  t140: "Over 40 bundled skills covering software development, devops, creative work, productivity, research, and more."
  t141: "Every installed skill automatically becomes a slash command — type / to see them all."
  t142: "icebath skills install official/security/1password installs optional skills from the repo."
  t143: "Skills can restrict to specific OS platforms — some only load on macOS or Linux."
  t144: "skills.external_dirs in config.yaml lets you load skills from custom directories."
  t145: "The agent can create its own skills as procedural memory using skill_manage."
  t146: "/plan writes a markdown implementation plan to .icebath/plans/ without executing anything."
  t147: "Cron jobs can attach skills: icebath cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Cron delivery targets include telegram, discord, slack, email, sms, and 12+ more platforms."
  t149: "If a cron response starts with [SILENT], delivery is suppressed — useful for monitoring-only jobs."
  t150: "Cron supports relative delays (30m), intervals (every 2h), cron expressions, and ISO timestamps."
  t151: "Cron jobs run in completely fresh agent sessions — prompts must be self-contained."
  t152: "Voice mode works with zero API keys if faster-whisper is installed (free local speech-to-text)."
  t153: "Eleven TTS providers: Edge TTS (free), ElevenLabs, OpenAI, xAI, MiniMax, Mistral, Gemini, DeepInfra, and the free local NeuTTS, KittenTTS and Piper."
  t154: "/voice on enables voice mode in the CLI. Ctrl+B toggles push-to-talk recording."
  t155: "Streaming TTS plays sentences as they generate — you don't wait for the full response."
  t156: "Voice messages on Telegram, Discord, WhatsApp, and Slack are auto-transcribed."
  t157: "Icebath runs on 21 messaging platforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, and more."
  t158: "icebath gateway install sets it up as a system service that starts on boot."
  t159: "DingTalk uses Stream Mode — no webhooks or public URL needed."
  t160: "BlueBubbles brings iMessage to Icebath via a local macOS server."
  t161: "Webhook routes support HMAC validation, rate limiting, and event filtering."
  t162: "The API server exposes an OpenAI-compatible endpoint compatible with Open WebUI and LibreChat."
  t163: "Discord voice channel mode: the bot joins VC, transcribes speech, and talks back."
  t164: "group_sessions_per_user: true gives each person their own session in group chats."
  t165: "/sethome marks a chat as the home channel for cron job deliveries."
  t166: "The gateway supports inactivity-based timeouts — active agents can run indefinitely."
  t167: "Dangerous command approval has 4 tiers: once, session, always (permanent allowlist), deny."
  t168: "Smart approval mode uses an LLM to auto-approve safe commands and flag dangerous ones."
  t169: "SSRF protection blocks private networks, loopback, link-local, and cloud metadata addresses."
  t170: "Session IDs are timestamp-prefixed (20250305_091523_abcd) so sorting works naturally in ls and jq."
  t171: "MCP subprocesses receive a filtered environment — only safe system vars pass through."
  t172: "Context files (.icebath.md, AGENTS.md) are security-scanned for prompt injection before loading."
  t173: "command_allowlist in config.yaml permanently approves specific shell command patterns."
  t174: "Context auto-compresses when it reaches the threshold — memories are flushed and history summarized."
  t175: "The status bar turns yellow, then orange, then red as context fills up."
  t176: "SOUL.md is the agent's primary identity file — customize it to shape behavior."
  t177: "Icebath loads project context from .icebath.md, AGENTS.md, CLAUDE.md, or .cursorrules (first match)."
  t178: "Subdirectory AGENTS.md files are discovered progressively as the agent navigates into folders."
  t179: "Context files are capped at 20,000 characters with smart head/tail truncation."
  t180: "Browser backends: local Chromium, Lightpanda, Browserbase, Browser Use and Firecrawl — plus Camofox, built in."
  t181: "Camofox (anti-detection Firefox) is built in: set it up with icebath camofox setup."
  t182: "browser_exec runs several browser steps in one Python call — navigate, extract and click together."
  t183: "browser.dialog_policy sets how native page dialogs are handled: must_respond (the agent answers with browser_dialog), auto_dismiss or auto_accept."
  t184: "icebath mcp opens an interactive picker of the MCPs in icebath's built-in catalog you can install in one keystroke."
  t185: "icebath mcp catalog lists the MCP servers built into icebath."
  t186: "icebath mcp install <name> installs a catalog entry, prompts for credentials, and lets you pick which of its tools to enable."
  t187: "MCP servers are configured in config.yaml — both stdio and HTTP transports supported."
  t188: "Per-server tool filtering: tools.include whitelists and tools.exclude blacklists specific tools."
  t189: "MCP servers auto-generate toolsets at runtime — icebath tools can toggle them per platform."
  t190: "MCP OAuth support: auth: oauth enables browser-based authorization with PKCE."
  t191: "Checkpoints are off by default — turn them on with icebath chat --checkpoints or checkpoints.enabled: true. They cost nothing while no files are modified."
  t192: "A pre-rollback snapshot is saved automatically so you can undo the undo."
  t193: "/rollback also undoes the conversation turn, so the agent doesn't remember rolled-back changes."
  t194: "Checkpoints use shadow repos in ~/.icebath/checkpoints/ — your project's .git is never touched."
  t195: "icebath batch processes hundreds of prompts in parallel for training data generation."
  t196: "icebath chat -Q enables quiet mode for programmatic use — suppresses banner and spinner."
  t197: "Trajectory saving (--save-trajectories) captures full tool-use traces for model training."
  t198: "Three plugin types: general (tools/hooks), memory providers, and context engines."
  t199: "icebath plugins install owner/repo installs plugins directly from GitHub."
  t200: "External memory providers: RetainDB and ByteRover are built in, others install with icebath plugins install <source>."
  t201: "Plugin hooks include pre/post_tool_call, pre/post_llm_call, and transform_terminal_output for output canonicalization."
  t202: "Prompt caching (Anthropic) reduces costs by reusing cached system prompt prefixes."
  t203: "The agent auto-generates session titles in a background thread — zero latency impact."
  t204: "Smart model routing can auto-route simple queries to a cheaper model."
  t205: "/terminal-setup configures the keybindings of an IDE terminal (VS Code, Cursor, Windsurf) for multiline input, undo, redo and copy."
  t206: "Dragging a file path into the terminal auto-attaches images or sends as context."
  t207: ".worktreeinclude in your repo root lists gitignored files to copy into worktrees."
  t208: "icebath acp runs Icebath as an ACP server for VS Code, Zed, and JetBrains integration."
  t209: "Custom providers: save named endpoints in config.yaml under custom_providers."
  t210: "ICEBATH_EPHEMERAL_SYSTEM_PROMPT injects a system prompt that's never persisted to history."
  t211: "credential_pool_strategies supports fill_first, round_robin, least_used, and random rotation."
  t212: "icebath auth add xai-oauth or icebath auth add openai-codex sets up OAuth-based providers."
  t213: "The API server supports both Chat Completions and Responses API with server-side state."
  t214: "tool_preview_length: 0 in config shows full file paths in the spinner's activity feed."
  t215: "icebath status --deep runs deeper diagnostic checks across all components."
  t216: "Cron jobs can attach a Python script (--script) whose stdout is injected into the prompt as context."
  t217: "Cron scripts live in ~/.icebath/scripts/ and run before the agent — perfect for data collection pipelines."
  t218: "prefill_messages_file in config.yaml injects few-shot examples into every API call, never saved to history."
  t219: "SOUL.md completely replaces the agent's default identity — rewrite it to make Icebath your own."
  t220: "SOUL.md is auto-seeded with a default personality on first run. Edit it to customize."
  t221: "/compress <focus topic> allocates 60-70% of the summary budget to your topic and aggressively trims the rest."
  t222: "On second+ compression, the compressor updates the previous summary instead of starting from scratch."
  t223: "Before a gateway session reset, Icebath auto-flushes important facts to memory in the background."
  t224: "network.force_ipv4: true in config.yaml fixes hangs on servers with broken IPv6 — monkey-patches socket."
  t225: "The terminal tool annotates common exit codes: grep returning 1 = 'No matches found (not an error)'."
  t226: "Failed foreground terminal commands auto-retry up to 3 times with exponential backoff (2s, 4s, 8s)."
  t227: "Bare sudo commands are auto-rewritten to pipe SUDO_PASSWORD from .env — no interactive prompt needed."
  t228: "execute_code helpers require explicit imports: from icebath_tools import json_parse, shell_quote, retry."
  t229: "execute_code's 7 sandbox tools (web_search, terminal, read/write/search/patch) use RPC — never enter context."
  t230: "Reading the same file region 3+ times triggers a warning. At 4+, it's hard-blocked to prevent loops."
  t231: "write_file and patch detect if a file was externally modified since the last read and warn about staleness."
  t232: "V4A patch format supports Add File, Delete File, and Move File directives — not just Update."
  t233: "MCP servers can request LLM completions back via sampling — the agent becomes a tool for the server."
  t234: "MCP servers send notifications/tools/list_changed to trigger automatic tool re-registration without restart."
  t235: "delegate_task with acp_command: 'claude' spawns Claude Code as a child agent from any platform."
  t236: "Delegation has a heartbeat thread — child activity propagates to the parent, preventing gateway timeouts."
  t237: "When a provider returns HTTP 402 (payment required), the auxiliary client auto-falls back to the next one."
  t238: "agent.tool_use_enforcement steers models that describe actions instead of calling tools — auto for GPT/Codex."
  t239: "agent.restart_after_turn_timeout lets in-flight turns finish before /restart enters stop(); restart_drain_timeout is only the force-interrupt budget once stop() begins."
  t240: "agent.api_max_retries (default 3) controls how many times the agent retries a failed API call before surfacing the error — lower it for fast fallback."
  t241: "The gateway caches AIAgent instances per session — destroying this cache breaks Anthropic prompt caching."
  t242: "Any website can expose skills via /.well-known/skills/index.json — the skills hub discovers them automatically."
  t243: "The skills audit log at ~/.icebath/skills/.hub/audit.log tracks every install and removal operation."
  t244: "Stale git worktrees are auto-cleaned: clean merged trees are removed; idle dirty or unpushed trees are archived first and restorable with icebath worktree restore."
  t245: "Profiles scope Icebath state via ICEBATH_HOME; host tool subprocesses keep your real HOME unless terminal.home_mode is profile."
  t246: "ICEBATH_HOME_MODE env var (octal, e.g. 0701) sets custom directory permissions for web server traversal."
  t247: "Container mode: place .container-mode in ICEBATH_HOME and the host CLI auto-execs into the container."
  t248: "While the agent works, Esc twice on an empty prompt stops the run — a single Esc only cancels the edit of a queued input."
  t249: "Every interrupt during an agent run is logged to ~/.icebath/interrupt_debug.log with timestamps."
  t250: "BROWSER_CDP_URL connects browser tools to any running Chromium-family browser — accepts WebSocket, HTTP, or host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true enables advanced anti-detection with custom Chromium (Scale Plan)."
  t252: "Shift+Tab turns YOLO mode on or off without spending a turn."
  t253: "Quick commands support two types: exec (run shell command directly) and alias (redirect to another command)."
  t254: "Per-task delegation model: delegation.model and delegation.provider in config route subagents to cheaper models."
  t255: "delegation.reasoning_effort independently controls thinking depth for subagents."
  t256: "display.platforms in config.yaml allows per-platform display overrides: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode in config simulates human typing speed — configurable min_ms/max_ms range."
  t258: "Config version migrations run automatically on load — new config keys appear without manual intervention."
  t259: "GPT and Codex models get special system prompt guidance for tool discipline and mandatory tool use."
  t260: "Gemini models get tailored directives for absolute paths, parallel tool calls, and non-interactive commands."
  t261: "context.engine in config.yaml can be set to a plugin name for alternative context management strategies."
  t262: "With a cloud browser, localhost and LAN URLs open in a local Chromium instead (browser.auto_local_for_private_urls, on by default)."
  t263: "The compressor does a cheap pre-pass: tool outputs over 200 chars are replaced with placeholders before the LLM runs."
  t264: "When compression fails, further attempts are paused for 10 minutes to avoid API hammering."
  t265: "Long dangerous commands (>70 chars) get a 'view' option in the approval prompt to see the full text first."
  t266: "Audio level visualization shows ▁▂▃▄▅▆▇ bars during voice recording based on microphone RMS levels."
  t267: "Profile names cannot collide with existing PATH binaries — 'icebath profile create ls' would be rejected."
  t268: "icebath profile create backup --clone-all copies everything (config, keys, SOUL.md, memories, skills, sessions)."
  t269: "The voice record key is configurable via voice.record_key in config.yaml — not just Ctrl+B."
  t270: ".cursorrules and .cursor/rules/*.mdc files are auto-detected and loaded as project context."
  t271: "Context files support 10+ prompt injection patterns — invisible Unicode, 'ignore instructions', exfil attempts."
  t272: "GPT-5 and Codex use 'developer' role instead of 'system' in the message format."
  t273: "Per-task auxiliary overrides: auxiliary.vision.provider, auxiliary.compression.model, etc. in config.yaml."
  t274: "The auxiliary client treats 'main' as a provider alias — resolves to your actual primary provider + model."
  t275: "icebath import-agent openclaw --dry-run previews OpenClaw migration without writing anything."
  t276: "File paths pasted with quotes or escaped spaces are handled automatically — no manual cleanup needed."
  t277: "Slash commands never trigger the large-paste collapse — /command with big arguments works correctly."
  t278: "In interrupt mode, slash commands typed during agent execution bypass interrupt logic and run immediately."
  t279: "ICEBATH_DEV=1 bypasses container mode detection for local development."
  t280: "Each MCP server gets its own toolset (mcp-servername) that can be toggled independently via icebath tools."
  t281: "MCP ${ENV_VAR} placeholders in config are resolved at server spawn — including vars from ~/.icebath/.env."
  t282: "Skills from trusted repos (openai, anthropics, huggingface, NVIDIA, wandb, qdrant, pinecone-io) get a 'trusted' security level; community skills get extra scanning."
  t283: "The skills quarantine at ~/.icebath/skills/.hub/quarantine/ holds skills pending security review."
  t284: "/steer <prompt> injects a note after the next tool call — nudge direction mid-task without interrupting."
  t285: "/goal <text> sets a standing Ralph-loop objective — Icebath auto-continues turn after turn until a judge says done."
  t286: "/snapshot create [label] saves a full state snapshot of Icebath config; /snapshot restore <id> reverts later."
  t287: "/copy [N] copies the last assistant response to your clipboard, or the Nth-from-last with a number."
  t288: "/redraw forces a full UI repaint, fixing terminal drift after tmux resize or mouse selection artifacts."
  t289: "/agents (alias /tasks) shows active agents and running background tasks across the current session."
  t290: "/footer toggles the gateway footer on final replies showing model, context %, and cwd."
  t291: "/busy queue|steer|interrupt controls what pressing Enter does while Icebath is working."
  t292: "/topic in Telegram DMs enables user-managed multi-session topic mode — /topic <id> restores past sessions inline."
  t293: "/approve session|always runs a pending dangerous command with your chosen trust scope; /deny rejects it."
  t294: "/restart gracefully restarts the gateway after draining active runs, then pings the requester when back up."
  t295: "/kanban boards switch <slug> changes the active multi-project Kanban board from inside chat."
  t296: "/reload reloads ~/.icebath/.env into the running session — pick up new API keys without restarting."
  t297: "cronjob with no_agent=True runs a script on schedule and sends its stdout directly — zero tokens, zero LLM."
  t298: "An empty cron script stdout means silent tick — nothing is delivered, perfect for threshold watchdogs."
  t299: "ICEBATH_CRON_MAX_PARALLEL (or cron.max_parallel_jobs) caps how many cron jobs run at once so bursts don't saturate your keys — unset means no cap."
  t300: "Gateway hooks live under ~/.icebath/hooks/<name>/ with a HOOK.yaml naming the events and a `command:` — the command gets each event as JSON on standard input."
  t301: "Hook events include gateway:startup, session:start, agent:step, and command:* wildcard subscriptions."
  t302: "Drop a ~/.icebath/BOOT.md checklist and a gateway:startup hook runs it as a one-shot agent every boot."
  t303: "icebath curator run --dry-run previews what the curator would archive or consolidate without mutating anything."
  t304: "icebath curator pin <skill> hard-fences a skill against both auto-archival and the agent's skill_manage tool."
  t305: "icebath curator rollback restores skills from a pre-run snapshot — backups live under skills/.curator_backups/."
  t306: "icebath auth reset <provider> [target] clears cooldowns and exhaustion flags on a whole credential pool, or on one credential by index, id, or label."
  t307: "credential_pool_strategies.<provider>: round_robin cycles keys evenly instead of the fill_first default."
  t308: "provider_routing.data_collection: deny excludes data-storing providers on OpenRouter."
  t309: "provider_routing.require_parameters: true only routes to providers that support every param in your request."
  t310: "ICEBATH_TUI_RESUME=1 auto-re-attaches to the most recent TUI session on launch — handy after SSH drops."
  t311: "ICEBATH_TUI_THEME=light|dark|<hex> forces the TUI theme on terminals that don't set COLORFGBG."
  t312: "Ctrl+G opens the prompt in $EDITOR for long multi-line input."
  t313: "icebath profile create work --isolated-auth copies the logins into the new profile once instead of sharing the default profile's."
  t314: "display.tool_progress_command: true exposes /verbose on messaging platforms; it's CLI-only by default."
  t315: "ICEBATH_BACKGROUND_NOTIFICATIONS=result only pings when background tasks finish (vs concise/all/error/off)."
  t316: "ICEBATH_WRITE_SAFE_ROOT restricts write_file/patch to directory prefixes; multiple paths via os.pathsep (: or ;)."
  t317: "ICEBATH_IGNORE_RULES skips auto-injection of AGENTS.md, SOUL.md, .cursorrules, memory, and preloaded skills."
  t318: "ICEBATH_ACCEPT_HOOKS auto-approves unseen shell hooks declared in config.yaml without a TTY prompt."
  t319: "auxiliary.goal_judge.model routes the /goal judge to a cheap fast model to keep loop cost near zero."
  t320: "Checkpoints skip directories with more than 50,000 files to avoid slow git operations on massive monorepos."
  t321: "tts.provider: piper runs 44-language local TTS on CPU — voices auto-download to ~/.icebath/cache/fetch/."
  t322: "tts.providers.<name>.type: command wires any CLI TTS engine with {input_path} and {output_path} placeholders."
  t323: "API_SERVER_ENABLED=true runs an OpenAI-compatible endpoint alongside the gateway for Open WebUI and LibreChat."
  t324: "GATEWAY_PROXY_URL runs a split setup: platform I/O locally, agent work delegated to a remote API server."
  t325: "MATRIX_DEVICE_ID pins a stable device ID for E2EE — without it, keys rotate every start and historic decrypt breaks."
  t326: "TELEGRAM_WEBHOOK_SECRET is required whenever TELEGRAM_WEBHOOK_URL is set — generate with openssl rand -hex 32."
  t327: "icebath batch --resume content-matches completed prompts by text so dataset reorders don't re-run finished work."
  t328: "/new starts a fresh session in place (alias /reset) — fresh session ID, clean history, CLI stays open."
  t329: "/clear wipes the terminal screen AND starts a new session — one shortcut for a visual reset."
  t330: "/history prints the current conversation in-line without leaving the CLI — useful for a quick re-read."
  t331: "/save writes the current conversation to disk without ending the session."
  t332: "/status shows session info at a glance: ID, title, model, token usage, and elapsed time."
  t333: "/image <path> attaches a local image file for your next prompt without pasting or drag-and-drop."
  t334: "/platforms shows gateway and messaging-platform connection status right from inside chat."
  t335: "/commands paginates the full slash-command + installed-skill list — useful on platforms without tab completion."
  t336: "/toolsets lists every available toolset so you know what -t/--toolsets accepts."
  t337: "/voice tts toggles TTS-only mode — agent replies out loud but you still type your prompts."
  t338: "/reload-skills re-scans ~/.icebath/skills/ so drop-in skills appear without restarting the session."
  t339: "/indicator unicode|emoji|ascii picks the TUI busy-indicator style shown during agent runs."
  t340: "/debug uploads a support bundle (system info + logs) and returns shareable links — works in chat too."
  t341: "icebath -z \"<prompt>\" is the purest one-shot: final answer on stdout, nothing else — ideal for piping in scripts."
  t342: "icebath chat --pass-session-id injects the session ID into the system prompt so the agent can self-reference it."
  t343: "icebath chat --image path/to/pic.png attaches a local image to a single -q query without a separate upload step."
  t344: "icebath chat --ignore-user-config skips the active user config — reproducible bug reports and CI runs."
  t345: "icebath chat --source tool tags programmatic chats so they don't clutter icebath sessions list."
  t346: "icebath dump --show-keys includes redacted API key fingerprints for deeper support debugging."
  t347: "icebath sessions rename <ID> \"new title\" renames any past session; icebath sessions delete <ID> removes one."
  t348: "icebath import restores a full Icebath backup zip."
  t349: "icebath fallback manages the fallback_model chain interactively — no hand-editing config.yaml."
  t350: "icebath pairing approve <platform> <code> gives a user access with the code the bot sent them; icebath pairing revoke <platform> <user-id> takes it away."
  t351: "/setup configures one section at a time — model, aux, agent, tts, terminal, tools or gateway — and /setup quick starts over from the beginning."
  t352: "icebath status --deep runs the full health sweep across every component; plain icebath status is the quick view."
  t353: "ICEBATH_AGENT_TIMEOUT=0 disables the gateway inactivity kill for a running agent — use for long research runs."
  t354: "ICEBATH_ENABLE_PROJECT_PLUGINS=1 auto-loads repo-local plugins from ./.icebath/plugins/ — trust-gated by design."
  t355: "ICEBATH_DISABLE_FILE_STATE_GUARD=1 turns off the 'file changed since you read it' guard on patch and write_file."
  t356: "ICEBATH_ALLOW_PRIVATE_URLS=true lets web tools hit localhost and private networks — off by default in gateway mode."
  t357: "ICEBATH_OPTIONAL_SKILLS=name1,name2 auto-installs extra optional-catalog skills on first run per profile."
  t358: "ICEBATH_BUNDLED_SKILLS points at a custom bundled-skill tree — used by Homebrew and Nix packaging."
  t359: "ICEBATH_DUMP_REQUEST_STDOUT=1 dumps every API request payload to stdout instead of log files."
  t360: "icebath cron classify --criteria \"...\" scores a JSON list of items for urgency and prints only the urgent ones — nothing urgent, nothing delivered."
  t361: "ICEBATH_STREAM_RETRIES (default 3) controls mid-stream reconnect attempts on transient network errors."
  t362: "ICEBATH_GATEWAY_BUSY_ACK_ENABLED=false silences the ⚡/⏳/⏩ ack messages when a user messages a busy agent."
  t363: "ICEBATH_AGENT_NOTIFY_INTERVAL (default 180s) sets how often the gateway pings with progress on long turns."
  t364: "ICEBATH_RESTART_DRAIN_TIMEOUT (default 900s) caps how long /restart waits for in-flight runs before forcing."
  t365: "ICEBATH_CHECKPOINT_TIMEOUT (default 30s) caps filesystem checkpoint creation — raise it on huge monorepos."
  t366: "image_gen.model in config.yaml picks the FAL model: flux-2/klein, gpt-image-2, nano-banana-pro, and more."
  t367: "image_gen.provider routes image generation through a plugin (OpenAI Images, Codex, FAL) instead of the default."
  t368: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY point vision analysis at any OpenAI-compatible endpoint."
  t369: "API_SERVER_MODEL_NAME customizes the model name on /v1/models — essential for multi-profile Open WebUI setups."
  t370: "--source tool chats are excluded from icebath sessions list by default — set --source explicitly to see them."
  # Empty-composer example prompts (TUI). Generic on purpose: Icebath is not coding-only.
  placeholder:

    p01: "Ask anything, or type / for commands…"
    p02: "Summarize what's in this folder"
    p03: "Draft a reply to the last email in my inbox"
    p04: "Plan a feature, then build it step by step"
    p05: "Find and fix a failing test"
    p06: "Research this topic and write me a brief"
    p07: "What changed in this repo recently?"
    p08: "Turn these notes into a to-do list"
    p09: "Explain this error and how to fix it"
    p10: "Set a reminder or schedule a recurring task"
    p11: "Type / to browse commands, or Ctrl+P for the palette"
