    replaced: "工作階段資料庫檔案在 Icebath 執行期間被替換，因此這則訊息未儲存（副本保存在 {home}/sessions/）。請停止 Icebath（`icebath {profile_arg}gateway stop`），執行 `icebath {profile_arg}doctor` — 不要執行 `icebath {profile_arg}doctor --fix`，那會就地修復錯誤的檔案 — 然後重新啟動並再傳送一次訊息。進階復原步驟請見日誌。"
    deleted_wal: "另一個 Icebath 程序仍持有工作階段資料庫預寫日誌（WAL）的舊副本，因此 Icebath 為保護檔案已停止寫入，這則訊息未儲存（副本保存在 {home}/sessions/）。沒有任何資料遺失。請結束此設定檔下的所有 Icebath 程序（`icebath {profile_arg}gateway stop`、排程任務），執行 `icebath {profile_arg}doctor` — 它會列出仍持有該日誌的程序 — 然後重新啟動 Icebath 並再傳送一次訊息。在這些程序執行期間，不要執行 `doctor --fix` 或刪除任何 state.db 檔案。指南：{recovery_docs}"
