    redirect_restart_limit_exceeded: "la richiesta è stata annullata da una nuova correzione a ogni tentativo, quindi il turno si è fermato invece di riprovare all'infinito. La tua ultima correzione è in coda come prossimo messaggio."
    rebuilt_restart_limit_exceeded: "ogni provider della catena di fallback ha continuato a cedere il passo al successivo, quindi il turno si è fermato invece di riprovare all'infinito. Invia `continue` oppure cambia provider."
    budget_exhausted: "il budget di iterazioni/costo per turno si è esaurito prima di una risposta finale. Invia `continue` per proseguire."
    ollama_runtime_context_too_small: "la finestra di contesto del modello locale era troppo piccola per finire. Aumenta la dimensione del contesto o usa un modello più grande."
    pending_tool_result: "il turno si è fermato mentre il risultato di uno strumento era ancora in attesa e il modello non ha prodotto altro testo. Invia `continue` per farglielo riassumere."
    interrupted_during_api_call: "la richiesta è stata interrotta a metà chiamata prima di ricevere una risposta. Invia `continue` per riprovare."
    max_iterations_reached: "è stato raggiunto il limite massimo di iterazioni degli strumenti prima di una risposta finale. Invia `continue` per proseguire, oppure aumenta `max_iterations`."
    error_near_max_iterations: "si è verificato un errore vicino al limite di iterazioni prima di una risposta finale. Controlla l'output dello strumento qui sopra, poi invia `continue`."
    repeated_outer_errors: "il turno ha continuato a fallire con errori ripetuti ed è stato fermato in anticipo invece di riprovare all'infinito. Controlla gli errori qui sopra, poi invia `continue` per riprovare."
  persistence:

    compression: "il turno è stato fermato perché un altro processo stava comprimendo questa sessione. Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo al termine della compressione."
    compression_closed: "il turno è stato fermato perché questa sessione è stata ruotata dalla compressione del contesto e la sua continuazione attiva non ha potuto essere adottata. Lo storage è integro — aggiorna il client (o avvia un nuovo turno) così da usare il nuovo id di sessione, poi invia di nuovo il messaggio."
    turn_lease: "il turno è stato fermato perché un altro processo Icebath ha preso il controllo di questa sessione. La tua risposta non è stata salvata — attendi che l'altro processo finisca, poi invia di nuovo il messaggio."
    session_row_missing: "questa sessione è stata eliminata dallo storage mentre la chat era ancora aperta e Icebath non è riuscito a ricrearla, quindi questo messaggio non è stato salvato. Invia di nuovo il messaggio; se continua a fallire, esegui `icebath {profile_arg}doctor`."
    locked: "il turno è stato fermato perché lo storage della sessione era occupato (un altro processo Icebath stava scrivendo nel database di stato). Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo tra un momento."
    replaced: "il file del database delle sessioni è stato sostituito mentre Icebath era in esecuzione, quindi questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Ferma Icebath (`icebath {profile_arg}gateway stop`), esegui `icebath {profile_arg}doctor` — non `icebath {profile_arg}doctor --fix`, che riparerebbe il file sbagliato sul posto — poi riavvialo e invia di nuovo il messaggio. I passaggi di recupero avanzati sono nel log."
    deleted_wal: "un altro processo Icebath tiene ancora una vecchia copia del write-ahead log del database delle sessioni, quindi Icebath ha smesso di scrivere per proteggere il file e questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Non è andato perso nulla. Chiudi ogni processo Icebath su questo profilo (`icebath {profile_arg}gateway stop`, cron), esegui `icebath {profile_arg}doctor` — indica quale processo tiene ancora il log — poi riavvia Icebath e invia di nuovo il messaggio. Non eseguire `doctor --fix` né eliminare file state.db mentre sono in esecuzione. Guida: {recovery_docs}"
    corrupt: "il turno è stato fermato perché il database di stato ha segnalato una corruzione strutturale (la trascrizione sarebbe andata perduta al riavvio). Liberare spazio su disco non servirà. Opzioni di recupero:\n1. Esegui `icebath {profile_arg}doctor --fix`\n2. Ferma il gateway, poi recupera con:\n   icebath {profile_arg}sessions recover --source {db_path} --inspect-only\n   (se segnala che è recuperabile) icebath {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — il recupero crea prima uno snapshot del file danneggiato; NON eseguire `sqlite3 ... \".recover\"` sullo state.db attivo, una CLI sqlite3 vulnerabile può corromperlo ulteriormente\n3. Ripristina da un backup in {backups_dir}/\nPoi invia di nuovo il messaggio."
    fts_index: "il turno è stato fermato perché l'indice di ricerca delle sessioni (FTS5) è corrotto e non ha potuto essere scollegato, quindi questo messaggio non è stato salvato. L'archivio dei messaggi non è danneggiato: non eseguire strumenti di recupero né ripristinare un backup. Esegui `icebath {profile_arg}doctor --fix` (o riavvia Icebath, che ripara l'indice all'apertura), poi invia di nuovo il messaggio."
    disk: "Icebath non è riuscito a salvare questa conversazione su disco, quindi si è fermato piuttosto che perdere i tuoi messaggi. Il disco è probabilmente pieno: libera spazio (o correggi i permessi su {home}/state.db), poi invia di nuovo il messaggio."
    default: "Icebath non è riuscito a salvare questa conversazione, quindi si è fermato piuttosto che perdere i tuoi messaggi. Cause possibili: il disco è pieno, oppure un altro processo Icebath sta tenendo occupato il database. Chiudi le altre finestre di Icebath, esegui `icebath {profile_arg}doctor` per controllare lo storage, poi invia di nuovo il messaggio."
