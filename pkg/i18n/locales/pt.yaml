    locked: "o turno foi encerrado porque o armazenamento de sessões estava ocupado (outro processo do Icebath estava gravando no banco de dados de estado). Sua mensagem já deve estar salva — envie-a novamente em instantes."
    replaced: "o arquivo do banco de dados de sessões foi substituído enquanto o Icebath estava em execução, então esta mensagem não foi salva (uma cópia fica guardada em {home}/sessions/). Pare o Icebath (`icebath {profile_arg}gateway stop`), execute `icebath {profile_arg}doctor` — não `icebath {profile_arg}doctor --fix`, que repararia o arquivo errado no lugar — depois inicie-o de novo e envie sua mensagem mais uma vez. Os passos avançados de recuperação estão no log."
    deleted_wal: "outro processo do Icebath ainda mantém uma cópia antiga do write-ahead log do banco de dados de sessões, então o Icebath parou de gravar para manter o arquivo seguro e esta mensagem não foi salva (uma cópia fica guardada em {home}/sessions/). Nada foi perdido. Encerre todos os processos do Icebath neste perfil (`icebath {profile_arg}gateway stop`, cron), execute `icebath {profile_arg}doctor` — ele indica qualquer processo que ainda esteja segurando o log — depois inicie o Icebath de novo e envie sua mensagem mais uma vez. Não execute `doctor --fix` nem exclua arquivos state.db enquanto eles estiverem em execução. Guia: {recovery_docs}"
    corrupt: "o turno foi encerrado porque o banco de dados de estado relatou corrupção estrutural (a transcrição teria sido perdida na reinicialização). Liberar espaço em disco não vai ajudar. Opções de recuperação:\n1. Execute `icebath {profile_arg}doctor --fix`\n2. Pare o gateway e então recupere com:\n   icebath {profile_arg}sessions recover --source {db_path} --inspect-only\n   (se indicar que é recuperável) icebath {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — a recuperação cria um instantâneo do arquivo danificado antes; NÃO execute `sqlite3 ... \".recover\"` contra o state.db ativo, pois um CLI sqlite3 vulnerável pode corrompê-lo ainda mais\n3. Restaure a partir de um backup em {backups_dir}/\nDepois envie sua mensagem novamente."
    fts_index: "o turno foi encerrado porque o índice de busca de sessões (FTS5) está corrompido e não pôde ser desanexado, então esta mensagem não foi salva. O armazenamento de mensagens em si não está danificado: não execute ferramentas de recuperação nem restaure um backup. Execute `icebath {profile_arg}doctor --fix` (ou reinicie o Icebath, que repara o índice ao abrir) e então envie sua mensagem novamente."
    disk: "o Icebath não conseguiu salvar esta conversa em disco, então parou em vez de perder suas mensagens. O disco provavelmente está cheio: libere espaço (ou corrija as permissões de {home}/state.db) e então envie sua mensagem novamente."
    default: "o Icebath não conseguiu salvar esta conversa, então parou em vez de perder suas mensagens. Causas possíveis: o disco está sem espaço ou outro processo do Icebath está segurando o banco de dados. Feche outras janelas do Icebath, execute `icebath {profile_arg}doctor` para verificar o armazenamento e então envie sua mensagem novamente."
