tips:

  t001: "/bg <prompt> executa uma tarefa em uma sessão separada enquanto a atual fica livre; /btw <question> responde a uma pergunta paralela sobre esta conversa sem interrompê-la."
  t002: "/branch ramifica a sessão atual para que você explore outra direção sem perder o progresso."
  t003: "/compress comprime manualmente o contexto da conversa quando ela fica longa."
  t004: "/rollback lista os pontos de verificação do sistema de arquivos — restaure arquivos modificados pelo agente para qualquer estado anterior."
  t005: "/rollback diff 2 mostra o que mudou desde o ponto de verificação 2 sem restaurar nada."
  t006: "/rollback 2 src/file.py restaura um único arquivo a partir de um ponto de verificação específico."
  t007: "/title \"my project\" dá nome à sua sessão — retome-a depois com /resume ou icebath -c."
  t008: "/resume continua de onde você parou em uma sessão nomeada anteriormente."
  t009: "/queue <prompt> coloca uma mensagem na fila para o próximo turno sem interromper o atual."
  t010: "/undo remove a última troca usuário/assistente da conversa."
  t011: "/retry reenvia sua última mensagem — útil quando a resposta do agente não saiu como esperado."
  t012: "/verbose alterna a exibição do progresso das ferramentas: off → new → all → verbose."
  t013: "/reasoning high aumenta a profundidade de raciocínio do modelo. /reasoning show exibe o raciocínio."
  t014: "/fast alterna o processamento prioritário para respostas de API mais rápidas (depende do fornecedor)."
  t015: "/yolo pula todas as solicitações de aprovação de comandos perigosos pelo resto da sessão."
  t016: "/model permite trocar de modelo no meio da sessão — experimente /model sonnet ou /model gpt-5."
  t017: "/model --global altera seu modelo padrão permanentemente."
  t018: "/personality pirate define uma personalidade divertida — 14 opções integradas, de kawaii a shakespeare."
  t019: "/skin muda o tema da CLI — experimente taro, light, contrast, cyberpunk ou dracula."
  t020: "/statusbar alterna uma barra persistente que mostra modelo, tokens, % de preenchimento do contexto, custo e duração."
  t021: "/tools disable browser remove temporariamente as ferramentas de navegador na sessão atual."
  t022: "/browser connect conecta as ferramentas de navegador ao seu navegador da família Chromium em execução via CDP."
  t023: "/plugins lista os plugins instalados e seu status."
  t024: "/cron gerencia tarefas agendadas — configure prompts recorrentes com entrega em qualquer plataforma."
  t025: "/reload-mcp recarrega a configuração dos servidores MCP a quente, sem reiniciar."
  t026: "/usage mostra o uso de tokens, o detalhamento de custos e a duração da sessão."
  t027: "/insights mostra análises de uso dos últimos 30 dias."
  t028: "/paste verifica se há uma imagem na área de transferência e a anexa à sua próxima mensagem."
  t029: "/profile mostra qual perfil está ativo e seu diretório inicial."
  t030: "/config mostra sua configuração atual de forma resumida."
  t031: "/stop encerra todos os processos em segundo plano iniciados pelo agente."
  t032: "@file:path/to/file.py injeta o conteúdo do arquivo diretamente na sua mensagem."
  t033: "@file:main.py:10-50 injeta apenas as linhas 10-50 de um arquivo."
  t034: "@folder:src/ injeta a listagem da árvore de um diretório."
  t035: "@diff injeta suas alterações git não preparadas (unstaged) na mensagem."
  t036: "@staged injeta suas alterações git preparadas (git diff --staged)."
  t037: "@git:5 injeta os últimos 5 commits com os patches completos."
  t038: "@url:https://example.com busca e injeta o conteúdo de uma página web."
  t039: "Digitar @ aciona o preenchimento de caminhos do sistema de arquivos — navegue até qualquer arquivo interativamente."
  t040: "Combine várias referências: \"Revise @file:main.py e @file:test.py quanto à consistência.\""
  t041: "Alt+Enter insere uma quebra de linha para entrada em várias linhas. (O Windows Terminal intercepta Alt+Enter — use Ctrl+Enter no lugar.)"
  t042: "Ctrl+C interrompe o agente. Pressione duas vezes em 2 segundos para forçar a saída."
  t043: "Ctrl+Z suspende o Icebath para o segundo plano — execute fg no seu shell para retomar."
  t044: "Digite / para abrir a lista de comandos — Tab ou as setas percorrem as sugestões e Enter insere a selecionada."
  t045: "Digite uma nova mensagem enquanto o agente trabalha para interrompê-lo e redirecioná-lo."
  t046: "Alt+V cola uma imagem da área de transferência na conversa."
  t047: "Colar 5 ou mais linhas dobra o texto em um chip compacto no prompt — Ctrl+P sobre o chip o abre para ler ou editar."
  t048: "icebath -c retoma sua sessão de CLI mais recente. icebath -c \"project name\" retoma pelo título."
  t049: "icebath -w cria um worktree git isolado — perfeito para fluxos de trabalho com agentes em paralelo."
  t050: "icebath -w -q \"Fix issue #42\" combina o isolamento em worktree com uma consulta única."
  t051: "icebath chat -t web,terminal ativa apenas conjuntos de ferramentas específicos para uma sessão focada."
  t052: "icebath chat -s github-pr-workflow pré-carrega uma skill na inicialização."
  t053: "icebath chat -q \"query\" executa uma única consulta não interativa e sai."
  t054: "icebath chat --max-turns 1000 substitui o limite padrão de 500 iterações por turno."
  t055: "icebath chat --checkpoints ativa instantâneos do sistema de arquivos antes de cada alteração destrutiva de arquivo."
  t056: "icebath --yolo ignora todas as solicitações de aprovação de comandos perigosos durante toda a sessão."
  t057: "icebath chat --source telegram marca a sessão para filtragem em icebath sessions list."
  t058: "icebath -p work chat executa sob um perfil específico sem alterar seu padrão."
  t059: "icebath doctor --fix diagnostica e repara automaticamente problemas de configuração e dependências."
  t060: "icebath dump gera um resumo compacto da sua instalação — ótimo para relatórios de bugs."
  t061: "icebath config set KEY VALUE direciona segredos automaticamente para o .env e todo o resto para o config.yaml."
  t062: "icebath config edit abre o config.yaml no seu editor padrão."
  t063: "icebath config check procura opções de configuração ausentes ou obsoletas."
  t064: "icebath sessions browse abre um seletor interativo de sessões com busca."
  t065: "icebath sessions stats mostra a contagem de sessões por plataforma e o tamanho do banco de dados."
  t066: "icebath sessions prune --older-than 30 limpa sessões antigas."
  t067: "icebath skills search react --source skills-sh pesquisa no diretório público skills.sh."
  t068: "icebath skills check verifica se as skills instaladas do hub têm atualizações upstream."
  t069: "icebath skills tap add myorg/skills-repo adiciona uma fonte personalizada de skills no GitHub."
  t070: "icebath skills snapshot export setup.json exporta sua configuração de skills para backup ou compartilhamento."
  t071: "icebath mcp add github --command npx adiciona servidores MCP pela linha de comando."
  t072: "icebath mcp-serve executa o próprio Icebath como um servidor MCP para outros agentes."
  t073: "icebath auth add permite adicionar várias chaves de API para rotação do pool de credenciais."
  t074: "icebath completion bash >> ~/.bashrc ativa o preenchimento com Tab para todos os comandos e perfis."
  t075: "icebath logs -f acompanha o agent.log em tempo real. --level WARNING --since 1h filtra a saída."
  t076: "icebath backup cria um backup em zip de todo o seu diretório inicial do Icebath."
  t077: "icebath profile create coder cria um perfil isolado que se torna um comando próprio."
  t078: "icebath profile create work --clone copia sua configuração e chaves atuais para um novo perfil."
  t079: "icebath update sincroniza as novas skills incluídas com TODOS os perfis automaticamente."
  t080: "icebath gateway install configura o Icebath como um serviço do sistema (systemd/launchd)."
  t081: "icebath memory setup permite configurar um fornecedor de memória externo (RetainDB, ByteRover etc.)."
  t082: "icebath webhook subscribe cria rotas de webhook orientadas a eventos com validação HMAC."
  t083: "Economize: icebath tools desativa ferramentas não usadas, icebath skills config enxuga as skills."
  t084: "/reasoning low ou /reasoning minimal reduz a profundidade de raciocínio abaixo do padrão (medium) — respostas mais rápidas e baratas."
  t085: "icebath kanban reopen <task-id> devolve uma tarefa concluída ou arquivada para ready; as tarefas que dependiam dela voltam para todo."
  t086: "Defina display.bell_on_complete: true no config.yaml para ouvir um sinal sonoro quando tarefas longas terminarem."
  t087: "Defina display.streaming: true para ver os tokens aparecerem em tempo real enquanto o modelo gera."
  t088: "Defina display.show_reasoning: false para ocultar o raciocínio do modelo — ele é exibido por padrão."
  t089: "/language (alias /lang) escolhe o idioma da interface — /language de muda direto para o alemão."
  t090: "Defina display.busy_input_mode: queue para colocar mensagens na fila em vez de interromper o agente, ou steer para injetá-las durante a execução via /steer."
  t091: "/rewind volta a um prompt anterior para você editar e reenviar; /rewind fork N o abre em uma nova sessão."
  t092: "Defina compression.threshold: 0.50 para controlar quando a compressão automática é acionada (padrão: 50% do contexto)."
  t093: "Defina agent.max_turns: 1000 para permitir que o agente execute mais etapas de chamada de ferramenta por turno."
  t094: "Defina file_read_max_chars: 200000 para aumentar o conteúdo máximo por chamada de read_file."
  t095: "Defina approvals.mode: smart para que um LLM aprove automaticamente comandos seguros e negue automaticamente os perigosos."
  t096: "Defina fallback_model no config.yaml para alternar automaticamente para um fornecedor de reserva."
  t097: "Defina privacy.redact_pii: true para fazer hash de IDs de usuário e números de telefone antes de enviá-los ao LLM."
  t098: "Defina browser.headed: true para ver a janela local do Chromium enquanto o agente navega."
  t099: "Defina worktree: true no config.yaml para sempre criar um worktree git (o mesmo que icebath -w)."
  t100: "Defina security.website_blocklist.enabled: true para bloquear domínios específicos nas ferramentas web."
  t101: "Defina cron.wrap_response: false para entregar a saída bruta do agente sem o cabeçalho/rodapé do cron."
  t102: "ICEBATH_TIMEZONE substitui o fuso horário do servidor por qualquer string de fuso horário IANA."
  t103: "A substituição de variáveis de ambiente funciona no config.yaml: use a sintaxe ${VAR_NAME}."
  t104: "Comandos rápidos no config.yaml executam comandos de shell instantaneamente, sem gastar tokens."
  t105: "Personalidades personalizadas podem ser definidas no config.yaml em agent.personalities."
  t106: "provider_routing controla a ordenação, a lista de permissões e a lista de bloqueio de fornecedores do OpenRouter."
  t107: "execute_code executa scripts Python que chamam ferramentas do Icebath programaticamente — os resultados ficam fora do contexto."
  t108: "delegate_task inicia até 10 subagentes simultâneos por padrão (delegation.max_concurrent_children) com contextos isolados para trabalho em paralelo."
  t109: "web_extract funciona com URLs de PDF — passe qualquer link de PDF e ele converte para markdown."
  t110: "search_files usa ripgrep e é mais rápido que grep — use-o em vez do grep no terminal."
  t111: "patch usa 9 estratégias de correspondência aproximada, então pequenas diferenças de espaço em branco não quebram as edições."
  t112: "patch suporta o formato V4A para edições em massa de vários arquivos em uma única chamada."
  t113: "read_file sugere nomes de arquivo semelhantes quando um arquivo não é encontrado."
  t114: "read_file desduplica automaticamente — reler um arquivo inalterado retorna um stub leve."
  t115: "Defina browser.user_data_dir como uma pasta para manter um perfil persistente do Chromium, assim os logins em sites sobrevivem entre sessões."
  t116: "browser.chromium_args adiciona flags extras do Chromium às sessões locais do navegador, por exemplo --lang=de."
  t117: "image_generate cria imagens com o FLUX 2 Pro e ampliação automática de 2x."
  t118: "text_to_speech converte texto em áudio — é reproduzido como mensagens de voz no Telegram."
  t119: "send_message pode alcançar qualquer plataforma de mensagens conectada de dentro de uma sessão."
  t120: "A ferramenta todo ajuda o agente a acompanhar tarefas complexas de várias etapas durante uma sessão."
  t121: "session_search faz busca em texto completo em TODAS as conversas anteriores."
  t122: "O agente salva automaticamente preferências, correções e fatos do ambiente na memória."
  t123: "/moa encaminha um prompt difícil pelo seu conjunto de modelos Mixture of Agents configurado."
  t124: "Os comandos de terminal suportam o modo em segundo plano com notify_on_complete para tarefas de longa duração."
  t125: "Os processos de terminal em segundo plano suportam watch_patterns para alertar sobre linhas de saída específicas."
  t126: "A ferramenta terminal suporta 6 backends: local, Docker, SSH, Modal, Daytona e Singularity."
  t127: "Cada perfil tem sua própria configuração, chaves de API, memória, sessões, skills e tarefas cron."
  t128: "Nomes de perfil se tornam comandos de shell — 'icebath profile create coder' cria o comando 'coder'."
  t129: "icebath profile export coder -o backup.tar.gz cria um arquivo de perfil portátil."
  t130: "Se dois perfis compartilharem por acidente o mesmo token de bot, o segundo gateway é bloqueado com um erro claro."
  t131: "As sessões geram títulos descritivos automaticamente após a primeira troca — não é preciso nomear manualmente."
  t132: "Os títulos de sessão suportam linhagem: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "Ao sair, o Icebath imprime um comando de retomada com o ID da sessão e estatísticas."
  t134: "icebath sessions export backup.jsonl exporta todas as sessões para backup ou análise."
  t135: "icebath -r SESSION_ID retoma qualquer sessão anterior específica pelo seu ID."
  t136: "A memória é um instantâneo congelado — as alterações só aparecem no prompt do sistema no início da próxima sessão."
  t137: "As entradas de memória são verificadas automaticamente quanto a padrões de injeção de prompt e exfiltração."
  t138: "O agente tem dois repositórios de memória: notas pessoais (~2200 caracteres) e perfil do usuário (~1375 caracteres)."
  t139: "As correções que você dá ao agente (\"não, faça assim\") costumam ser salvas automaticamente na memória."
  t140: "Mais de 40 skills incluídas cobrindo desenvolvimento de software, devops, trabalho criativo, produtividade, pesquisa e muito mais."
  t141: "Toda skill instalada vira automaticamente um comando de barra — digite / para ver todas."
  t142: "icebath skills install official/security/1password instala skills opcionais do repositório."
  t143: "As skills podem se restringir a sistemas operacionais específicos — algumas só carregam no macOS ou no Linux."
  t144: "skills.external_dirs no config.yaml permite carregar skills de diretórios personalizados."
  t145: "O agente pode criar suas próprias skills como memória procedural usando skill_manage."
  t146: "/plan escreve um plano de implementação em markdown em .icebath/plans/ sem executar nada."
  t147: "Tarefas cron podem anexar skills: icebath cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Os destinos de entrega do cron incluem telegram, discord, slack, email, sms e mais de 12 outras plataformas."
  t149: "Se uma resposta de cron começar com [SILENT], a entrega é suprimida — útil para tarefas só de monitoramento."
  t150: "O cron suporta atrasos relativos (30m), intervalos (every 2h), expressões cron e timestamps ISO."
  t151: "Tarefas cron rodam em sessões de agente totalmente novas — os prompts precisam ser autossuficientes."
  t152: "O modo de voz funciona sem nenhuma chave de API se o faster-whisper estiver instalado (transcrição local gratuita)."
  t153: "Onze fornecedores de TTS: Edge TTS (gratuito), ElevenLabs, OpenAI, xAI, MiniMax, Mistral, Gemini, DeepInfra e os locais gratuitos NeuTTS, KittenTTS e Piper."
  t154: "/voice on ativa o modo de voz na CLI. Ctrl+B alterna a gravação push-to-talk."
  t155: "O TTS em streaming reproduz as frases conforme são geradas — sem esperar pela resposta completa."
  t156: "Mensagens de voz no Telegram, Discord, WhatsApp e Slack são transcritas automaticamente."
  t157: "O Icebath roda em 21 plataformas de mensagens: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail e mais."
  t158: "icebath gateway install o configura como serviço do sistema que inicia junto com a máquina."
  t159: "O DingTalk usa Stream Mode — sem webhooks nem URL pública."
  t160: "O BlueBubbles traz o iMessage ao Icebath por meio de um servidor macOS local."
  t161: "Rotas de webhook suportam validação HMAC, limitação de taxa e filtragem de eventos."
  t162: "O servidor de API expõe um endpoint compatível com OpenAI que funciona com Open WebUI e LibreChat."
  t163: "Modo de canal de voz do Discord: o bot entra no canal, transcreve a fala e responde falando."
  t164: "group_sessions_per_user: true dá a cada pessoa sua própria sessão em chats de grupo."
  t165: "/sethome marca um chat como canal principal para entregas de tarefas cron."
  t166: "O gateway suporta tempos limite baseados em inatividade — agentes ativos podem rodar indefinidamente."
  t167: "A aprovação de comandos perigosos tem 4 níveis: once, session, always (lista de permissões permanente), deny."
  t168: "O modo de aprovação inteligente usa um LLM para aprovar automaticamente comandos seguros e sinalizar os perigosos."
  t169: "A proteção contra SSRF bloqueia redes privadas, loopback, link-local e endereços de metadados de nuvem."
  t170: "Os IDs de sessão têm prefixo de data e hora (20250305_091523_abcd), então a ordenação funciona naturalmente em ls e jq."
  t171: "Subprocessos MCP recebem um ambiente filtrado — só variáveis seguras do sistema passam."
  t172: "Arquivos de contexto (.icebath.md, AGENTS.md) passam por varredura de segurança contra injeção de prompt antes de carregar."
  t173: "command_allowlist no config.yaml aprova permanentemente padrões específicos de comandos shell."
  t174: "O contexto é comprimido automaticamente ao atingir o limiar — memórias são gravadas e o histórico é resumido."
  t175: "A barra de status fica amarela, depois laranja e depois vermelha conforme o contexto se preenche."
  t176: "SOUL.md é o arquivo de identidade principal do agente — personalize-o para moldar o comportamento."
  t177: "O Icebath carrega o contexto do projeto de .icebath.md, AGENTS.md, CLAUDE.md ou .cursorrules (primeiro encontrado)."
  t178: "Arquivos AGENTS.md em subdiretórios são descobertos progressivamente conforme o agente navega pelas pastas."
  t179: "Arquivos de contexto são limitados a 20.000 caracteres com truncamento inteligente de início/fim."
  t180: "Backends de navegador: Chromium local, Lightpanda, Browserbase, Browser Use e Firecrawl — além do Camofox como plugin."
  t181: "O Camofox (Firefox antidetecção) é um plugin: instale-o com icebath plugins install camofox e depois execute icebath camofox setup."
  t182: "browser_exec executa várias etapas do navegador em uma única chamada Python — navegar, extrair e clicar juntos."
  t183: "browser.dialog_policy define como os diálogos nativos da página são tratados: must_respond (o agente responde com browser_dialog), auto_dismiss ou auto_accept."
  t184: "icebath mcp abre um seletor interativo dos MCPs do catálogo integrado do icebath que você instala com uma tecla."
  t185: "icebath mcp catalog lista os servidores MCP integrados ao icebath."
  t186: "icebath mcp install <name> instala uma entrada do catálogo, pede as credenciais e permite escolher quais ferramentas ativar."
  t187: "Servidores MCP são configurados no config.yaml — transportes stdio e HTTP suportados."
  t188: "Filtragem de ferramentas por servidor: tools.include permite e tools.exclude bloqueia ferramentas específicas."
  t189: "Servidores MCP geram conjuntos de ferramentas automaticamente em tempo de execução — icebath tools pode alterná-los por plataforma."
  t190: "Suporte a OAuth no MCP: auth: oauth ativa a autorização pelo navegador com PKCE."
  t191: "Checkpoints vêm desativados por padrão — ative-os com icebath chat --checkpoints ou checkpoints.enabled: true. Eles têm custo zero enquanto nenhum arquivo é modificado."
  t192: "Um instantâneo pré-reversão é salvo automaticamente para que você possa desfazer o desfazer."
  t193: "/rollback também desfaz o turno da conversa, para que o agente não se lembre das alterações revertidas."
  t194: "Checkpoints usam repositórios-sombra em ~/.icebath/checkpoints/ — o .git do seu projeto nunca é tocado."
  t195: "icebath batch processa centenas de prompts em paralelo para gerar dados de treinamento."
  t196: "icebath chat -Q ativa o modo silencioso para uso programático — oculta o banner e o spinner."
  t197: "O salvamento de trajetórias (--save-trajectories) captura rastros completos de uso de ferramentas para treinar modelos."
  t198: "Três tipos de plugin: geral (ferramentas/hooks), fornecedores de memória e motores de contexto."
  t199: "icebath plugins install owner/repo instala plugins diretamente do GitHub."
  t200: "Fornecedores de memória externos: RetainDB e ByteRover vêm integrados, outros via icebath plugins install <source>."
  t201: "Os hooks de plugin incluem pre/post_tool_call, pre/post_llm_call e transform_terminal_output para canonicalizar a saída."
  t202: "O cache de prompt (Anthropic) reduz custos ao reutilizar prefixos de prompt do sistema em cache."
  t203: "O agente gera títulos de sessão automaticamente em um tópico em segundo plano — sem impacto na latência."
  t204: "O roteamento inteligente de modelos pode enviar consultas simples automaticamente a um modelo mais barato."
  t205: "/terminal-setup configura os atalhos do terminal de uma IDE (VS Code, Cursor, Windsurf) para entrada com várias linhas, desfazer, refazer e copiar."
  t206: "Arrastar um caminho de arquivo para o terminal anexa imagens automaticamente ou o envia como contexto."
  t207: ".worktreeinclude na raiz do repositório lista arquivos ignorados pelo git a copiar para os worktrees."
  t208: "icebath acp executa o Icebath como servidor ACP para integração com VS Code, Zed e JetBrains."
  t209: "Fornecedores personalizados: salve endpoints nomeados no config.yaml em custom_providers."
  t210: "ICEBATH_EPHEMERAL_SYSTEM_PROMPT injeta um prompt do sistema que nunca é persistido no histórico."
  t211: "logins.<provider>.strategy suporta rotação fill_first, round_robin, least_used e random."
  t212: "icebath auth add xai-oauth ou icebath auth add openai-codex configura fornecedores baseados em OAuth."
  t213: "O servidor de API suporta tanto a Chat Completions quanto a Responses API com estado no servidor."
  t214: "tool_preview_length: 0 na configuração mostra caminhos de arquivo completos no feed de atividade do spinner."
  t215: "icebath status --deep executa verificações de diagnóstico mais profundas em todos os componentes."
  t216: "Tarefas cron podem anexar um script Python (--script) cujo stdout é injetado no prompt como contexto."
  t217: "Scripts cron ficam em ~/.icebath/scripts/ e rodam antes do agente — perfeitos para pipelines de coleta de dados."
  t218: "prefill_messages_file no config.yaml injeta exemplos few-shot em toda chamada de API, sem nunca salvá-los no histórico."
  t219: "SOUL.md substitui completamente a identidade padrão do agente — reescreva-o para tornar o Icebath seu."
  t220: "SOUL.md é preenchido automaticamente com uma personalidade padrão na primeira execução. Edite-o para personalizar."
  t221: "/compress <focus topic> dedica 60-70% do orçamento do resumo ao seu tema e corta o resto agressivamente."
  t222: "A partir da segunda compressão, o compressor atualiza o resumo anterior em vez de começar do zero."
  t223: "Antes de reiniciar uma sessão do gateway, o Icebath grava automaticamente fatos importantes na memória em segundo plano."
  t224: "network.force_ipv4: true no config.yaml corrige travamentos em servidores com IPv6 quebrado — aplica monkey-patch em socket."
  t225: "A ferramenta terminal anota códigos de saída comuns: grep retornando 1 = 'No matches found (not an error)'."
  t226: "Comandos de terminal em primeiro plano que falham são repetidos automaticamente até 3 vezes com espera exponencial (2s, 4s, 8s)."
  t227: "Comandos sudo simples são reescritos automaticamente para receber SUDO_PASSWORD do .env via pipe — sem prompt interativo."
  t228: "Os auxiliares de execute_code exigem importações explícitas: from icebath_tools import json_parse, shell_quote, retry."
  t229: "As 7 ferramentas de sandbox de execute_code (web_search, terminal, read/write/search/patch) usam RPC — nunca entram no contexto."
  t230: "Ler a mesma região de arquivo 3+ vezes dispara um aviso. Com 4+, é bloqueado de forma rígida para evitar loops."
  t231: "write_file e patch detectam se um arquivo foi modificado externamente desde a última leitura e avisam que está desatualizado."
  t232: "O formato de patch V4A suporta as diretivas Add File, Delete File e Move File — não apenas Update."
  t233: "Servidores MCP podem solicitar completions do LLM via sampling — o agente vira uma ferramenta para o servidor."
  t234: "Servidores MCP enviam notifications/tools/list_changed para acionar o novo registro automático de ferramentas sem reiniciar."
  t235: "delegate_task com acp_command: 'claude' cria o Claude Code como agente filho a partir de qualquer plataforma."
  t236: "A delegação tem um tópico de heartbeat — a atividade do filho é propagada ao pai, evitando tempos limite do gateway."
  t237: "Quando um fornecedor retorna HTTP 402 (pagamento necessário), o cliente auxiliar recorre automaticamente ao próximo."
  t238: "agent.tool_use_enforcement redireciona modelos que descrevem ações em vez de chamar ferramentas — automático para GPT/Codex."
  t239: "agent.restart_after_turn_timeout deixa os turnos em andamento terminarem antes de /restart entrar em stop(); restart_drain_timeout é apenas o orçamento de interrupção forçada depois que stop() começa."
  t240: "agent.api_max_retries (padrão 3) controla quantas vezes o agente tenta novamente uma chamada de API que falhou antes de exibir o erro — reduza para um fallback rápido."
  t241: "O gateway mantém instâncias de AIAgent em cache por sessão — destruir esse cache quebra o cache de prompt da Anthropic."
  t242: "Qualquer site pode expor skills via /.well-known/skills/index.json — o hub de skills as descobre automaticamente."
  t243: "O log de auditoria de skills em ~/.icebath/skills/.hub/audit.log registra toda operação de instalação e remoção."
  t244: "Worktrees git obsoletas são limpas automaticamente: árvores limpas e mescladas são removidas; árvores ociosas com alterações não commitadas ou não enviadas são arquivadas antes e podem ser restauradas com icebath worktree restore."
  t245: "Perfis delimitam o estado do Icebath via ICEBATH_HOME; subprocessos de ferramentas do host mantêm seu HOME real, a menos que terminal.home_mode seja profile."
  t246: "A variável de ambiente ICEBATH_HOME_MODE (octal, ex.: 0701) define permissões de diretório personalizadas para travessia pelo servidor web."
  t247: "Modo contêiner: coloque .container-mode em ICEBATH_HOME e a CLI do host executa automaticamente dentro do contêiner."
  t248: "Enquanto o agente trabalha, Esc duas vezes com o prompt vazio interrompe a execução — um único Esc apenas cancela a edição de uma entrada na fila."
  t249: "Toda interrupção durante a execução de um agente é registrada em ~/.icebath/interrupt_debug.log com carimbo de tempo."
  t250: "BROWSER_CDP_URL conecta as ferramentas de navegador a qualquer navegador da família Chromium em execução — aceita WebSocket, HTTP ou host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true ativa antidetecção avançada com Chromium personalizado (Scale Plan)."
  t252: "Shift+Tab liga ou desliga o modo YOLO sem gastar um turno."
  t253: "Comandos rápidos suportam dois tipos: exec (executa um comando shell diretamente) e alias (redireciona para outro comando)."
  t254: "Modelo de delegação por tarefa: delegation.model e delegation.provider na configuração roteiam subagentes para modelos mais baratos."
  t255: "delegation.reasoning_effort controla de forma independente a profundidade de raciocínio dos subagentes."
  t256: "display.platforms no config.yaml permite substituições de exibição por plataforma: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode na configuração simula a velocidade de digitação humana — intervalo min_ms/max_ms configurável."
  t258: "Migrações de versão da configuração rodam automaticamente ao carregar — novas chaves aparecem sem intervenção manual."
  t259: "Modelos GPT e Codex recebem orientação especial no prompt do sistema sobre disciplina e uso obrigatório de ferramentas."
  t260: "Modelos Gemini recebem diretrizes específicas para caminhos absolutos, chamadas de ferramenta paralelas e comandos não interativos."
  t261: "context.engine no config.yaml pode apontar para o nome de um plugin para estratégias alternativas de gestão de contexto."
  t262: "Com um navegador na nuvem, URLs de localhost e da rede local abrem num Chromium local (browser.auto_local_for_private_urls, ativado por padrão)."
  t263: "O compressor faz uma pré-passagem barata: saídas de ferramenta com mais de 200 caracteres são substituídas por placeholders antes de o LLM rodar."
  t264: "Quando a compressão falha, novas tentativas são pausadas por 10 minutos para não sobrecarregar a API."
  t265: "Comandos perigosos longos (>70 caracteres) ganham a opção 'view' no prompt de aprovação para ver o texto completo antes."
  t266: "A visualização do nível de áudio mostra barras ▁▂▃▄▅▆▇ durante a gravação de voz com base no RMS do microfone."
  t267: "Nomes de perfil não podem colidir com binários existentes no PATH — 'icebath profile create ls' seria rejeitado."
  t268: "icebath profile create backup --clone-all copia tudo (configuração, chaves, SOUL.md, memórias, skills, sessões)."
  t269: "A tecla de gravação de voz é configurável via voice.record_key no config.yaml — não apenas Ctrl+B."
  t270: "Arquivos .cursorrules e .cursor/rules/*.mdc são detectados e carregados automaticamente como contexto do projeto."
  t271: "Arquivos de contexto são checados contra 10+ padrões de injeção de prompt — Unicode invisível, 'ignore instructions', tentativas de exfiltração."
  t272: "GPT-5 e Codex usam o papel 'developer' em vez de 'system' no formato de mensagens."
  t273: "Substituições auxiliares por tarefa: auxiliary.vision.provider, auxiliary.compression.model etc. no config.yaml."
  t274: "O cliente auxiliar trata 'main' como alias de fornecedor — resolve para o seu fornecedor + modelo primário real."
  t275: "icebath import-agent openclaw --dry-run pré-visualiza a migração do OpenClaw sem gravar nada."
  t276: "Caminhos de arquivo colados com aspas ou espaços escapados são tratados automaticamente — sem limpeza manual."
  t277: "Comandos de barra nunca acionam o recolhimento de colagens grandes — /command com argumentos extensos funciona corretamente."
  t278: "No modo de interrupção, comandos de barra digitados durante a execução do agente ignoram a lógica de interrupção e rodam imediatamente."
  t279: "ICEBATH_DEV=1 ignora a detecção de modo contêiner para desenvolvimento local."
  t280: "Cada servidor MCP recebe seu próprio conjunto de ferramentas (mcp-servername), que pode ser alternado de forma independente via icebath tools."
  t281: "Placeholders ${ENV_VAR} de MCP na configuração são resolvidos ao iniciar o servidor — incluindo variáveis de ~/.icebath/.env."
  t282: "Skills de repositórios confiáveis (openai, anthropics, huggingface, NVIDIA, wandb, qdrant, pinecone-io) recebem o nível de segurança 'trusted'; skills da comunidade passam por varredura extra."
  t283: "A quarentena de skills em ~/.icebath/skills/.hub/quarantine/ guarda skills aguardando revisão de segurança."
  t284: "/steer <prompt> injeta uma nota após a próxima chamada de ferramenta — ajuste a direção no meio da tarefa sem interromper."
  t285: "/goal <text> define um objetivo permanente em loop Ralph — o Icebath continua turno após turno até um juiz declarar concluído."
  t286: "/snapshot create [label] salva um instantâneo completo da configuração do Icebath; /snapshot restore <id> reverte depois."
  t287: "/copy [N] copia a última resposta do assistente para a área de transferência, ou a N-ésima a partir do fim com um número."
  t288: "/redraw força um redesenho completo da interface, corrigindo desvios do terminal após redimensionar o tmux ou artefatos de seleção com o mouse."
  t289: "/agents (alias /tasks) mostra os agentes ativos e as tarefas em segundo plano em execução na sessão atual."
  t290: "/footer alterna o rodapé do gateway nas respostas finais, mostrando modelo, % de contexto e cwd."
  t291: "/busy queue|steer|interrupt controla o que Enter faz enquanto o Icebath está trabalhando."
  t292: "/topic em DMs do Telegram ativa o modo de tópicos multissessão gerenciado pelo usuário — /topic <id> restaura sessões passadas inline."
  t293: "/approve session|always executa um comando perigoso pendente com o escopo de confiança escolhido; /deny o rejeita."
  t294: "/restart reinicia o gateway de forma controlada após drenar as execuções ativas e depois avisa quem solicitou quando voltar."
  t295: "/kanban boards switch <slug> troca o quadro Kanban multiprojeto ativo de dentro do chat."
  t296: "/reload recarrega ~/.icebath/.env na sessão em execução — aplique novas chaves de API sem reiniciar."
  t297: "cronjob com no_agent=True executa um script no horário agendado e envia seu stdout diretamente — zero tokens, zero LLM."
  t298: "Um stdout vazio no script cron significa tique silencioso — nada é entregue, perfeito para watchdogs de limiar."
  t299: "ICEBATH_CRON_MAX_PARALLEL (ou cron.max_parallel_jobs) limita quantos jobs do cron rodam ao mesmo tempo para que picos não saturem suas chaves — sem valor, não há limite."
  t300: "Hooks do gateway ficam em ~/.icebath/hooks/<name>/ com um HOOK.yaml que nomeia os eventos e um `command:` — o comando recebe cada evento como JSON na entrada padrão."
  t301: "Os eventos de hook incluem gateway:startup, session:start, agent:step e assinaturas com curinga command:*."
  t302: "Coloque uma lista de verificação em ~/.icebath/BOOT.md e um hook gateway:startup a executa como agente de uma única vez a cada inicialização."
  t303: "icebath curator run --dry-run mostra o que o curador arquivaria ou consolidaria sem alterar nada."
  t304: "icebath curator pin <skill> protege uma skill tanto do arquivamento automático quanto da ferramenta skill_manage do agente."
  t305: "icebath curator rollback restaura skills a partir de um instantâneo anterior à execução — os backups ficam em skills/.curator_backups/."
  t306: "icebath auth reset <provider> [target] limpa os tempos de espera e as marcações de esgotamento de um pool inteiro de credenciais, ou de uma única credencial por índice, id ou rótulo."
  t307: "logins.<provider>.strategy: round_robin alterna as chaves de forma uniforme em vez do padrão fill_first."
  t308: "provider_routing.data_collection: deny exclui fornecedores que armazenam dados no OpenRouter."
  t309: "provider_routing.require_parameters: true roteia apenas para fornecedores que suportam todos os parâmetros da sua solicitação."
  t310: "ICEBATH_TUI_RESUME=1 reanexa automaticamente à sessão mais recente da TUI ao iniciar — útil depois de quedas de SSH."
  t311: "ICEBATH_TUI_THEME=light|dark|<hex> força o tema da TUI em terminais que não definem COLORFGBG."
  t312: "Ctrl+G abre o prompt no $EDITOR para entradas longas com várias linhas."
  t313: "icebath profile create work --isolated-auth copia os logins para o novo perfil uma única vez em vez de compartilhar os do perfil padrão."
  t314: "display.tool_progress_command: true expõe /verbose nas plataformas de mensagens; por padrão, ele é exclusivo da CLI."
  t315: "ICEBATH_BACKGROUND_NOTIFICATIONS=result só avisa quando tarefas em segundo plano terminam (em vez de concise/all/error/off)."
  t316: "ICEBATH_WRITE_SAFE_ROOT restringe write_file/patch a prefixos de diretório; vários caminhos via os.pathsep (: ou ;)."
  t317: "ICEBATH_IGNORE_RULES pula a injeção automática de AGENTS.md, SOUL.md, .cursorrules, memória e skills pré-carregadas."
  t318: "ICEBATH_ACCEPT_HOOKS aprova automaticamente hooks de shell inéditos declarados em config.yaml sem pedir confirmação no TTY."
  t319: "auxiliary.goal_judge.model roteia o juiz do /goal para um modelo barato e rápido, mantendo o custo do loop perto de zero."
  t320: "Os checkpoints ignoram diretórios com mais de 50.000 arquivos para evitar operações git lentas em monorepos enormes."
  t321: "tts.provider: piper executa TTS local em 44 idiomas na CPU — as vozes são baixadas automaticamente para ~/.icebath/cache/fetch/."
  t322: "tts.providers.<name>.type: command conecta qualquer motor de TTS de linha de comando usando os placeholders {input_path} e {output_path}."
  t323: "API_SERVER_ENABLED=true executa um endpoint compatível com OpenAI junto ao gateway, para Open WebUI e LibreChat."
  t324: "GATEWAY_PROXY_URL cria uma configuração dividida: E/S das plataformas localmente, trabalho do agente delegado a um servidor de API remoto."
  t325: "MATRIX_DEVICE_ID fixa um ID de dispositivo estável para E2EE — sem ele, as chaves rotacionam a cada início e a descriptografia do histórico quebra."
  t326: "TELEGRAM_WEBHOOK_SECRET é obrigatório sempre que TELEGRAM_WEBHOOK_URL estiver definido — gere com openssl rand -hex 32."
  t327: "icebath batch --resume identifica prompts concluídos pelo conteúdo do texto, para que reordenações do dataset não refaçam trabalho já terminado."
  t328: "/new inicia uma sessão nova no lugar (alias /reset) — novo ID de sessão, histórico limpo, e a CLI continua aberta."
  t329: "/clear limpa a tela do terminal E inicia uma nova sessão — um único atalho para um reset visual."
  t330: "/history imprime a conversa atual em linha sem sair da CLI — útil para uma releitura rápida."
  t331: "/save grava a conversa atual em disco sem encerrar a sessão."
  t332: "/status mostra as informações da sessão de uma olhada: ID, título, modelo, uso de tokens e tempo decorrido."
  t333: "/image <path> anexa um arquivo de imagem local ao seu próximo prompt sem colar nem arrastar e soltar."
  t334: "/platforms mostra o status de conexão do gateway e das plataformas de mensagens direto de dentro do chat."
  t335: "/commands pagina a lista completa de comandos slash + skills instaladas — útil em plataformas sem autocompletar por Tab."
  t336: "/toolsets lista todos os conjuntos de ferramentas disponíveis para você saber o que -t/--toolsets aceita."
  t337: "/voice tts alterna o modo somente TTS — o agente responde em voz alta, mas você continua digitando seus prompts."
  t338: "/reload-skills verifica novamente ~/.icebath/skills/ para que skills adicionadas apareçam sem reiniciar a sessão."
  t339: "/indicator unicode|emoji|ascii escolhe o estilo do indicador de ocupado da TUI mostrado durante as execuções do agente."
  t340: "/debug envia um pacote de suporte (informações do sistema + logs) e retorna links compartilháveis — funciona no chat também."
  t341: "icebath -z \"<prompt>\" é o modo one-shot mais puro: só a resposta final no stdout, nada mais — ideal para pipes em scripts."
  t342: "icebath chat --pass-session-id injeta o ID da sessão no prompt do sistema para que o agente possa referenciá-lo."
  t343: "icebath chat --image path/to/pic.png anexa uma imagem local a uma única consulta -q sem uma etapa separada de envio."
  t344: "icebath chat --ignore-user-config ignora a configuração ativa do usuário — relatórios de bug reproduzíveis e execuções em CI."
  t345: "icebath chat --source tool marca chats programáticos para que eles não poluam icebath sessions list."
  t346: "icebath dump --show-keys inclui impressões digitais ocultadas das chaves de API para uma depuração de suporte mais profunda."
  t347: "icebath sessions rename <ID> \"new title\" renomeia qualquer sessão passada; icebath sessions delete <ID> remove uma."
  t348: "icebath import restaura um zip de backup completo do Icebath."
  t349: "icebath fallback gerencia a cadeia fallback_model de forma interativa — sem editar config.yaml à mão."
  t350: "icebath pairing approve <platform> <code> dá acesso a um usuário com o código que o bot enviou a ele; icebath pairing revoke <platform> <user-id> retira o acesso."
  t351: "/setup configura uma seção por vez — model, aux, agent, tts, terminal, tools ou gateway — e /setup quick recomeça do início."
  t352: "icebath status --deep executa a verificação completa de saúde em todos os componentes; icebath status simples é a visão rápida."
  t353: "ICEBATH_AGENT_TIMEOUT=0 desativa o encerramento por inatividade do gateway para um agente em execução — use em pesquisas longas."
  t354: "ICEBATH_ENABLE_PROJECT_PLUGINS=1 carrega automaticamente plugins locais do repositório em ./.icebath/plugins/ — protegido por confiança por design."
  t355: "ICEBATH_DISABLE_FILE_STATE_GUARD=1 desliga a proteção 'arquivo alterado desde a leitura' em patch e write_file."
  t356: "ICEBATH_ALLOW_PRIVATE_URLS=true permite que as ferramentas web acessem localhost e redes privadas — desativado por padrão no modo gateway."
  t357: "ICEBATH_OPTIONAL_SKILLS=name1,name2 instala automaticamente skills extras do catálogo opcional na primeira execução de cada perfil."
  t358: "ICEBATH_BUNDLED_SKILLS aponta para uma árvore personalizada de skills embutidas — usado pelos pacotes do Homebrew e do Nix."
  t359: "ICEBATH_DUMP_REQUEST_STDOUT=1 despeja o payload de cada solicitação à API no stdout em vez de em arquivos de log."
  t360: "icebath cron classify --criteria \"...\" pontua a urgência de uma lista JSON de itens e imprime só os urgentes — nada urgente, nada entregue."
  t361: "ICEBATH_STREAM_RETRIES (padrão 3) controla as tentativas de reconexão no meio do stream em erros de rede transitórios."
  t362: "ICEBATH_GATEWAY_BUSY_ACK_ENABLED=false silencia as mensagens de confirmação ⚡/⏳/⏩ quando um usuário escreve para um agente ocupado."
  t363: "ICEBATH_AGENT_NOTIFY_INTERVAL (padrão 180s) define com que frequência o gateway envia atualizações de progresso em turnos longos."
  t364: "ICEBATH_RESTART_DRAIN_TIMEOUT (padrão 900s) limita quanto tempo /restart espera pelas execuções em andamento antes de forçar."
  t365: "ICEBATH_CHECKPOINT_TIMEOUT (padrão 30s) limita a criação de checkpoints do sistema de arquivos — aumente em monorepos enormes."
  t366: "image_gen.model em config.yaml escolhe o modelo FAL: flux-2/klein, gpt-image-2, nano-banana-pro e outros."
  t367: "image_gen.provider roteia a geração de imagens por um plugin (OpenAI Images, Codex, FAL) em vez do padrão."
  t368: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY apontam a análise de visão para qualquer endpoint compatível com OpenAI."
  t369: "API_SERVER_MODEL_NAME personaliza o nome do modelo em /v1/models — essencial para configurações do Open WebUI com vários perfis."
  t370: "Chats com --source tool ficam fora de icebath sessions list por padrão — defina --source explicitamente para vê-los."
  placeholder:

    p01: "Pergunte qualquer coisa ou digite / para ver comandos…"
    p02: "Resuma o que há nesta pasta"
    p03: "Redija uma resposta ao último e-mail da minha caixa de entrada"
    p04: "Planeje uma funcionalidade e depois construa passo a passo"
    p05: "Encontre e corrija um teste que está falhando"
    p06: "Pesquise este tema e escreva um resumo para mim"
    p07: "O que mudou neste repositório recentemente?"
    p08: "Transforme estas anotações em uma lista de tarefas"
    p09: "Explique este erro e como corrigi-lo"
    p10: "Defina um lembrete ou agende uma tarefa recorrente"
    p11: "Digite / para navegar pelos comandos ou Ctrl+P para a paleta"
