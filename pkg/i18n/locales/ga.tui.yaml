userMessages.rpc.fastUnavailable: "Ní thairgeann soláthraí na samhla reatha sraith thapa di, mar sin fanann an luas gnáth. Athraigh le /model chuig samhail a bhfuil sraith thapa aici chun /fast a úsáid."
userMessages.rpc.invalidParams: "Níorbh fhéidir leis an tseirbhís chúlra an t-iarratas seo a ghlacadh: {1} {2} ({0})."
userMessages.rpc.launchCredentialsChanged: "Ní féidir leis an gcomhrá seo an eochair API ar tosaíodh leis a úsáid a thuilleadh (athraíodh nó baineadh í), mar sin ní dhearnadh é sin. Ní athraíonn comhrá go heochair eile as a stuaim féin. Clóscríobh /new chun comhrá nua a thosú le d'eochair reatha."
userMessages.rpc.methodUnavailable: "Ní sholáthraíonn an cúlchóras Icebath seo {0}, mar sin ní dhearnadh é sin."
userMessages.rpc.notConnected: "Níl Icebath ceangailte faoi láthair, mar sin níor seoladh é sin. Athcheanglaíonn sé go huathoibríoch; fan nóiméad agus bain triail eile as, nó clóscríobh /logs má leanann sé seo ar aghaidh."
userMessages.rpc.sessionHasChildren: "Tá seisiúin linbh (mar ritheanna fo-ghníomhairí) ag an gcomhrá seo a bhainfí freisin dá scriosfaí é, mar sin níor scriosadh é."
userMessages.rpc.sessionNotFound: "Níl an comhrá seo ceangailte leis an gcúlchóras a thuilleadh (bhí sé díomhaoin nó atosaíodh an cúlchóras). Tá do stair sábháilte: clóscríobh /resume chun é a athoscailt."
userMessages.rpc.sessionReadOnly: "Is stair stóráilte é an comhrá seo is féidir le Icebath a thaispeáint ach nach féidir leis leanúint air, mar sin níor ritheadh do theachtaireacht. Clóscríobh /new chun comhrá nua a thosú."
userMessages.rpc.shellBackendRefused: "Ritheann orduithe ! ar an ríomhaire seo, ach ritheann an seisiún seo a chuid orduithe sa timpeallacht {0}, mar sin níor ritheadh an t-ordú. Iarr ar an ngníomhaire é a rith ina ionad."
userMessages.rpc.shellBackendRefusedUnnamed: "Ritheann orduithe ! ar an ríomhaire seo, ach ritheann an seisiún seo a chuid orduithe in áit eile, mar sin níor ritheadh an t-ordú. Iarr ar an ngníomhaire é a rith ina ionad."
userMessages.rpc.timedOut: "Níor fhreagair Icebath laistigh de {0}s. Bain triail eile as; má leanann sé ag tarlú, clóscríobh /logs agus tuairiscigh na línte deiridh."
