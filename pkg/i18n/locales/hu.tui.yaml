userMessages.promptTimeout.secret: "A titok bekérése bezárult: nem érkezett válasz időben, így az ezt igénylő lépés kimaradt. Küldd el újra a kérésedet, amikor készen állsz a megadására."
userMessages.promptTimeout.sudo: "A jelszó bekérése bezárult: nem érkezett válasz időben, így a parancs kimaradt. Küldd el újra a kérésedet, amikor készen állsz a megadására."
userMessages.promptTimeout.vaultCode: "Az ellenőrző kód bekérése bezárult: nem érkezett válasz időben, így a bejelentkezés kimaradt. Küldd el újra a kérésedet, amikor megvan a kód."
userMessages.promptTimeout.vaultSaveLogin: "A bejelentkezés mentésének bekérése bezárult: nem érkezett válasz időben, így semmi nem lett mentve. Küldd el újra a kérésedet, amikor készen állsz."
userMessages.promptTimeout.vaultUnlockPrompt: "A feloldás bekérése bezárult: nem érkezett válasz időben, így a jelszókezelő zárolva maradt. Küldd el újra a kérésedet, amikor készen állsz a feloldására."
userMessages.rpc.launchCredentialsChanged: "Ez a csevegés már nem tudja használni azt az API-kulcsot, amellyel elindult (megváltozott vagy törölték), ezért ez nem történt meg. Egy csevegés soha nem vált magától másik kulcsra. Írd be a /new parancsot, hogy új csevegést indíts a jelenlegi kulcsoddal."
userMessages.rpc.methodUnavailable: "Ez a Icebath-háttérrendszer nem biztosítja ezt: {0}, ezért nem történt meg."
userMessages.rpc.notConnected: "A Icebath most nincs csatlakozva, így ez nem lett elküldve. Automatikusan újracsatlakozik; várj egy kicsit, és próbáld újra, vagy ha a hiba nem múlik, írd be: /logs."
userMessages.rpc.sessionHasChildren: "Ennek a csevegésnek gyermekmunkamenetei vannak (például alügynök-futtatások), amelyeket a törlése szintén eltávolítana, ezért nem lett törölve."
userMessages.rpc.sessionNotFound: "Ez a beszélgetés már nem kapcsolódik a backendhez (tétlen volt, vagy a backend újraindult). Az előzményeid mentve vannak: a /resume paranccsal nyithatod újra."
userMessages.rpc.sessionReadOnly: "Ez a csevegés mentett előzmény, amelyet a Icebath meg tud jeleníteni, de nem tud folytatni, ezért az üzeneted nem futott le. Írd be a /new parancsot, hogy új csevegést indíts."
userMessages.rpc.shellBackendRefused: "A !-parancsok a gateway gépén futnak, de ennek a munkamenetnek a terminál-backendje {0}, ezért a parancs nem futott le. Kérd meg inkább az ügynököt, hogy futtassa; az ügynök terminálja a(z) {0} belsejében fut."
userMessages.rpc.shellBackendRefusedUnnamed: "A !-parancsok a gateway gépén futnak, de ennek a munkamenetnek a terminál-backendje nem helyi, ezért a parancs nem futott le. Kérd meg inkább az ügynököt, hogy futtassa."
userMessages.rpc.slashCrashed: "A /{0} nem fejeződött be: a parancssegítő összeomlott. Próbáld újra; a nyomkövetéshez írd be: /logs."
userMessages.rpc.slashTimedOut: "A /{0} nem fejeződött be: a parancssegítő túllépte az időkeretet. Próbáld újra; ha ismétlődik, írd be a /logs parancsot, és jelentsd az utolsó sorokat."
userMessages.rpc.timedOut: "A Icebath nem válaszolt {0} mp-en belül. Próbáld újra; ha ismétlődik, írd be a /logs parancsot, és jelentsd az utolsó sorokat."
userMessages.rpc.versionSkew: "A terminálos felület és a Icebath backend nincs szinkronban (eltérő verziók). Futtasd az /update parancsot, vagy lépj ki, futtasd a `icebath update` parancsot, majd indítsd újra a TUI-t."
