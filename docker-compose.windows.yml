# Background service on Docker Desktop for Windows, sharing %USERPROFILE%\.icebath as the data volume.
#   docker compose -f docker-compose.windows.yml up -d
services:
  icebath:
    image: ghcr.io/nickheyer/icebath:latest
    container_name: icebath
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.icebath:/opt/data
    environment:
      - ICEBATH_UID=10000
      - ICEBATH_GID=10000
    command: ["gateway", "run"]
