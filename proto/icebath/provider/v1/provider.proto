syntax = "proto3";

package icebath.provider.v1;

import "google/protobuf/timestamp.proto";

// Providers of the profile in use, each a kind of provider with settings, models and accounts of its own
service ProviderService {
  // Providers the profile has
  rpc List(ListRequest) returns (ListResponse);
  // Kinds of provider a profile can add
  rpc Specs(SpecsRequest) returns (SpecsResponse);
  rpc Models(ModelsRequest) returns (ModelsResponse);
  rpc Add(AddRequest) returns (AddResponse);
  // Removes a provider with its accounts, then clears every setting and session that named it
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // Gives a provider the name a person typed: the name shown changes and the key it is kept under follows it
  rpc Rename(RenameRequest) returns (RenameResponse);
  // Keeps a credential in an account, which is made with it when the provider has none of the name: written whole at once, so that no
  // account stands without the credential that makes it one
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // Removes an account, then clears every setting and session that named it
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);
  rpc UseAccount(UseAccountRequest) returns (UseAccountResponse);
  // Turns an account's taking turns on or off, the provider taking turns while one does
  rpc SetTurns(SetTurnsRequest) returns (SetTurnsResponse);
  // Turns the use of a credential found outside the accounts off or on: the one control of that choice
  rpc SetOutside(SetOutsideRequest) returns (SetOutsideResponse);
  // Offers a provider's models in the model list, or leaves them out
  rpc SetOffered(SetOfferedRequest) returns (SetOfferedResponse);
  // Limits and abilities set for models, by provider and model
  rpc Limits(LimitsRequest) returns (LimitsResponse);
  rpc SetLimit(SetLimitRequest) returns (SetLimitResponse);
  rpc RemoveLimit(RemoveLimitRequest) returns (RemoveLimitResponse);
  // Lists of models of single kinds of provider, read over the online list
  rpc Catalogs(CatalogsRequest) returns (CatalogsResponse);
  rpc SetCatalog(SetCatalogRequest) returns (SetCatalogResponse);
  rpc RemoveCatalog(RemoveCatalogRequest) returns (RemoveCatalogResponse);
  // What the provider says the account in use may still spend
  rpc Usage(UsageRequest) returns (UsageResponse);
  // Renews the sign-in of an account now, clearing a limit its old token ran into
  rpc Renew(RenewRequest) returns (RenewResponse);
  // Forgets the limits accounts of a provider ran into, of one account or of all of them
  rpc Reset(ResetRequest) returns (ResetResponse);
  // Moves an account to a place in the order the provider's accounts are tried
  rpc MoveAccount(MoveAccountRequest) returns (MoveAccountResponse);
  rpc RenameAccount(RenameAccountRequest) returns (RenameAccountResponse);
  // Whether a provider is signed in, with what and as whom
  rpc Status(StatusRequest) returns (StatusResponse);
  // Moves the key an account reads from an environment variable into the account itself
  rpc KeepKey(KeepKeyRequest) returns (KeepKeyResponse);
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_SAVED = 1;
  ORIGIN_ENVIRONMENT = 2;
  ORIGIN_EXTERNAL = 3;
  ORIGIN_UNNEEDED = 4;
}

message Account {
  string name = 1;
  string title = 2;
  // Settings section of the account, its fields keyed below it
  string section = 3;
  // The account that requests go out with now
  bool active = 4;
  Origin credential_origin = 5;
  string credential_source = 6;
  // How it signs in: api_key, oauth, aws_sigv4 or gcp_oauth; empty while it has no credential to use
  string auth = 7;
  // ready, limited, needs_sign_in, dead, or unavailable while it has no credential
  string status = 8;
  // When a limit it ran into lifts
  google.protobuf.Timestamp resets = 9;
  // What the provider said when it last refused the account
  string reason = 10;
  // Who it signs in as, such as an email
  string identity = 11;
  // Last characters of a hash of its secret, telling two apart without showing either
  string fingerprint = 12;
  // Takes part in the provider's rotation
  bool rotate = 13;
  // Place in the order the provider's accounts are tried
  int32 priority = 14;
  // Environment variable it reads its key from, for a key kept outside icebath
  string key_env = 15;
  // When its sign-in expires, unset when it doesn't or that isn't known
  google.protobuf.Timestamp expires = 16;
  // Requests made with it, counted for the least used rotation
  int64 requests = 17;
  // Whether its sign-in can be renewed
  bool renewable = 18;
  // Why it has no credential to use, in sentences a person reads: nothing kept at all, the variable it reads unset, the sign-in of the
  // program it uses not found; empty while it has one
  string missing = 19;
  // State in one to three words, by the one function every page and command uses: Signed in, Connected, Not signed in, Not connected,
  // then when it applies in use and limit reached until a time
  string state = 20;
  // State as a sentence, the first line of its page: Signed in as someone, Uses the API key in a variable, Not signed in
  string standing = 21;
  // Program whose sign-in on this computer it uses, empty for none
  string program = 22;
}

message Provider {
  // Name in the profile
  string name = 1;
  // Kind, by the name of its spec
  string spec = 2;
  string display_name = 3;
  string description = 4;
  string signup_url = 5;
  string base_url = 6;
  string api_mode = 7;
  string default_model = 8;
  // Models picked for it, every one it lists when empty
  repeated string models = 9;
  repeated string aliases = 10;
  bool local = 11;
  bool aggregator = 12;
  // Where the credential that requests go out with now comes from: unneeded for a provider ready without one, unspecified while it is
  // not ready
  Origin credential_origin = 13;
  string credential_source = 14;
  repeated string key_env = 15;
  // Whether its accounts keep an API key
  bool keyed = 16;
  // Settings section of the provider
  string section = 17;
  // Whether icebath can send it requests
  bool usable = 18;
  // Account its choice names: the one it always uses, else the first it tries; empty while it has none
  string account = 19;
  repeated Account accounts = 20;
  // Whether a plugin registers its kind
  bool known = 21;
  // Left out of the model list: its place in models.catalog.excluded_providers
  bool hidden = 22;
  // Whether its kind can say what its accounts may still spend
  bool usage = 23;
  // What it last said the account in use may still spend, while that is fresh; unset until it has been asked, which a listing does in the
  // background
  AccountUsage account_usage = 24;
  // Order the accounts of its rotation are used in: fill_first, round_robin, least_used or random
  string strategy = 25;
  // What it does held to one account that reached its limit: fail or rotate
  string on_exhausted = 26;
  // Held to the account named in account
  bool pinned = 27;
  // Takes turns between its accounts marked for rotation; neither this nor pinned takes every account in order
  bool rotate = 28;
  // Variables and programs its credential is not taken from
  repeated string ignored = 29;
  // Whether a request can go to it now, by the one test that the providers screen, the model picker and the agent use
  bool ready = 30;
  // Why it is not ready and what to do, in sentences a person reads; empty while it is ready
  string why = 31;
  // Credential found outside its accounts: an API key in a variable or the sign-in of another program on this computer, which it takes
  // when it has no account, and after its accounts while it tries every account in order; unspecified when none is found
  Origin outside_origin = 32;
  string outside_source = 33;
  // Account that requests go out with now, empty for the credential outside its accounts and while it is not ready
  string using = 34;
  // Requests go out with the credential found outside its accounts now
  bool outside_used = 35;
  // State in one to three words, by the one function every page and command uses: Connected, Signed in, Not connected, Not signed in,
  // Ready, or Needs … with what it needs
  string state = 36;
  // State as a sentence, the first line of its page: who it is connected as, or the one thing wrong and the one thing to do
  string standing = 37;
  // The address of its server is the person's to give, as a server of their own's is
  bool own = 38;
  // Its accounts sign in, rather than keep an API key, unless the person gives one
  bool signs_in = 39;
  // While it is not ready, the other way out than the one its first line names, as a sentence the pane of one option says, and that
  // option's setting by its name below the provider; empty for none
  string instead = 40;
  string instead_of = 41;
}

message Spec {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string signup_url = 4;
  string api_mode = 5;
  bool local = 6;
  bool aggregator = 7;
  bool usable = 8;
  // Credential found for the kind in the environment or another program, before any account
  Origin detected_origin = 9;
  string detected_source = 10;
  repeated string key_env = 11;
  // Providers of the profile of this kind
  repeated string providers = 12;
  repeated string aliases = 13;
  // Whether its accounts keep an API key
  bool keyed = 14;
  // Place among the well-known kinds offered first, 1 at the top; 0 for a kind listed by name with the rest
  uint32 rank = 15;
  // Its accounts sign in, rather than keep an API key, unless the person gives one
  bool signs_in = 16;
  // The address of a provider of it is the person's to give, as a server of their own's is
  bool own = 17;
  // A provider of it has no address until the person gives one
  bool needs_address = 18;
}

message ListRequest {
  // Profile to act on, the one in use when empty
  string profile = 1;
}

message ListResponse {
  repeated Provider providers = 1;
}

message SpecsRequest {
  // Profile to act on, the one in use when empty
  string profile = 1;
}

message SpecsResponse {
  repeated Spec specs = 1;
}

message ModelsRequest {
  string provider = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
  // Read the catalogs again rather than what is kept
  bool refresh = 3;
}

message ModelsResponse {
  repeated string models = 1;
  // What is known of each model, in the order of models
  repeated Model details = 2;
  // The models stand in for a list the provider could not give
  bool fallback = 3;
  // Why the provider gave no list of models of its own and what to do, in sentences a person reads: the address it could not reach, the
  // error it answered with, or a list with nothing in it; empty when it gave one
  string unlisted = 4;
}

// What is known of one model a provider offers
message Model {
  string id = 1;
  // Such as recommended, free or default
  string note = 2;
  // Tokens it takes in at once and gives out at most, 0 when not known
  int64 context = 3;
  int64 max_output = 4;
  // USD for a million tokens, as decimal text; empty when not known
  string input_price = 5;
  string output_price = 6;
  string cache_read_price = 7;
  // What it can do, such as reasoning, tools, vision
  string abilities = 8;
  // Whether it takes a reasoning effort, when that is known
  optional bool reasoning = 9;
  // Efforts it takes, least first, as its kind or the provider's listing names them; empty when neither does
  repeated string efforts = 10;
  // Its reasoning can't be turned off
  bool mandatory_reasoning = 11;
}

message UsageRequest {
  // Provider of the profile; when empty, the first connected one whose kind can say
  string provider = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message UsageResponse {
  // Nothing when the kind can't say, no account is connected, or the provider couldn't be asked
  AccountUsage usage = 1;
}

message AccountUsage {
  // Provider asked, by its name in the profile
  string provider = 1;
  // Where the reading came from
  string source = 2;
  string title = 3;
  string plan = 4;
  google.protobuf.Timestamp fetched = 5;
  repeated UsageWindow windows = 6;
  repeated string details = 7;
  // Why the account's limits can't be read
  string unavailable = 8;
  // Windows shown as bars under the plan's name
  bool bars = 9;
}

message UsageWindow {
  string label = 1;
  // Share used in percent, unset when the provider didn't say
  optional double used = 2;
  // When the window starts over, unset when not known
  google.protobuf.Timestamp resets = 3;
  string detail = 4;
  // Whether it caps one family of models rather than the whole account
  bool model = 5;
}

message AddRequest {
  string spec = 1;
  // Name in the profile, made from the title or the kind's name, numbered when taken, when empty
  string name = 2;
  string title = 3;
  // Profile to act on, the one in use when empty
  string profile = 4;
  // Address of its server, for a kind whose address is the person's to give; the kind's own when empty
  string base_url = 5;
}

message AddResponse {
  Provider provider = 1;
}

message RemoveRequest {
  string provider = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message RemoveResponse {
  // Variables cleared from the profile's .env, those its accounts read their keys from that no other account reads
  repeated string cleared = 1;
  // What named the provider and was cleared, a phrase each, such as Model of Agent or 2 sessions
  repeated string named = 2;
  // What the removal did, one or two sentences a person reads
  string said = 3;
}

message RenameRequest {
  string provider = 1;
  // Name shown; the kind's name for none
  string title = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message RenameResponse {
  Provider provider = 1;
}

message ConnectRequest {
  string provider = 1;
  // Account already there to keep the credential in; a new account when empty, unless one signs in as the same identity
  string account = 2;
  // Name the account is shown by, as the person gave it: a new account is named after the identity, else the way it signs in, when empty;
  // one already there keeps its own
  string title = 3;
  // Fields of the credential by their names below the account, each as YAML, null for none
  map<string, string> fields = 4;
  // Profile to act on, the one in use when empty
  string profile = 5;
  // Who the sign-in signed in as, such as an email; empty when not known
  string identity = 6;
}

message ConnectResponse {
  Account account = 1;
}

message RemoveAccountRequest {
  string provider = 1;
  string account = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message RemoveAccountResponse {
  // Variables cleared from the profile's .env: the one the account read its key from, unless another account reads it
  repeated string cleared = 1;
  // What named the account and was cleared, a phrase each
  repeated string named = 2;
  // What the removal did, one or two sentences a person reads
  string said = 3;
}

message SetTurnsRequest {
  string provider = 1;
  string account = 2;
  bool on = 3;
  // Profile to act on, the one in use when empty
  string profile = 4;
}

message SetTurnsResponse {
  // What changed, one sentence a person reads
  string said = 1;
}

message SetOutsideRequest {
  string provider = 1;
  // Variable or program the credential comes from, as the provider names it
  string source = 2;
  bool on = 3;
  // Profile to act on, the one in use when empty
  string profile = 4;
}

message SetOutsideResponse {
  // What changed, one sentence a person reads
  string said = 1;
}

message SetOfferedRequest {
  string provider = 1;
  bool on = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message SetOfferedResponse {
  // What changed, one sentence a person reads
  string said = 1;
}

// Limits and abilities set for one model of a provider, or for every model of it
message Limit {
  string provider = 1;
  // Model, empty for every model of the provider
  string model = 2;
  // Tokens it reads at once, 0 for what icebath finds
  int64 context_window = 3;
  // Whether it uses tools, sees images and reasons; unset for what icebath finds
  optional bool tools = 4;
  optional bool vision = 5;
  optional bool reasoning = 6;
  // Family its requests are shaped for, empty for what icebath finds
  string family = 7;
  // Name the provider is shown by
  string provider_title = 8;
}

message LimitsRequest {
  // Profile to act on, the one in use when empty
  string profile = 1;
}

message LimitsResponse {
  repeated Limit limits = 1;
  // Model families a limit may name, in the order offered
  repeated string families = 2;
}

message SetLimitRequest {
  Limit limit = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message SetLimitResponse {
  Limit limit = 1;
}

message RemoveLimitRequest {
  string provider = 1;
  string model = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message RemoveLimitResponse {}

// List of models of one kind of provider, read over the online list
message Catalog {
  // Kind, by the name of its spec
  string kind = 1;
  string address = 2;
  // Name the kind is shown by
  string title = 3;
}

message CatalogsRequest {
  // Profile to act on, the one in use when empty
  string profile = 1;
}

message CatalogsResponse {
  repeated Catalog catalogs = 1;
}

message SetCatalogRequest {
  Catalog catalog = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message SetCatalogResponse {}

message RemoveCatalogRequest {
  string kind = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message RemoveCatalogResponse {}

message UseAccountRequest {
  string provider = 1;
  string account = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message UseAccountResponse {}

message RenewRequest {
  string provider = 1;
  // Account to renew, the one in use when empty
  string account = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message RenewResponse {
  Account account = 1;
}

message ResetRequest {
  string provider = 1;
  // Account whose limits to forget, every account of the provider when empty
  string account = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message ResetResponse {
  // Accounts that had limits to forget
  int32 cleared = 1;
}

message MoveAccountRequest {
  string provider = 1;
  string account = 2;
  // Place from 0, the first tried; clamped to the places there are
  int32 priority = 3;
  // Profile to act on, the one in use when empty
  string profile = 4;
}

message MoveAccountResponse {
  // Place it took
  int32 priority = 1;
}

message RenameAccountRequest {
  string provider = 1;
  string account = 2;
  // Name shown, as the person typed it: the key the account is kept under follows it
  string name = 3;
  // Profile to act on, the one in use when empty
  string profile = 4;
}

message RenameAccountResponse {
  Account account = 1;
}

message StatusRequest {
  string provider = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message StatusResponse {
  bool logged_in = 1;
  // Why it isn't, when it isn't
  string error = 2;
  // What it signs in with, as name and value pairs in the order shown
  repeated Detail details = 3;
}

message Detail {
  string name = 1;
  string value = 2;
}

message KeepKeyRequest {
  string provider = 1;
  string account = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message KeepKeyResponse {
  Account account = 1;
}
