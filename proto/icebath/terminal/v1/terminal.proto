syntax = "proto3";

package icebath.terminal.v1;

// Background processes the agent's commands left running, of every session
service ProcessService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc Stop(StopRequest) returns (StopResponse);
}

message Process {
  string id = 1;
  string command = 2;
  // Session that started it, and the profile it runs for
  string session_id = 3;
  string profile = 4;
  // running or exited
  string status = 5;
  // How it ended: exited, killed, lost or failed_start
  string completion_reason = 6;
  bool has_exit_code = 7;
  int32 exit_code = 8;
  int64 uptime_seconds = 9;
  // Seconds since it ended
  int64 since_exit_seconds = 10;
  // Newest part of its output
  string output_tail = 11;
  string cwd = 12;
  int32 pid = 13;
}

message ListRequest {
  // Session whose processes to list, every session's when empty
  string session_id = 1;
  // One process alone, in whichever session it runs: the one of this id, or the one whose id starts with it; none when no process or
  // several match
  string id = 2;
}

message ListResponse {
  repeated Process processes = 1;
}

message KillRequest {
  // Id of the process, or the start of one, in whichever session it runs
  string id = 1;
  reserved 2;
}

message KillResponse {
  // killed, already_exited, not_found or error
  string status = 1;
  string error = 2;
}

message StopRequest {
  // Session whose running processes stop, those started outside a session when empty
  string session_id = 1;
}

message StopResponse {
  int32 killed = 1;
}

// Places the agent's commands can run: how each stands on this machine, readying one and choosing the one in use
service BackendService {
  rpc Backends(BackendsRequest) returns (BackendsResponse);
  // Readies a backend ahead of its first command, such as building its image, a line at a time as it goes
  rpc Prepare(PrepareRequest) returns (stream PrepareResponse);
  // Runs the profile's commands on the backend from the next one on, saying so, and that a variable of the environment wins when one
  // names another backend
  rpc Use(UseRequest) returns (UseResponse);
}

message Check {
  bool ok = 1;
  // What was checked, in a few words, such as Docker daemon
  string label = 2;
  // What was found, a sentence; empty when the state says it all
  string detail = 3;
  // How it stands in a word or two, such as Running or Not set
  string state = 4;
  // What to do about it when it failed, in a person's words
  string fix = 5;
  // Key of the setting that fixes it, empty when the fix is outside icebath
  string setting = 6;
}

message Backend {
  // Value of terminal.backend that picks it
  string name = 1;
  string title = 2;
  string about = 3;
  // The profile's commands run on it
  bool selected = 4;
  reserved 5, 7;
  repeated Check checks = 6;
  // Key of the section of its own settings, empty when it has none
  string section = 8;
  // Has something to get ready before commands run there, such as an image to build
  bool prepares = 9;
  // How it stands in the state words: Ready, Needs setup or Can't run
  string state = 10;
  // Commands can run there now
  bool ready = 11;
  // This computer lacks what it needs, such as its program, so nothing on its page makes it run
  bool missing = 12;
  // What keeps it from running, a sentence; empty while it is ready
  string why = 13;
  // What getting it ready does, a sentence; empty when it needs nothing readied
  string readies = 14;
}

message BackendsRequest {
  // Profile to look at, the one in use when empty
  string profile = 1;
}

message BackendsResponse {
  string profile = 1;
  repeated Backend backends = 2;
  // Environment variable that names the backend in use over the settings, empty when none does
  string variable = 3;
}

message UseRequest {
  string backend = 1;
  // Profile whose commands run there, the one in use when empty
  string profile = 2;
}

message UseResponse {
  // What changed, in one or two sentences
  string note = 1;
  // A variable of the environment names another backend, which the profile's commands still run on
  bool held = 2;
}

message PrepareRequest {
  string backend = 1;
  // Profile whose settings the backend is readied for, the one in use when empty
  string profile = 2;
}

message PrepareResponse {
  // A line of how it goes
  string line = 1;
  // Set on the last message: how it ended, an error when it failed
  bool done = 2;
  string error = 3;
}
