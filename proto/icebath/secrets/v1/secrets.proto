syntax = "proto3";

package icebath.secrets.v1;

// The secret stores the variables of a profile come from
service SecretService {
  // Every store, whether the profile turned it on and what its last fetch did
  rpc Sources(SourcesRequest) returns (SourcesResponse);
  // Fetches every store of the profile again, the profile in use carrying what they supply from then on
  rpc Reload(ReloadRequest) returns (SourcesResponse);
  // Turns a store on or off for the profile
  rpc Enable(EnableRequest) returns (SourcesResponse);
}

message SourcesRequest {
  // Profile whose stores are read, the one in use when empty
  string profile = 1;
}

message ReloadRequest {
  string profile = 1;
}

message EnableRequest {
  string profile = 1;
  string name = 2;
  bool on = 3;
}

// One store and what its last fetch did
message Source {
  string name = 1;
  string label = 2;
  // mapped or bulk
  string shape = 3;
  bool enabled = 4;
  // Variables it set
  repeated string applied = 5;
  // Variables it supplied that were kept: set already and not replaced, taken by an earlier store, a store's own credential, not names
  repeated string existing = 6;
  repeated string claimed = 7;
  repeated string protected = 8;
  repeated string invalid = 9;
  // Why the fetch failed, its kind and how to fix it, empty when it did not
  string error = 10;
  string kind = 11;
  string remedy = 12;
  repeated string warnings = 13;
}

message SourcesResponse {
  repeated Source sources = 1;
  // Variables two stores supplied, the first keeping it
  repeated string conflicts = 2;
}
