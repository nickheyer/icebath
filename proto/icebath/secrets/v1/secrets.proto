syntax = "proto3";

package icebath.secrets.v1;

// The secret stores the variables of a profile come from, how each stands, and every change of them
service SecretService {
  // Every store in the order they are asked, how each stands for the profile and what its last fetch did
  rpc Sources(SourcesRequest) returns (SourcesResponse);
  // Fetches every store of the profile again, the profile in use carrying what they supply from then on
  rpc Reload(ReloadRequest) returns (SourcesResponse);
  // Turns a store on or off for the profile, the stores fetched again
  rpc Switch(SwitchRequest) returns (ChangeResponse);
  // Fills a variable from a reference in a store that fills named variables, the reference checked before it is kept
  rpc Bind(BindRequest) returns (ChangeResponse);
  // Stops filling a variable from a store that fills named variables
  rpc Unbind(UnbindRequest) returns (ChangeResponse);
  // Asks the stores in the order given, those not named after them
  rpc Reorder(ReorderRequest) returns (ChangeResponse);
  // Removes the token a store signs in with from the keys file, the stores fetched again
  rpc Forget(ForgetRequest) returns (ChangeResponse);
  // Fetches one store now and says what the next start does with each variable it holds, setting them for the profile when asked
  rpc Preview(PreviewRequest) returns (PreviewResponse);
}

message SourcesRequest {
  // Profile whose stores are read, the one in use when empty
  string profile = 1;
  // Only what each store is, its name, label, shape and section, with nothing that asks a store or a program
  bool bare = 2;
}

message ReloadRequest {
  string profile = 1;
}

message SwitchRequest {
  string profile = 1;
  string name = 2;
  bool on = 3;
}

message BindRequest {
  string profile = 1;
  string name = 2;
  string variable = 3;
  string reference = 4;
}

message UnbindRequest {
  string profile = 1;
  string name = 2;
  string variable = 3;
}

message ReorderRequest {
  string profile = 1;
  // Names of the stores in the order they are asked
  repeated string names = 2;
}

message ForgetRequest {
  string profile = 1;
  string name = 2;
}

// What a change says once it is kept
message ChangeResponse {
  string note = 1;
}

message PreviewRequest {
  string profile = 1;
  string name = 2;
  bool apply = 3;
}

// What a fetch does with one variable: export, override, skip_set, skip_token or unresolved; exported or overrode once set
message Outcome {
  string name = 1;
  string action = 2;
}

message PreviewResponse {
  repeated Outcome outcomes = 1;
  repeated string warnings = 2;
}

// A variable a store fills from one of its references
message Binding {
  string variable = 1;
  string reference = 2;
}

// One store, how it stands and what its last fetch did
message Source {
  string name = 1;
  string label = 2;
  // mapped or bulk
  string shape = 3;
  bool enabled = 4;
  // Variables it set
  repeated string applied = 5;
  // Variables it supplied that were kept: set already and not replaced, taken by an earlier store, a store's own credential, not names
  repeated string existing = 6;
  repeated string claimed = 7;
  repeated string protected = 8;
  repeated string invalid = 9;
  // Why the fetch failed, its kind and how to fix it from the command line, empty when it did not
  string error = 10;
  string kind = 11;
  string remedy = 12;
  repeated string warnings = 13;
  // What keeps it from filling anything, in a few words and as a sentence, empty when nothing does
  string needs = 14;
  string lacks = 15;
  // Variables it fills
  int32 fills = 16;
  // Section of its settings, whose page is its page
  string section = 17;
  // For a store that fills named variables: those it fills, the scheme of its references, one of them as an example and where one is found
  repeated Binding bindings = 18;
  string scheme = 19;
  string example = 20;
  string find = 23;
  // Variable of the credential it signs in with and whether one is kept, for a store that has one
  string token_env = 21;
  bool token_set = 22;
}

message SourcesResponse {
  repeated Source sources = 1;
  // Variables two stores supplied, the first keeping it
  repeated string conflicts = 2;
}
