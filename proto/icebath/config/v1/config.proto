syntax = "proto3";

package icebath.config.v1;

service ConfigService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  // Value of any key as it is resolved: a setting, a key no setting names, or a variable of the profile's environment
  rpc Value(ValueRequest) returns (ValueResponse);
  // Saves a value typed on the command line: a setting, or a variable of the profile's .env for a key shaped like one
  rpc Put(PutRequest) returns (PutResponse);
  // Removes the value a key holds, or a variable from the profile's .env
  rpc Unset(UnsetRequest) returns (UnsetResponse);
  // Where the settings are kept, what the administrator manages and who else decides them
  rpc Files(FilesRequest) returns (FilesResponse);
  // Which variables are set and what the saved settings leave inactive
  rpc Check(CheckRequest) returns (CheckResponse);
  // What config show prints beside the settings: the API keys, masked, the messaging platforms, the values skills declare
  rpc Show(ShowRequest) returns (ShowResponse);
  // Text of a config file, and that text saved back after an edit
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  // Makes a config file of the profile that is not there yet: every setting of its scope commented out at its default, with what it does
  rpc Seed(SeedRequest) returns (SeedResponse);
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_TEXT = 1;
  KIND_NUMBER = 2;
  KIND_TOGGLE = 3;
  KIND_CHOICE = 4;
  KIND_LIST = 5;
  KIND_TABLE = 6;
  // Length of time, its value the number of its unit
  KIND_DURATION = 7;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_DEFAULT = 1;
  SOURCE_FILE = 2;
  SOURCE_ENVIRONMENT = 3;
  // The administrator pins it
  SOURCE_MANAGED = 4;
}

message Option {
  string value = 1;
  string title = 2;
  string description = 3;
}

message Setting {
  string key = 1;
  string section = 2;
  string title = 3;
  string description = 4;
  Kind kind = 5;
  bool secret = 6;
  bool internal = 7;
  string value = 8;
  string default_value = 9;
  Source source = 10;
  string variable = 11;
  repeated string env = 12;
  repeated Option options = 13;
  // Why it can't be changed here, empty when it can
  string locked = 14;
  // Unit the number of a length of time counts, such as s or min
  string unit = 15;
  // What the setting left unset means, such as no limit, when it has no default
  string unset = 16;
  // Up to two sentences more than the description
  string help = 17;
  // Changed by few people, and listed behind Advanced
  bool advanced = 18;
  // When a change takes hold
  Apply apply = 19;
  // Command that changes it as well, without its slash
  string slash = 20;
  // What is in effect while it holds zero_value, such as No limit, empty when that value means nothing of its own
  string zero = 21;
  // Value zero speaks of, as YAML
  string zero_value = 22;
  // What a number counts, in the plural
  string counts = 23;
  // Least and most a number or a length of time may be, as YAML numbers, a length of time counting its unit; empty for no bound
  string least = 24;
  string most = 25;
  // Bounds in words, such as From 1 to 8, empty for none
  string bounds = 26;
  // Value and default in words, as a row shows them: what is in effect rather than the value that stands for it
  string shown = 27;
  string default_shown = 28;
  // What one entry of a table holds, unset for a table whose entries are free
  Entry entry = 29;
  // Skill that asks for the value, for a setting a skill declares
  string skill = 30;
  // A field of an entry that the entry is nothing without
  bool need = 31;
  // What text must start with, one of them; any text when empty
  repeated string starts = 32;
}

// When a change of a setting takes hold
enum Apply {
  // Nothing is said of it
  APPLY_UNSPECIFIED = 0;
  APPLY_NEXT_MESSAGE = 1;
  APPLY_NEW_SESSIONS = 2;
  APPLY_RESTART = 3;
}

// What one entry of a table setting holds
message Entry {
  // What one entry is, singular and lower case
  string noun = 1;
  // What the name of an entry is called where one is asked for
  string name = 2;
  // Fields of an entry, each keyed by its name inside the entry; a single field with an empty key for an entry that is one value
  repeated Setting fields = 3;
  // The names of the entries are names of variables, shown in capitals whatever case they are kept in
  bool capitals = 4;
  // The names an entry may have, each with what a person calls it; any name when empty
  repeated Option names = 5;
}

message Section {
  string key = 1;
  string parent = 2;
  string title = 3;
  string description = 4;
  // Kept once for every profile rather than in the profile in use
  bool global = 5;
  // Group of the first settings screen a section at the top is listed under
  string group = 6;
}

// Heading the first settings screen lists sections under
message Group {
  string id = 1;
  string title = 2;
}

message ListRequest {
  // Profile to act on, the one in use when empty
  string profile = 1;
  // Leaves out the values each setting may take, which can cost a check each, such as every terminal backend's
  bool bare = 2;
}

message ListResponse {
  repeated Section sections = 1;
  repeated Setting settings = 2;
  // Profile whose settings are listed, those every profile shares aside
  string profile = 3;
  // Groups of the sections at the top, in the order they are listed
  repeated Group groups = 4;
}

message GetRequest {
  string key = 1;
  // Profile to act on, the one in use when empty
  string profile = 2;
}

message GetResponse {
  Setting setting = 1;
}

message SetRequest {
  string key = 1;
  string value = 2;
  // Profile to act on, the one in use when empty
  string profile = 3;
}

message SetResponse {}

message ValueRequest {
  string key = 1;
  string profile = 2;
  // Credentials shown as they are rather than masked
  bool raw = 3;
}

message ValueResponse {
  // Whether the key holds a value
  bool found = 1;
  // Value as JSON
  string json = 2;
  // Value as YAML, lists and tables in block style
  string yaml = 3;
  // What to know about where the value came from, such as a stale copy of a variable in config.yaml
  string note = 4;
}

message PutRequest {
  string key = 1;
  // Text typed for the value
  string value = 2;
  string profile = 3;
}

message PutResponse {
  // What was saved, as the command says it
  string shown = 1;
  // Where it went: a config.yaml, Remote Config, or the profile's .env
  string destination = 2;
  // Key as saved, a variable in upper case
  string key = 3;
  // Saved as a variable of the profile's .env rather than a setting
  bool env = 4;
  // What was taken out of the value before it was saved, such as characters outside ASCII, empty when nothing was
  string warning = 5;
}

message UnsetRequest {
  string key = 1;
  string profile = 2;
}

message UnsetResponse {
  // Whether the key held a value
  bool found = 1;
  string destination = 2;
}

message FilesRequest {
  string profile = 1;
}

message FilesResponse {
  // config.yaml every profile shares
  string shared = 1;
  // config.yaml of the profile, empty when Remote Config holds its settings
  string own = 2;
  // .env of the profile
  string env = 3;
  string profile = 4;
  // Folder of the administrator's settings, empty when there is none
  string managed_dir = 5;
  repeated string managed_keys = 6;
  repeated string managed_env = 7;
  // Package manager that keeps the settings of this install, empty when none does
  string managed_system = 8;
  // How the profile stands with Remote Config, empty when its settings come from its config.yaml
  string remote = 9;
  // Machine the files are on, so a command elsewhere knows it can't open them
  string host = 10;
  // Folder of the copies of the profile's config.yaml
  string backups = 11;
  // Whether the profile's config.yaml and its .env are there yet
  bool own_exists = 12;
  bool env_exists = 13;
}

message CheckRequest {
  string profile = 1;
}

message Variable {
  string name = 1;
  bool set = 2;
  // Settings that read it
  repeated string settings = 3;
  bool secret = 4;
  // What it is, such as the API key of a provider
  string about = 5;
}

message ShowRequest {
  string profile = 1;
}

// One line of config show beside the settings
message Shown {
  string label = 1;
  // Value as shown, a credential masked; empty when it has none
  string value = 2;
  bool set = 3;
  // Who it belongs to, such as the skill that declares a value
  string owner = 4;
}

message ShowResponse {
  // Credentials of the services icebath reaches, masked
  repeated Shown keys = 1;
  // Messaging platforms, set when their bot token is
  repeated Shown platforms = 2;
  // Values the profile's skills declare
  repeated Shown skills = 3;
  // Folder of the icebath program
  string install = 4;
}

message CheckResponse {
  repeated Variable required = 1;
  repeated Variable optional = 2;
  // What the saved settings leave inactive, one line each
  repeated string diagnostics = 3;
}

message ReadRequest {
  // Path of the file, one Files names
  string path = 1;
  string profile = 2;
}

message ReadResponse {
  string text = 1;
  // Whether the file is there
  bool exists = 2;
}

message WriteRequest {
  string path = 1;
  string text = 2;
  string profile = 3;
}

message WriteResponse {
  // What reading the saved file found wrong, empty when it parses
  string problem = 1;
}

message SeedRequest {
  // Path of the file, one Files names
  string path = 1;
  string profile = 2;
}

message SeedResponse {
  // Whether the file was made, false when it was there already
  bool seeded = 1;
}
