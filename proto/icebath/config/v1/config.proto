syntax = "proto3";

package icebath.config.v1;

service ConfigService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
}

message Setting {
  string key = 1;
  string value = 2;
}

message ListRequest {}

message ListResponse {
  repeated Setting settings = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  Setting setting = 1;
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {}
