syntax = "proto3";

package icebath.plugins.onepassword.v1;

// 1Password as a store of a profile's secrets: variables bound to op:// references, read through the op program. Turning it on or off, its
// variables and a fetch of it now are those of every store, in the secret service
service OnePasswordService {
  // How the store is set up, with the op program, its version and every reference
  rpc State(StateRequest) returns (StateResponse);
  // The 1Password accounts op knows on this computer
  rpc Accounts(AccountsRequest) returns (AccountsResponse);
  // Finds the op program and checks who it signs in as, with the token given or kept, else the account given; only once it is signed in
  // keeps the program, the account, the token variable and a new token, and turns the store on
  rpc Setup(SetupRequest) returns (SetupResponse);
  // Keeps a new service account token once op accepts it, or without asking when told not to verify
  rpc Token(TokenRequest) returns (TokenResponse);
}

message AccountsRequest {
  string profile = 1;
}

// One account op knows: its sign-in address, which op --account takes, and the email it signs in with
message Account {
  string address = 1;
  string email = 2;
}

message AccountsResponse {
  repeated Account accounts = 1;
  // The op program was not found, or could not list the accounts and said why
  bool binary_missing = 2;
  string error = 3;
}

message StateRequest {
  // Profile whose store is read, the one in use when empty
  string profile = 1;
}

message Reference {
  string env = 1;
  string reference = 2;
}

message StateResponse {
  bool enabled = 1;
  string account = 2;
  // Variable holding a service account token, and whether it holds one
  string token_env = 3;
  bool token_set = 4;
  bool override = 5;
  // Seconds resolved values are reused for
  int64 cache_ttl = 6;
  // op program found and its version, empty when there is none
  string binary = 7;
  string version = 8;
  // Path of the program the settings pin, empty for one found on the search path
  string binary_path = 9;
  repeated Reference references = 10;
  // Who op is signed in as with no token, empty when it is not or a token is set
  string session = 11;
  string env_path = 12;
}

message SetupRequest {
  string profile = 1;
  // Account op signs in to without a token, empty for the one it uses by default
  string account = 2;
  string token_env = 3;
  // Service account token to keep in the keys file, empty to use the one kept or the sign-in of op
  string token = 4;
  string binary_path = 5;
}

message SetupResponse {
  string binary = 1;
  string version = 2;
  string account = 3;
  string token_env = 4;
  // A new token was kept in the .env, one already in the environment is used, or neither
  bool saved_token = 5;
  bool env_token = 6;
  // Who op is signed in as, empty when it is not
  string identity = 7;
  string env_path = 8;
  // The op program was not found, at the path given when there is one, and nothing was changed
  bool binary_missing = 9;
  string binary_path = 10;
  // op is not signed in with the token or the account, and nothing was changed
  bool not_signed_in = 11;
}

message TokenRequest {
  string profile = 1;
  string token = 2;
  bool verify = 3;
}

message TokenResponse {
  // Who op signs in as with the token, when it was checked
  string identity = 1;
  // op refused the token, or could not be found to check it, and nothing was kept
  bool rejected = 2;
  bool binary_missing = 3;
  string env_path = 4;
  string token_env = 5;
  bool disabled = 6;
}

