syntax = "proto3";

package icebath.plugins.onepassword.v1;

// 1Password as a store of a profile's secrets: variables bound to op:// references, read through the op program
service OnePasswordService {
  // How the store is set up, with the op program, its version and every reference
  rpc State(StateRequest) returns (StateResponse);
  // Finds the op program and keeps its path, the account, the token variable and a new token when given, then turns the store on
  rpc Setup(SetupRequest) returns (SetupResponse);
  // Keeps a new service account token once op accepts it, or without asking when told not to verify
  rpc Token(TokenRequest) returns (TokenResponse);
  // Binds a variable to the reference it resolves from
  rpc Map(MapRequest) returns (MapResponse);
  // Takes the reference of a variable away
  rpc Unmap(UnmapRequest) returns (UnmapResponse);
  // Resolves every reference now and says what the next start would do with each, setting them for the profile when asked
  rpc Sync(SyncRequest) returns (SyncResponse);
  // Turns the store off, its references staying in the settings
  rpc Disable(DisableRequest) returns (DisableResponse);
}

message StateRequest {
  // Profile whose store is read, the one in use when empty
  string profile = 1;
}

message Reference {
  string env = 1;
  string reference = 2;
}

message StateResponse {
  bool enabled = 1;
  string account = 2;
  // Variable holding a service account token, and whether it holds one
  string token_env = 3;
  bool token_set = 4;
  bool override = 5;
  // Seconds resolved values are reused for
  int64 cache_ttl = 6;
  // op program found and its version, empty when there is none
  string binary = 7;
  string version = 8;
  // Path of the program the settings pin, empty for one found on the search path
  string binary_path = 9;
  repeated Reference references = 10;
  // Who op is signed in as with no token, empty when it is not or a token is set
  string session = 11;
  string env_path = 12;
}

message SetupRequest {
  string profile = 1;
  string account = 2;
  string token_env = 3;
  string token = 4;
  string binary_path = 5;
}

message SetupResponse {
  string binary = 1;
  string version = 2;
  string account = 3;
  string token_env = 4;
  // A new token was kept in the .env, one already in the environment is used, or neither
  bool saved_token = 5;
  bool env_token = 6;
  // Who op is signed in as, empty when it is not
  string identity = 7;
  string env_path = 8;
  // The op program was not found, at the path given when there is one, and nothing was changed
  bool binary_missing = 9;
  string binary_path = 10;
}

message TokenRequest {
  string profile = 1;
  string token = 2;
  bool verify = 3;
}

message TokenResponse {
  // Who op signs in as with the token, when it was checked
  string identity = 1;
  // op refused the token, or could not be found to check it, and nothing was kept
  bool rejected = 2;
  bool binary_missing = 3;
  string env_path = 4;
  string token_env = 5;
  bool disabled = 6;
}

message MapRequest {
  string profile = 1;
  string env = 2;
  string reference = 3;
}

message MapResponse {
  // Reference as kept, empty when the pair was refused for the warnings
  string reference = 1;
  repeated string warnings = 2;
  bool enabled = 3;
}

message UnmapRequest {
  string profile = 1;
  string env = 2;
}

message UnmapResponse {
  // The variable had a reference
  bool mapped = 1;
}

message SyncRequest {
  string profile = 1;
  bool apply = 2;
}

// What the next start would do with one variable: export, override, skip_set, skip_token or unresolved; exported or skipped once a sync
// set them
message Row {
  string name = 1;
  string action = 2;
}

message SyncResponse {
  repeated Row rows = 1;
  repeated string warnings = 2;
  int32 exported = 3;
}

message DisableRequest {
  string profile = 1;
}

message DisableResponse {}
