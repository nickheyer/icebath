syntax = "proto3";

package icebath.plugins.web.v1;

service WebService {
  // Web backends of a profile and how each of them stands
  rpc List(ListRequest) returns (ListResponse);
  // Chooses what a backend is used for and its plan, clearing what the choice replaces, and says what is in use for what now; no backend
  // leaves every choice to Automatic
  rpc Choose(ChooseRequest) returns (ChooseResponse);
}

// One way of using a backend
message Plan {
  string title = 1;
  // Price and needs in a few words, such as "free · no key"
  string badge = 2;
  string description = 3;
  // Plan it pins in web.provider_tier, free or paid, empty for none
  string tier = 4;
  // Setting of the key it asks for, empty when it asks for none
  string key = 5;
  // What to ask for the key, and where to get one
  string prompt = 6;
  string link = 7;
  // What a person gives before the plan works
  Needs needs = 8;
  // Kind of provider whose sign-in the plan runs on, empty for none
  string sign_in = 9;
}

// What a plan asks a person for
enum Needs {
  NEEDS_UNSPECIFIED = 0;
  // Nothing: it answers as it is
  NEEDS_NOTHING = 1;
  NEEDS_API_KEY = 2;
  // The address of a server of the person's own
  NEEDS_ADDRESS = 3;
  // A sign-in at a provider
  NEEDS_SIGN_IN = 4;
}

message Backend {
  // As web.backend names it
  string name = 1;
  string title = 2;
  string description = 3;
  // Answers searches, reads pages
  bool search = 4;
  bool extract = 5;
  // Set up: its key or address set, or chosen where choosing is enough
  bool ready = 6;
  // Can answer on a free plan now
  bool free = 7;
  // Plan pinned in web.provider_tier: free, paid or auto
  string tier = 8;
  // Answers web_search, reads the pages of web_extract
  bool searching = 9;
  bool reading = 10;
  // Takes turns with the other free backends answering, nothing being set up
  bool rotating = 11;
  // Used only once chosen by name
  bool explicit = 12;
  // Settings a person sets to use it
  repeated string settings = 13;
  repeated Plan plans = 14;
  // How it stands in the state words, such as In use, Ready, Free or Needs an API key
  string state = 15;
  // Can answer as it is: set up, or free
  bool usable = 16;
  // Key of the section of its own settings, empty when it has none
  string section = 17;
}

message ListRequest {
  // Profile to read, the one in use when empty
  string profile = 1;
}

message ListResponse {
  repeated Backend backends = 1;
  // Backend chosen in web.backend, web.search_backend and web.extract_backend, empty for none
  string backend = 2;
  string search_backend = 3;
  string extract_backend = 4;
  // Whether web_search and web_extract are offered
  bool available = 5;
  // Whether free plans may answer
  bool free = 6;
  // Plans pinned per backend in web.provider_tier
  map<string, string> tiers = 7;
  // What answers searches and reads pages now, a sentence
  string serving = 8;
}

// What a backend is chosen for
enum Use {
  // Left as it is, when only the plan changes
  USE_UNSPECIFIED = 0;
  // Searches and pages
  USE_BOTH = 1;
  USE_SEARCH = 2;
  USE_PAGES = 3;
}

message ChooseRequest {
  // Profile to change, the one in use when empty
  string profile = 1;
  // Backend chosen, empty for Automatic
  string backend = 2;
  Use use = 3;
  // Plan of the backend: free, paid or auto; empty leaves it as it is
  string plan = 4;
}

message ChooseResponse {
  // What is in use for what now, one sentence
  string note = 1;
}
