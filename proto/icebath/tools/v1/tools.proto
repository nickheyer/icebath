syntax = "proto3";

package icebath.tools.v1;

service ToolService {
  rpc List(ListRequest) returns (ListResponse);
}

message Tool {
  string name = 1;
  string toolset = 2;
  string description = 3;
  bool available = 4;
  // Name shown in the app, such as "Read file"
  string title = 5;
  // Theme glyph the tool is marked with, such as "read" or "shell"
  string icon = 6;
  // Argument whose value names what a call works on, such as "path"
  string subject = 7;
  // Turned off in the settings
  bool disabled = 8;
  // What the tool lets the agent do, in a phrase written for a person; the description is written for the model
  string about = 9;
  // Heading the app lists the tool under, the title of its toolset
  string group = 10;
}

message ListRequest {}

message ListResponse {
  repeated Tool tools = 1;
}
