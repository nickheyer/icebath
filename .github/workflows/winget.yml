name: winget

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, the latest release when empty
        type: string
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}
          case $tag in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a release tag"; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Require a green release run for the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          green=$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -b "$TAG" --json conclusion -q '[.[] | select(.conclusion == "success")] | length')
          [ "$green" -ge 1 ] || { echo "::error::no release workflow run for $TAG has succeeded, rerun its failed jobs first"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Render the manifests from the release checksums and publish date
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -D "$RUNNER_TEMP" --clobber
          published=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
          packaging/winget/render.sh "$TAG" "$RUNNER_TEMP/checksums.txt" "${published%%T*}" "$RUNNER_TEMP/winget"
      - name: Validate the manifests against the WinGet schemas of the version they declare
        run: |
          pipx install check-jsonschema
          packaging/winget/validate.sh "$RUNNER_TEMP/winget"
      - name: Submit the manifests to microsoft/winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: packaging/winget/submit.sh "$RUNNER_TEMP/winget"
