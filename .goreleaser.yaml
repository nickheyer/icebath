version: 2
project_name: icebath

before:
  hooks:
    - go mod download

builds:
  - id: icebath
    main: ./cmd/icebath
    binary: icebath
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # Compiles in the pure Go olm that Matrix end to end encryption needs
    tags: [goolm]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  # Container init, supervisor and s6 verbs shipped only inside the image
  - id: icebath-init
    main: ./cmd/icebath-init
    binary: icebath-init
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    ids: [icebath]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, THIRD_PARTY_NOTICES, README.md, cli-config.yaml.example, .env.example]
  - id: binary
    ids: [icebath]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

source:
  enabled: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: nickheyer
    name: icebath

nfpms:
  - id: packages
    ids: [icebath]
    package_name: icebath
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Nicholas W. Heyer
    homepage: https://icebath.app
    maintainer: Nicholas W. Heyer <nick@heyer.app>
    description: A tiling agentic harness and netrunner toolkit for a deep dive beyond the blackwall
    license: MIT
    section: utils
    formats: [deb, rpm, apk]
    dependencies: [ca-certificates]
    bindir: /usr/lib/icebath
    contents:
      - src: /usr/lib/icebath/icebath
        dst: /usr/bin/icebath
        type: symlink
      - src: packaging/install_method/dpkg
        dst: /usr/lib/icebath/.install_method
        packager: deb
      - src: packaging/install_method/rpm
        dst: /usr/lib/icebath/.install_method
        packager: rpm
      - src: packaging/install_method/apk
        dst: /usr/lib/icebath/.install_method
        packager: apk
      - src: cli-config.yaml.example
        dst: /usr/lib/icebath/cli-config.yaml.example
      - src: .env.example
        dst: /usr/lib/icebath/.env.example
      - src: LICENSE
        dst: /usr/share/licenses/icebath/LICENSE
      - src: THIRD_PARTY_NOTICES
        dst: /usr/share/licenses/icebath/THIRD_PARTY_NOTICES
    scripts:
      postinstall: packaging/scripts/postinstall.sh
    rpm:
      signature:
        key_file: "{{ .Env.REPO_GPG_KEY_FILE }}"
    apk:
      scripts:
        postupgrade: packaging/scripts/postinstall.sh
      signature:
        key_file: "{{ .Env.APK_RSA_KEY_FILE }}"
        key_name: icebath

dockers_v2:
  - ids: [icebath, icebath-init]
    images: [ghcr.io/nickheyer/icebath]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    extra_files: [LICENSE, THIRD_PARTY_NOTICES, README.md, cli-config.yaml.example, .env.example, docker/SOUL.md, docker/profile-icebath-path.sh]
    build_args:
      BINARY_SOURCE: release
      VERSION: "{{ .Version }}"
      REVISION: "{{ .FullCommit }}"
    labels:
      org.opencontainers.image.source: https://github.com/nickheyer/icebath
      org.opencontainers.image.description: Tiling agentic harness and netrunner toolkit
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"

