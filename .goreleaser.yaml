homebrew_casks:
  - name: icebath
    ids: [archive]
    binaries: [icebath]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    hooks:
      post:
        install: |
          File.write("#{staged_path}/.install_method", "homebrew\n")
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/icebath"]
          end
          Dir.mktmpdir do |home|
            system_command "#{staged_path}/icebath", args: ["pm", "install", "--extra", "nemo-relay"],
                           env: { "ICEBATH_HOME" => home }, print_stdout: true, print_stderr: true, must_succeed: true
          end
    repository:
      owner: nickheyer
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:nickheyer/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY }}"

scoops:
  - name: icebath
    ids: [archive]
    post_install:
      - "Set-Content -Path \"$dir\\.install_method\" -Value 'scoop' -Encoding ascii"
      - "$icebathHome = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())"
      - "$env:ICEBATH_HOME = $icebathHome; & \"$dir\\icebath.exe\" pm install --extra nemo-relay; $relayExit = $LASTEXITCODE; Remove-Item Env:ICEBATH_HOME"
      - "Remove-Item -Recurse -Force $icebathHome -ErrorAction SilentlyContinue"
      - "if ($relayExit -ne 0) { throw \"NeMo Relay runtime provisioning failed with exit code $relayExit\" }"
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:nickheyer/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_KEY }}"

winget:
  - name: icebath
    ids: [archive]
    package_identifier: nickheyer.icebath
    package_name: icebath
    publisher: Nicholas W. Heyer
    publisher_url: https://github.com/nickheyer
    publisher_support_url: https://github.com/nickheyer/icebath/issues
    author: Nicholas W. Heyer
    homepage: https://icebath.app
    short_description: Tiling agentic harness and netrunner toolkit
    description: A tiling agentic harness and netrunner toolkit for a deep dive beyond the blackwall.
    license: MIT
    license_url: https://github.com/nickheyer/icebath/blob/main/LICENSE
    copyright: Copyright (c) 2026 Nicholas W. Heyer
    release_notes_url: https://github.com/nickheyer/icebath/releases/tag/{{ .Tag }}
    tags: [cli, tui, agent, ai, llm]
    skip_upload: true
    repository:
      owner: nickheyer
      name: winget-pkgs

aurs:
  - name: icebath-bin
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath]
    install: packaging/aur/icebath.install
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath-bin.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/lib/icebath/icebath"
      printf 'pacman\n' | install -Dm644 /dev/stdin "${pkgdir}/usr/lib/icebath/.install_method"
      install -dm755 "${pkgdir}/usr/bin"
      ln -s /usr/lib/icebath/icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"

aur_sources:
  - name: icebath
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath-bin]
    depends: [glibc]
    makedepends: [go]
    install: packaging/aur/icebath.install
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    prepare: |-
      go mod download
    build: |-
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -tags goolm -o icebath -ldflags="-linkmode=external -X main.version=v${pkgver}" ./cmd/icebath
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/lib/icebath/icebath"
      printf 'pacman\n' | install -Dm644 /dev/stdin "${pkgdir}/usr/lib/icebath/.install_method"
      install -dm755 "${pkgdir}/usr/bin"
      ln -s /usr/lib/icebath/icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"

nix:
  - name: icebath
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: mit
    main_program: icebath
    dependencies:
      - name: python314
      - name: unzip
      - name: patchelf
        os: linux
    extra_install: |-
      printf 'nix\n' > $out/bin/.install_method
      ${let wheels = { x86_64-linux = { url = "https://files.pythonhosted.org/packages/b1/bf/9978ec3f8e5ee0dd1d2c7c1abba5f7358e0ae340d41bf1722097f3f19e1d/nemo_relay-0.11.0-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"; sha256 = "146aecca2cb3d9c7490084fac83f838c09588ddce9360c942dcd1f2660d23f21"; }; aarch64-linux = { url = "https://files.pythonhosted.org/packages/93/5c/eed59ecb29abe4eb0661e6a807efaf24749b3fc9a381449bfc78f94bd34d/nemo_relay-0.11.0-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"; sha256 = "b5c4d07ecfa35e09cf64c625c970778d8b0596143473ec29c25a8b33efa5c53c"; }; aarch64-darwin = { url = "https://files.pythonhosted.org/packages/49/41/49e6ac6733ef92e0a7a5e84bb5cac17e75e82218b2f55d6166dc4de0e0db/nemo_relay-0.11.0-cp311-abi3-macosx_11_0_arm64.whl"; sha256 = "26bf5b96d23ef39971b8c7721e8d74a78f59498b3b4922ce2b137da52043dcb4"; }; }; site = "$out/bin/venv/${python314.sitePackages}"; in lib.optionalString (wheels ? ${system}) "${python314.interpreter} -m venv --without-pip $out/bin/venv && ${unzip}/bin/unzip -q ${fetchurl wheels.${system}} -d ${site}${lib.optionalString stdenvNoCC.isLinux " && ${patchelf}/bin/patchelf --add-rpath ${python314.stdenv.cc.cc.lib}/lib ${site}/nemo_relay/_native.abi3.so"}"}
    path: pkgs/icebath/default.nix
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: nixpkg
      branch: main
      git:
        url: git@github.com:nickheyer/nixpkg.git
        private_key: "{{ .Env.NIXPKG_KEY }}"
