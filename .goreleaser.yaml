homebrew_casks:
  - name: icebath
    ids: [archive]
    binaries: [icebath]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    hooks:
      post:
        install: |
          File.write("#{staged_path}/.install_method", "homebrew\n")
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/icebath"]
          end
    repository:
      owner: nickheyer
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:nickheyer/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY }}"

scoops:
  - name: icebath
    ids: [archive]
    post_install:
      - "Set-Content -Path \"$dir\\.install_method\" -Value 'scoop' -Encoding ascii"
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:nickheyer/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_KEY }}"

aurs:
  - name: icebath-bin
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath]
    install: packaging/aur/icebath.install
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath-bin.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/lib/icebath/icebath"
      printf 'pacman\n' | install -Dm644 /dev/stdin "${pkgdir}/usr/lib/icebath/.install_method"
      install -Dm644 ./cli-config.yaml.example "${pkgdir}/usr/lib/icebath/cli-config.yaml.example"
      install -Dm644 ./.env.example "${pkgdir}/usr/lib/icebath/.env.example"
      install -dm755 "${pkgdir}/usr/bin"
      ln -s /usr/lib/icebath/icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"
      install -Dm644 ./THIRD_PARTY_NOTICES "${pkgdir}/usr/share/licenses/icebath/THIRD_PARTY_NOTICES"

aur_sources:
  - name: icebath
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath-bin]
    depends: [glibc]
    makedepends: [go]
    install: packaging/aur/icebath.install
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    prepare: |-
      go mod download
    build: |-
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -tags goolm -o icebath -ldflags="-linkmode=external -X main.version=v${pkgver}" ./cmd/icebath
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/lib/icebath/icebath"
      printf 'pacman\n' | install -Dm644 /dev/stdin "${pkgdir}/usr/lib/icebath/.install_method"
      install -Dm644 ./cli-config.yaml.example "${pkgdir}/usr/lib/icebath/cli-config.yaml.example"
      install -Dm644 ./.env.example "${pkgdir}/usr/lib/icebath/.env.example"
      install -dm755 "${pkgdir}/usr/bin"
      ln -s /usr/lib/icebath/icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"
      install -Dm644 ./THIRD_PARTY_NOTICES "${pkgdir}/usr/share/licenses/icebath/THIRD_PARTY_NOTICES"

nix:
  - name: icebath
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: mit
    main_program: icebath
    extra_install: |-
      printf 'nix\n' > $out/bin/.install_method
      install -Dm644 ./cli-config.yaml.example $out/bin/cli-config.yaml.example
      install -Dm644 ./.env.example $out/bin/.env.example
      install -Dm644 ./LICENSE $out/share/licenses/icebath/LICENSE
      install -Dm644 ./THIRD_PARTY_NOTICES $out/share/licenses/icebath/THIRD_PARTY_NOTICES
    path: pkgs/icebath/default.nix
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: nixpkg
      branch: main
      git:
        url: git@github.com:nickheyer/nixpkg.git
        private_key: "{{ .Env.NIXPKG_KEY }}"
