version: 2
project_name: icebath

builds:
  - id: icebath
    main: ./cmd/icebath
    binary: icebath
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    ids: [icebath]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
  - id: binary
    ids: [icebath]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

source:
  enabled: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: nickheyer
    name: icebath
  extra_files:
    - glob: dist/winget/manifests/**/*.yaml

nfpms:
  - id: packages
    ids: [icebath]
    package_name: icebath
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Nicholas W. Heyer
    homepage: https://icebath.app
    maintainer: Nicholas W. Heyer <nick@heyer.app>
    description: A tiling agentic harness and netrunner toolkit for a deep dive beyond the blackwall
    license: MIT
    section: utils
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/icebath/LICENSE
    rpm:
      signature:
        key_file: "{{ .Env.REPO_GPG_KEY_FILE }}"
    apk:
      signature:
        key_file: "{{ .Env.APK_RSA_KEY_FILE }}"
        key_name: icebath

dockers_v2:
  - ids: [icebath]
    images: [ghcr.io/nickheyer/icebath]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/nickheyer/icebath
      org.opencontainers.image.description: Tiling agentic harness and netrunner toolkit
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"

