homebrew_casks:
  - name: icebath
    ids: [archive]
    binaries: [icebath]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/icebath"]
          end
    repository:
      owner: nickheyer
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:nickheyer/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY }}"

scoops:
  - name: icebath
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:nickheyer/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_KEY }}"

winget:
  - name: icebath
    ids: [archive]
    package_identifier: nickheyer.icebath
    package_name: icebath
    publisher: Nicholas W. Heyer
    publisher_url: https://github.com/nickheyer
    publisher_support_url: https://github.com/nickheyer/icebath/issues
    author: Nicholas W. Heyer
    homepage: https://icebath.app
    short_description: Tiling agentic harness and netrunner toolkit
    description: A tiling agentic harness and netrunner toolkit for a deep dive beyond the blackwall.
    license: MIT
    license_url: https://github.com/nickheyer/icebath/blob/main/LICENSE
    copyright: Copyright (c) 2026 Nicholas W. Heyer
    release_notes_url: https://github.com/nickheyer/icebath/releases/tag/{{ .Tag }}
    tags: [cli, tui, agent, ai, llm]
    skip_upload: true
    repository:
      owner: nickheyer
      name: winget-pkgs

aurs:
  - name: icebath-bin
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath]
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath-bin.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"

aur_sources:
  - name: icebath
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: MIT
    maintainers: ["Nicholas W. Heyer <nick at heyer dot app>"]
    provides: [icebath]
    conflicts: [icebath-bin]
    depends: [glibc]
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/icebath.git
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    prepare: |-
      go mod download
    build: |-
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -o icebath -ldflags="-linkmode=external -X main.version=v${pkgver}" ./cmd/icebath
    package: |-
      install -Dm755 ./icebath "${pkgdir}/usr/bin/icebath"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/icebath/LICENSE"

nix:
  - name: icebath
    ids: [archive]
    homepage: https://icebath.app
    description: Tiling agentic harness and netrunner toolkit
    license: mit
    main_program: icebath
    path: pkgs/icebath/default.nix
    commit_author:
      name: nickheyer
      email: nick@heyer.app
    repository:
      owner: nickheyer
      name: nixpkg
      branch: main
      git:
        url: git@github.com:nickheyer/nixpkg.git
        private_key: "{{ .Env.NIXPKG_KEY }}"
